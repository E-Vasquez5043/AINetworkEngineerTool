": "If a vendor's or a partner's router will not peer and you have ruled out ASN, subnet, and auth, this is the next thing to check \u2014 some non-Cisco EIGRP implementations and some appliance defaults ship with non-default K-values."}], "when": "Almost never as a change; frequently as a diagnostic. Read K-values from 'show ip protocols' on both routers when an adjacency will not form.", "whenNot": "Do not enable K2, K4 or K5 to 'account for congestion'. Load and reliability are moving averages, so the metric never settles, DUAL recomputes constantly, and you get flapping routes across the whole AS. Never issue this command in-band on a production router \u2014 every neighbour in the AS drops immediately and does not return until every peer is changed to match.", "safety": "danger", "related": ["eigrpx-default-metric", "eigrpx-variance", "eigrpx-offset-list", "eigrpx-neighbors-detail", "cisco-eigrp-nei"], "tags": ["eigrp", "metric", "k-values", "adjacency", "troubleshooting", "advanced"], "equivalents": {"juniper": "set protocols ospf reference-bandwidth 100g (nearest analog: change how cost is derived)", "paloalto": "set network virtual-router VR1 protocol ospf global-bfd profile None", "linux": "vtysh -c 'configure terminal' -c 'router eigrp 100' -c 'metric weights 0 1 0 1 0 0'"}, "sandboxOutput": "R1(config)#router eigrp 100\nR1(config-router)#metric weights 0 1 0 1 1 0\nR1(config-router)#\n*Jul 25 14:31:47.117: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.12.2 (GigabitEthernet0/0) is down: metric changed\n*Jul 25 14:31:53.402: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.12.2 (GigabitEthernet0/0) is down: K-value mismatch\nR1(config-router)#end\nR1#show ip eigrp neighbors\nEIGRP-IPv4 Neighbors for AS(100)\nH   Address                 Interface              Hold Uptime   SRTT   RTO  Q  Seq\n                                                   (sec)         (ms)       Cnt Num\n\nR1#show ip protocols | include Metric weight\n    Metric weight K1=1, K2=0, K3=1, K4=1, K5=0"}, {"id": "eigrpx-topology-active", "vendor": "cisco", "family": "IOS/XE", "mode": "exec", "cmd": "show ip eigrp topology active", "aliases": ["sh ip eigrp topo active", "sh ip eig top active", "show ip eigrp topology active"], "purpose": "Shows only the prefixes currently in the ACTIVE state \u2014 routes for which DUAL has lost its successor, sent queries, and is still waiting on replies. This is the first command to run when you suspect Stuck-In-Active.", "tokens": [{"t": "show ip eigrp", "d": "EIGRP operational data"}, {"t": "topology", "d": "DUAL topology table, not the RIB"}, {"t": "active", "d": "Filter to routes in the ACTIVE (converging) state only"}], "syntax": "show ip eigrp [vrf <NAME>] topology [active | all-links | zero-successors | <PREFIX>/<LEN> | detail-links]", "flags": [{"f": "active", "d": "Only prefixes DUAL is currently querying for"}, {"f": "all-links", "d": "Shows every path including non-feasible ones \u2014 use it to prove WHY there is no feasible successor"}, {"f": "zero-successors", "d": "Prefixes with no usable path at all"}, {"f": "<PREFIX>/<LEN>", "d": "Per-prefix detail with vector metric and external data"}], "sample": "R1#show ip eigrp topology active\nEIGRP-IPv4 Topology Table for AS(100)/ID(1.1.1.1)\nCodes: P - Passive, A - Active, U - Update, Q - Query, R - Reply,\n       r - reply Status, s - sia status\n\nA  10.30.30.0/24, 1 successors, FD is 3328, Q\n    1 replies, active 00:02:41, query-origin: Successor Origin\n        via 10.1.12.2 (Infinity/Infinity), GigabitEthernet0/0\n        Remaining replies:\n             via 10.1.13.3, r, s, GigabitEthernet0/1\n\nR1#\n*Jul 25 14:44:12.771: %DUAL-3-SIA: Route 10.30.30.0/24 stuck-in-active state in IP-EIGRP(0) 100. Cleaning up\n*Jul 25 14:44:12.775: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.13.3 (GigabitEthernet0/1) is down: stuck in active", "annotations": [{"field": "A (Active)", "note": "The route has no feasible successor, so DUAL had to query neighbours instead of switching locally. Healthy networks show an empty active table almost all the time."}, {"field": "active 00:02:41", "note": "How long the route has been active. The default active timer is 3 minutes \u2014 this route is 19 seconds from being declared SIA."}, {"field": "Remaining replies: via 10.1.13.3, r", "note": "'r' means we are still waiting on a reply from that neighbour. The neighbour holding you up is named right here \u2014 go to that router next."}, {"field": "s (sia status)", "note": "An SIA-Query has already been sent to that peer. If it answers with SIA-Reply the adjacency survives; silence means the peer is CPU-starved, the link is lossy, or the query fanned out further and got stuck deeper in the network."}, {"field": "(Infinity/Infinity)", "note": "The old successor reported unreachable. That is what triggered the ACTIVE state."}, {"field": "query-origin: Successor Origin", "note": "The query started because our own successor went away. 'Local origin' means we initiated it; 'Multiple Origins' means several neighbours diverged at once \u2014 a sign of a wide, unbounded query domain."}, {"field": "%DUAL-3-SIA + is down: stuck in active", "note": "The punchline: EIGRP tears down the adjacency with the silent neighbour to force reconvergence. Real causes are unbounded query scope (no summarisation, no stub routers), an overloaded remote CPU, a unidirectional or lossy link, or an MTU mismatch that blackholes the large reply packet."}], "when": "During a convergence incident, when routes flap, or the moment you see %DUAL-3-SIA in the log. Run it repeatedly \u2014 active entries are transient by design.", "whenNot": "Not useful as a health check on a stable network; it will simply be empty. Do not use it to view installed paths \u2014 that is 'show ip route' or plain 'show ip eigrp topology'.", "safety": "safe", "related": ["eigrpx-timers-active-time", "eigrpx-neighbors-detail", "eigrpx-distribute-list-route-map", "eigrpx-variance", "cisco-sh-ip-route"], "tags": ["eigrp", "sia", "dual", "convergence", "troubleshooting", "advanced"], "equivalents": {"juniper": "show ospf database summary", "paloalto": "show routing protocol ospf dumplsdb", "linux": "vtysh -c 'show ip eigrp topology'"}, "sandboxOutput": "R1#show ip eigrp topology active\nEIGRP-IPv4 Topology Table for AS(100)/ID(1.1.1.1)\nCodes: P - Passive, A - Active, U - Update, Q - Query, R - Reply,\n       r - reply Status, s - sia status\n\nA  10.30.30.0/24, 1 successors, FD is 3328, Q\n    1 replies, active 00:02:41, query-origin: Successor Origin\n        via 10.1.12.2 (Infinity/Infinity), GigabitEthernet0/0\n        Remaining replies:\n             via 10.1.13.3, r, s, GigabitEthernet0/1\n\nR1#\n*Jul 25 14:44:12.771: %DUAL-3-SIA: Route 10.30.30.0/24 stuck-in-active state in IP-EIGRP(0) 100. Cleaning up\n*Jul 25 14:44:12.775: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.13.3 (GigabitEthernet0/1) is down: stuck in active"}, {"id": "eigrpx-timers-active-time", "vendor": "cisco", "family": "IOS/XE", "mode": "config", "cmd": "timers active-time <MINUTES>", "aliases": ["timers active-time 3", "timers active-time 1", "timers active-time disabled"], "purpose": "Sets how long DUAL waits for replies before declaring a route Stuck-In-Active and tearing down the unresponsive adjacency. Default is 3 minutes.", "tokens": [{"t": "timers", "d": "EIGRP process timers"}, {"t": "active-time", "d": "The SIA timer for routes in the ACTIVE state"}, {"t": "<MINUTES>", "d": "1-65535 minutes, or the keyword 'disabled'"}], "syntax": "timers active-time {<1-65535> | disabled}", "flags": [{"f": "3 (default)", "d": "Three minutes. IOS also sends an SIA-Query at the halfway point to check the peer is alive."}, {"f": "disabled", "d": "EIGRP waits forever. The route stays active indefinitely instead of tearing down the adjacency."}, {"f": "Named-mode location", "d": "Configure it under 'topology base' inside the address-family"}, {"f": "SIA-Query / SIA-Reply", "d": "Modern IOS uses these to distinguish 'peer is dead' from 'peer is still working on it', which makes lowering the timer much less necessary than it once was"}], "sample": "R1(config)#router eigrp 100\nR1(config-router)#timers active-time 3\nR1(config-router)#end\nR1#show ip protocols | section Topology\n    Topology : 0 (base)\n      Active Timer: 3 min\n      Distance: internal 90 external 170\n      Maximum path: 4\n      Maximum hopcount 100\n      Maximum metric variance 1\nR1#show ip eigrp topology active\nEIGRP-IPv4 Topology Table for AS(100)/ID(1.1.1.1)\nCodes: P - Passive, A - Active, U - Update, Q - Query, R - Reply,\n       r - reply Status, s - sia status\n\nR1#", "annotations": [{"field": "Active Timer: 3 min", "note": "Read it back here after any change. This value applies per topology, so in named mode confirm you set it under the right 'topology base' block."}, {"field": "Empty active table", "note": "What healthy looks like. If entries persist here for tens of seconds routinely, your query domain is too large \u2014 fix that with summarisation and stub routers rather than by adjusting this timer."}, {"field": "Raising the timer", "note": "Buys slow peers more time to reply and avoids nuisance adjacency resets, at the cost of prolonging the black hole while the prefix is unresolved."}, {"field": "timers active-time disabled", "note": "Prevents SIA teardowns entirely. Legitimate on a lab or during a controlled investigation, but in production it converts a self-healing 3-minute event into an indefinite unresolved route with no log alarm."}, {"field": "Real fix for SIA", "note": "Bound the query domain: 'eigrp stub' on branch routers, summary-address at aggregation points, and fix the underlying lossy link or MTU mismatch. The timer only changes when you notice the problem."}], "when": "Tuning convergence behaviour on a large or slow network, or temporarily disabling SIA teardown while you capture what an unresponsive peer is actually doing.", "whenNot": "Do not use it as the fix for recurring SIA events \u2014 it treats the symptom. And do not leave 'disabled' configured after an investigation; you remove EIGRP's own recovery mechanism.", "safety": "caution", "related": ["eigrpx-topology-active", "eigrpx-named-topology-base", "eigrpx-neighbors-detail", "eigrpx-distribute-list-route-map"], "tags": ["eigrp", "sia", "timers", "convergence", "troubleshooting", "advanced"], "equivalents": {"juniper": "set protocols ospf spf-options delay 200", "paloalto": "set network virtual-router VR1 protocol ospf timers spf-calculation-delay 5", "linux": "vtysh -c 'show ip eigrp topology'"}, "sandboxOutput": "R1(config)#router eigrp 100\nR1(config-router)#timers active-time 3\nR1(config-router)#end\nR1#show ip protocols | section Topology\n    Topology : 0 (base)\n      Active Timer: 3 min\n      Distance: internal 90 external 170\n      Maximum path: 4\n      Maximum hopcount 100\n      Maximum metric variance 1\nR1#show ip eigrp topology active\nEIGRP-IPv4 Topology Table for AS(100)/ID(1.1.1.1)\nCodes: P - Passive, A - Active, U - Update, Q - Query, R - Reply,\n       r - reply Status, s - sia status\n\nR1#"}, {"id": "eigrpx-ipv6-router-eigrp", "vendor": "cisco", "family": "IOS/XE", "mode": "config", "cmd": "ipv6 router eigrp <ASN>", "aliases": ["ipv6 router eigrp 100", "ipv6 router eigrp 65001"], "purpose": "Creates a classic-mode EIGRP for IPv6 process. Unlike IPv4 there are no network statements \u2014 interfaces are enabled individually with 'ipv6 eigrp <ASN>' \u2014 and on many IOS versions the process starts administratively shut down.", "tokens": [{"t": "ipv6", "d": "IPv6 address family"}, {"t": "router eigrp", "d": "EIGRP routing process"}, {"t": "<ASN>", "d": "1-65535, must match neighbours. Independent of any IPv4 EIGRP AS on the same box."}], "syntax": "ipv6 router eigrp <1-65535>", "flags": [{"f": "no shutdown", "d": "Required on many IOS releases \u2014 the process is created in shutdown state and forms no adjacencies until you unshut it"}, {"f": "eigrp router-id <A.B.C.D>", "d": "Mandatory if the router has no IPv4 address anywhere; the RID is still a 32-bit dotted-quad"}, {"f": "passive-interface <intf>", "d": "Same semantics as IPv4"}, {"f": "redistribute <protocol>", "d": "Seed metric rules are identical to IPv4 EIGRP"}, {"f": "ipv6 unicast-routing", "d": "Global prerequisite \u2014 without it nothing IPv6 routes at all"}], "sample": "R1(config)#ipv6 unicast-routing\nR1(config)#ipv6 router eigrp 100\nR1(config-rtr)#eigrp router-id 1.1.1.1\nR1(config-rtr)#no shutdown\nR1(config-rtr)#end\nR1#show ipv6 protocols\nIPv6 Routing Protocol is \"connected\"\nIPv6 Routing Protocol is \"ND\"\nIPv6 Routing Protocol is \"eigrp 100\"\n  EIGRP-IPv6 Protocol for AS(100)\n    Metric weight K1=1, K2=0, K3=1, K4=0, K5=0\n    NSF-aware route hold timer is 240\n    Router-ID: 1.1.1.1\n    Topology : 0 (base)\n      Active Timer: 3 min\n      Distance: internal 90 external 170\n      Maximum path: 16\n      Maximum hopcount 100\n      Maximum metric variance 1\n  Interfaces:\n    GigabitEthernet0/0\n  Redistribution:\n    None", "annotations": [{"field": "R1(config-rtr)#", "note": "Note the prompt: IPv6 EIGRP uses config-rtr, not config-router. If you see config-rtr you are in the IPv6 process."}, {"field": "no shutdown", "note": "The single most common IPv6 EIGRP mistake. Config looks perfect, interfaces are enabled, and no neighbours form because the process is shut. Check 'show ipv6 protocols' \u2014 a shut process does not list Interfaces."}, {"field": "Router-ID: 1.1.1.1", "note": "Still a 32-bit dotted quad even in IPv6. On an IPv6-only router with no IPv4 addresses the process will not start until you set this manually."}, {"field": "Interfaces:", "note": "Lists interfaces where 'ipv6 eigrp 100' has been applied. There is no 'Routing for Networks' section because IPv6 EIGRP has no network statements."}, {"field": "Maximum path: 16", "note": "IPv6 EIGRP defaults to 16 parallel paths on modern IOS-XE versus 4 for classic IPv4 EIGRP \u2014 a genuine behavioural difference, not a typo."}], "when": "Dual-stack builds on IOS releases where you are keeping classic-mode configuration, or brownfield routers that already run classic IPv4 EIGRP.", "whenNot": "On new IOS-XE work prefer named mode: 'router eigrp CORP' plus 'address-family ipv6 unicast autonomous-system 100' gives you one instance for both families and access to SHA authentication. Also do not expect this process to share anything with IPv4 EIGRP of the same AS number \u2014 they are entirely separate.", "safety": "caution", "related": ["eigrpx-ipv6-eigrp-interface", "eigrpx-show-ipv6-neighbors", "eigrpx-named-address-family", "eigrpx-metric-weights"], "tags": ["eigrp", "ipv6", "routing", "dual-stack", "advanced"], "equivalents": {"juniper": "set protocols ospf3 area 0.0.0.0 interface ge-0/0/0.0", "paloalto": "set network virtual-router VR1 protocol ospfv3 enable yes", "linux": "vtysh -c 'configure terminal' -c 'router ospf6'"}, "sandboxOutput": "R1(config)#ipv6 unicast-routing\nR1(config)#ipv6 router eigrp 100\nR1(config-rtr)#eigrp router-id 1.1.1.1\nR1(config-rtr)#no shutdown\nR1(config-rtr)#end\nR1#show ipv6 protocols\nIPv6 Routing Protocol is \"connected\"\nIPv6 Routing Protocol is \"ND\"\nIPv6 Routing Protocol is \"eigrp 100\"\n  EIGRP-IPv6 Protocol for AS(100)\n    Metric weight K1=1, K2=0, K3=1, K4=0, K5=0\n    NSF-aware route hold timer is 240\n    Router-ID: 1.1.1.1\n    Topology : 0 (base)\n      Active Timer: 3 min\n      Distance: internal 90 external 170\n      Maximum path: 16\n      Maximum hopcount 100\n      Maximum metric variance 1\n  Interfaces:\n    GigabitEthernet0/0\n  Redistribution:\n    None"}, {"id": "eigrpx-ipv6-eigrp-interface", "vendor": "cisco", "family": "IOS/XE", "mode": "config-if", "cmd": "ipv6 eigrp <ASN>", "aliases": ["ipv6 eigrp 100", "ipv6 eigrp 65001"], "purpose": "Enables EIGRP for IPv6 on a single interface. This replaces the IPv4 network statement entirely \u2014 IPv6 EIGRP is enabled interface by interface, which is both more explicit and easier to forget.", "tokens": [{"t": "ipv6", "d": "IPv6 interface configuration"}, {"t": "eigrp", "d": "Enable EIGRP on this interface"}, {"t": "<ASN>", "d": "The autonomous system of an existing 'ipv6 router eigrp' process"}], "syntax": "ipv6 eigrp <1-65535>", "flags": [{"f": "ipv6 enable", "d": "Companion command: gives the interface a link-local address even without a global one. EIGRP for IPv6 peers over link-local addresses, so a global address is not strictly required."}, {"f": "ipv6 hello-interval eigrp <ASN> <sec>", "d": "Per-interface hello tuning"}, {"f": "ipv6 hold-time eigrp <ASN> <sec>", "d": "Per-interface hold tuning"}, {"f": "ipv6 authentication mode eigrp <ASN> md5", "d": "IPv6 equivalent of the IPv4 authentication command"}, {"f": "no ipv6 split-horizon eigrp <ASN>", "d": "IPv6 equivalent of the split-horizon override"}, {"f": "ipv6 summary-address eigrp <ASN> <prefix>/<len>", "d": "Interface-level summarisation"}], "sample": "R1(config)#interface GigabitEthernet0/0\nR1(config-if)#ipv6 address 2001:DB8:12::1/64\nR1(config-if)#ipv6 eigrp 100\nR1(config-if)#\n*Jul 25 14:41:09.883: %DUAL-5-NBRCHANGE: EIGRP-IPv6 100: Neighbor FE80::A8BB:CCFF:FE00:200 (GigabitEthernet0/0) is up: new adjacency\nR1(config-if)#end\nR1#show ipv6 route eigrp\nIPv6 Routing Table - default - 6 entries\nCodes: C - Connected, L - Local, S - Static, U - Per-user Static route\n       B - BGP, R - RIP, H - NHRP, I1 - ISIS L1, I2 - ISIS L2\n       D - EIGRP, EX - EIGRP external, ND - ND Default\nD   2001:DB8:20::/64 [90/3072]\n     via FE80::A8BB:CCFF:FE00:200, GigabitEthernet0/0", "annotations": [{"field": "Neighbor FE80::A8BB:CCFF:FE00:200", "note": "EIGRP for IPv6 peers over LINK-LOCAL addresses only. Global addressing mismatches will not stop adjacency \u2014 and matching globals will not save you if link-local is broken."}, {"field": "via FE80::...", "note": "Next hops in the IPv6 RIB are link-local too. That is why 'ping 2001:DB8:20::1' can fail while the route looks perfect: check the outgoing interface, since a link-local next hop is meaningless without one."}, {"field": "[90/3072]", "note": "Same AD 90 and the same composite metric arithmetic as IPv4 EIGRP. Nothing about the metric changes for IPv6."}, {"field": "No network statement", "note": "This interface command is the whole enablement mechanism. Adding a new IPv6 subnet does not automatically advertise it \u2014 you must touch the interface."}, {"field": "D vs EX codes", "note": "Same internal/external distinction as IPv4, with external at AD 170."}], "when": "Every interface that should run EIGRP for IPv6 in classic mode, including any interface you add later \u2014 there is no network statement to catch it for you.", "whenNot": "Not used in named mode; there you use af-interface under 'address-family ipv6 unicast'. Also pointless before the 'ipv6 router eigrp <ASN>' process exists and is un-shut.", "safety": "caution", "related": ["eigrpx-ipv6-router-eigrp", "eigrpx-show-ipv6-neighbors", "eigrpx-named-af-interface", "cisco-sh-ip-int-br"], "tags": ["eigrp", "ipv6", "interface", "link-local", "advanced"], "equivalents": {"juniper": "set protocols ospf3 area 0.0.0.0 interface ge-0/0/0.0", "paloalto": "set network virtual-router VR1 protocol ospfv3 area 0.0.0.0 interface ethernet1/1 enable yes", "linux": "vtysh -c 'configure terminal' -c 'interface eth0' -c 'ipv6 ospf6 area 0.0.0.0'"}, "sandboxOutput": "R1(config)#interface GigabitEthernet0/0\nR1(config-if)#ipv6 address 2001:DB8:12::1/64\nR1(config-if)#ipv6 eigrp 100\nR1(config-if)#\n*Jul 25 14:41:09.883: %DUAL-5-NBRCHANGE: EIGRP-IPv6 100: Neighbor FE80::A8BB:CCFF:FE00:200 (GigabitEthernet0/0) is up: new adjacency\nR1(config-if)#end\nR1#show ipv6 route eigrp\nIPv6 Routing Table - default - 6 entries\nCodes: C - Connected, L - Local, S - Static, U - Per-user Static route\n       B - BGP, R - RIP, H - NHRP, I1 - ISIS L1, I2 - ISIS L2\n       D - EIGRP, EX - EIGRP external, ND - ND Default\nD   2001:DB8:20::/64 [90/3072]\n     via FE80::A8BB:CCFF:FE00:200, GigabitEthernet0/0"}, {"id": "eigrpx-show-ipv6-neighbors", "vendor": "cisco", "family": "IOS/XE", "mode": "exec", "cmd": "show ipv6 eigrp neighbors", "aliases": ["sh ipv6 eigrp nei", "sh ipv6 eig nei", "show ipv6 eigrp neighbors detail"], "purpose": "Lists EIGRP for IPv6 adjacencies with their link-local peer addresses, hold timers and transport counters. The IPv6 counterpart of 'show ip eigrp neighbors'.", "tokens": [{"t": "show ipv6", "d": "IPv6 operational data"}, {"t": "eigrp", "d": "EIGRP for IPv6"}, {"t": "neighbors", "d": "Adjacency table"}], "syntax": "show ipv6 eigrp [vrf <NAME>] [<AS-NUMBER>] neighbors [detail | <INTERFACE>]", "flags": [{"f": "detail", "d": "Adds software version, retransmit counters, prefix count and stub flags per peer"}, {"f": "<INTERFACE>", "d": "Restrict to peers on one interface"}, {"f": "<AS-NUMBER>", "d": "Restrict to one process when several run on the box"}], "sample": "R1#show ipv6 eigrp neighbors\nEIGRP-IPv6 Neighbors for AS(100)\nH   Address                 Interface              Hold Uptime   SRTT   RTO  Q  Seq\n                                                   (sec)         (ms)       Cnt Num\n1   Link-local address:     Gi0/1                    11 00:41:07    9   100  0  31\n    FE80::A8BB:CCFF:FE00:300\n0   Link-local address:     Gi0/0                    13 01:12:44    5   100  0  27\n    FE80::A8BB:CCFF:FE00:200", "annotations": [{"field": "Link-local address:", "note": "IPv6 EIGRP identifies peers by link-local address, printed on a second wrapped line. If you see a peer here but cannot reach its global address, the problem is addressing or ACLs, not EIGRP."}, {"field": "Hold (sec)", "note": "Counts down from the hold time and resets on every hello. A value that regularly dips near zero means hellos are being lost \u2014 check for IPv6 multicast filtering or CPU punt drops."}, {"field": "Uptime", "note": "Resetting uptime across several peers at once points at a local event (process restart, K-value change, CPU spike) rather than a single bad link."}, {"field": "Q Cnt", "note": "Queued packets waiting to be sent to that peer. Persistently non-zero means the peer is not acknowledging and the adjacency is heading for a reset."}, {"field": "H", "note": "Handle \u2014 the internal index in the order peers were learned. Not a priority and not stable across a reload."}], "when": "Verifying dual-stack rollouts, and any time IPv6 routes are missing while IPv4 over the same link is fine.", "whenNot": "Will not show named-mode IPv6 peers in some releases \u2014 for a named instance use 'show eigrp address-family ipv6 neighbors'. Also does not tell you whether prefixes are being exchanged; follow with 'show ipv6 route eigrp'.", "safety": "safe", "related": ["eigrpx-ipv6-router-eigrp", "eigrpx-ipv6-eigrp-interface", "eigrpx-neighbors-detail", "cisco-eigrp-nei"], "tags": ["eigrp", "ipv6", "neighbors", "troubleshooting", "advanced"], "equivalents": {"juniper": "show ospf3 neighbor", "paloalto": "show routing protocol ospfv3 neighbor", "linux": "vtysh -c 'show ipv6 ospf6 neighbor'"}, "sandboxOutput": "R1#show ipv6 eigrp neighbors\nEIGRP-IPv6 Neighbors for AS(100)\nH   Address                 Interface              Hold Uptime   SRTT   RTO  Q  Seq\n                                                   (sec)         (ms)       Cnt Num\n1   Link-local address:     Gi0/1                    11 00:41:07    9   100  0  31\n    FE80::A8BB:CCFF:FE00:300\n0   Link-local address:     Gi0/0                    13 01:12:44    5   100  0  27\n    FE80::A8BB:CCFF:FE00:200"}, {"id": "eigrpx-neighbors-detail", "vendor": "cisco", "family": "IOS/XE", "mode": "exec", "cmd": "show ip eigrp neighbors detail", "aliases": ["sh ip eigrp nei detail", "sh ip eig nei det", "show ip eigrp neighbors detail GigabitEthernet0/0"], "purpose": "Extends the neighbour table with per-peer transport health: retransmissions, retries, prefix counts, peer software version and stub flags. This is the command that tells you whether an adjacency is merely up or actually healthy.", "tokens": [{"t": "show ip eigrp", "d": "EIGRP operational data"}, {"t": "neighbors", "d": "Adjacency table"}, {"t": "detail", "d": "Adds RTP transport counters, version, prefix count and stub information"}], "syntax": "show ip eigrp [vrf <NAME>] [<AS-NUMBER>] neighbors [detail] [<INTERFACE>]", "flags": [{"f": "detail", "d": "The extra per-peer block shown below"}, {"f": "<INTERFACE>", "d": "Limit output to one interface \u2014 essential on a DMVPN hub with hundreds of peers"}, {"f": "static", "d": "Shows only statically defined neighbours configured with the 'neighbor' command"}], "sample": "R1#show ip eigrp neighbors detail\nEIGRP-IPv4 Neighbors for AS(100)\nH   Address                 Interface              Hold Uptime   SRTT   RTO  Q  Seq\n                                                   (sec)         (ms)       Cnt Num\n1   10.1.13.3               Gi0/1                    11 00:03:12  1120  5000  3  35\n   Version 23.0/2.0, Retrans: 14, Retries: 9, Prefixes: 6\n   Topology-ids from peer - 0\n0   10.1.12.2               Gi0/0                    13 01:24:31     5   100  0  27\n   Version 23.0/2.0, Retrans: 0, Retries: 0, Prefixes: 42\n   Topology-ids from peer - 0\n   Stub Peer Advertising ( CONNECTED SUMMARY ) Routes\n   Suppressing queries", "annotations": [{"field": "SRTT (Smooth Round Trip Time, ms)", "note": "Rolling average of how long this peer takes to acknowledge a reliable packet. 5 ms on a LAN is normal; 1120 ms on a gigabit link means the peer is CPU-bound, the path is congested, or packets are being lost and re-sent."}, {"field": "RTO (Retransmission Timeout, ms)", "note": "How long EIGRP waits before retransmitting an unacknowledged packet. Derived from SRTT and capped at 5000 ms. RTO pinned at 5000 is the classic signature of a peer that is barely responding."}, {"field": "Q Cnt", "note": "Packets queued for this peer that have not been sent or acknowledged. Should be 0 nearly always. A persistently non-zero Q Cnt means updates or queries are stuck \u2014 that neighbour is a prime suspect for an SIA event, and if it stays non-zero the adjacency will eventually reset."}, {"field": "Seq Num", "note": "Sequence number of the last reliable packet received from that peer. It should climb slowly. If it jumps back to a low number, the neighbour restarted its EIGRP process."}, {"field": "Retrans / Retries", "note": "Retrans is the lifetime count of retransmitted packets; Retries is how many times the CURRENT packet has been retried. Retries above 0 right now means a packet is in trouble at this moment \u2014 the classic MTU-mismatch signature is Retries climbing while hellos stay fine, because small hellos pass and large updates do not."}, {"field": "Prefixes: 42", "note": "How many prefixes this peer is advertising. A branch that should send 3 routes and is sending 400 is leaking, and a stub that suddenly reports hundreds is no longer stubbed."}, {"field": "Stub Peer Advertising ( CONNECTED SUMMARY ) Routes / Suppressing queries", "note": "Confirms the peer really is a stub and that we will not query it during convergence. This is the direct verification that your query-domain containment is working."}], "when": "Any convergence complaint, any SIA investigation, and as the second command after a plain neighbour check when an adjacency flaps without an obvious cause.", "whenNot": "Too verbose for a quick up/down check on a hub with many peers \u2014 scope it to an interface or use the plain neighbours command. It also tells you nothing about which prefixes are advertised; use 'show ip eigrp topology' for that.", "safety": "safe", "related": ["eigrpx-topology-active", "eigrpx-timers-active-time", "eigrpx-no-split-horizon", "eigrpx-metric-weights", "cisco-eigrp-nei", "cisco-sh-int"], "tags": ["eigrp", "neighbors", "srtt", "rto", "troubleshooting", "advanced"], "equivalents": {"juniper": "show ospf neighbor detail", "paloalto": "show routing protocol ospf neighbor", "linux": "vtysh -c 'show ip eigrp neighbors detail'"}, "sandboxOutput": "R1#show ip eigrp neighbors detail\nEIGRP-IPv4 Neighbors for AS(100)\nH   Address                 Interface              Hold Uptime   SRTT   RTO  Q  Seq\n                                                   (sec)         (ms)       Cnt Num\n1   10.1.13.3               Gi0/1                    11 00:03:12  1120  5000  3  35\n   Version 23.0/2.0, Retrans: 14, Retries: 9, Prefixes: 6\n   Topology-ids from peer - 0\n0   10.1.12.2               Gi0/0                    13 01:24:31     5   100  0  27\n   Version 23.0/2.0, Retrans: 0, Retries: 0, Prefixes: 42\n   Topology-ids from peer - 0\n   Stub Peer Advertising ( CONNECTED SUMMARY ) Routes\n   Suppressing queries"}, {"id": "eigrpx-no-split-horizon", "vendor": "cisco", "family": "IOS/XE", "mode": "config-if", "cmd": "no ip split-horizon eigrp <ASN>", "aliases": ["no ip split-horizon eigrp 100", "no ip split-horizon eigrp 65001", "ip split-horizon eigrp 100"], "purpose": "Allows EIGRP to advertise routes back out of the interface they were learned on. Required on a DMVPN or Frame-Relay hub mGRE interface, otherwise spokes never learn each other's prefixes because the hub refuses to re-advertise them out the same tunnel.", "tokens": [{"t": "no", "d": "Disable the default behaviour"}, {"t": "ip split-horizon", "d": "Split-horizon loop prevention (on by default for EIGRP on every interface)"}, {"t": "eigrp", "d": "Scoped to EIGRP rather than RIP or the interface globally"}, {"t": "<ASN>", "d": "Autonomous system number this applies to"}], "syntax": "[no] ip split-horizon eigrp <1-65535>", "flags": [{"f": "no ip next-hop-self eigrp <ASN>", "d": "The other half of the DMVPN pair. Split-horizon lets the hub re-advertise; next-hop-self off lets it preserve the original spoke as the next hop so spoke-to-spoke tunnels can build."}, {"f": "Named-mode form", "d": "'no split-horizon' and 'no next-hop-self' under af-interface Tunnel0"}, {"f": "Point-to-point tunnels", "d": "DMVPN Phase 1 with p2p GRE per spoke does not need this \u2014 split-horizon is only a problem on a multipoint interface with multiple peers"}, {"f": "eigrp stub", "d": "Configure spokes as stubs so the hub does not query them; combine with this command for a scalable hub-and-spoke design"}], "sample": "R1(config)#interface Tunnel0\nR1(config-if)#no ip split-horizon eigrp 100\nR1(config-if)#no ip next-hop-self eigrp 100\nR1(config-if)#end\nR1#show ip eigrp interfaces detail Tunnel0\nEIGRP-IPv4 Interfaces for AS(100)\n                              Xmit Queue   PeerQ        Mean   Pacing Time   Multicast    Pending\nInterface        Peers  Un/Reliable  Un/Reliable  SRTT   Un/Reliable   Flow Timer   Routes\nTu0               12        0/0       0/2          18       0/15          92           0\n  Hello-interval is 5, Hold-time is 15\n  Split-horizon is disabled\n  Next xmit serial <none>\n  Packetized sent/expedited: 47/3\n  Hello's sent/expedited: 4412/14\n  Un/reliable mcasts: 0/61  Un/reliable ucasts: 38/104\n  Mcast exceptions: 2  CR packets: 2  ACKs suppressed: 7\n  Retransmissions sent: 6  Out-of-sequence rcvd: 0\n  Topology-ids on interface - 0\n  Authentication mode is not set", "annotations": [{"field": "Split-horizon is disabled", "note": "The one line that proves the change took effect. If spokes still cannot see each other's subnets and this says enabled, you applied the command to the wrong AS number \u2014 IOS accepts a wrong ASN silently."}, {"field": "Peers 12", "note": "A hub mGRE interface with a dozen spokes. Every update the hub sends is multicast-replicated per peer, which is why hub CPU and the pacing timer matter at scale."}, {"field": "Pacing Time Un/Reliable 0/15", "note": "Inter-packet pacing derived from tunnel bandwidth. If the tunnel's configured bandwidth is left at the 100 kbps GRE default with many peers, EIGRP throttles itself and convergence crawls \u2014 set tunnel bandwidth realistically."}, {"field": "PeerQ Un/Reliable 0/2", "note": "Packets queued to specific peers. Non-zero on a hub usually means one or two spokes are slow to ACK; find them with 'show ip eigrp neighbors detail'."}, {"field": "Retransmissions sent: 6", "note": "Expected to be small but non-zero on a WAN overlay. Rapidly climbing retransmissions on a tunnel almost always means an MTU problem \u2014 set 'ip mtu 1400' and 'ip tcp adjust-mss 1360' on the tunnel."}, {"field": "Why next-hop-self matters too", "note": "With split-horizon off but next-hop-self on, spokes learn each other's prefixes but with the HUB as next hop, so traffic hairpins through the hub forever and NHRP shortcuts never trigger."}], "when": "On the hub's multipoint tunnel interface in any DMVPN Phase 2 or Phase 3 design running EIGRP, and on multipoint Frame-Relay or similar NBMA interfaces.", "whenNot": "Never disable split-horizon on ordinary LAN or point-to-point links \u2014 you strip a loop-prevention mechanism for no benefit and inflate update size. Do not apply it on the SPOKE side either; the spoke has one peer and nothing to re-advertise.", "safety": "caution", "related": ["eigrpx-named-af-interface", "eigrpx-neighbors-detail", "eigrpx-topology-active", "eigrpx-variance", "cisco-sh-int"], "tags": ["eigrp", "dmvpn", "split-horizon", "hub-and-spoke", "nbma", "advanced"], "equivalents": {"juniper": "set protocols ospf area 0.0.0.0 interface gr-0/0/0.0 interface-type p2mp", "paloalto": "set network virtual-router VR1 protocol ospf area 0.0.0.0 interface tunnel.1 link-type p2mp", "linux": "vtysh -c 'configure terminal' -c 'interface gre1' -c 'no ip split-horizon eigrp 100'"}, "sandboxOutput": "R1(config)#interface Tunnel0\nR1(config-if)#no ip split-horizon eigrp 100\nR1(config-if)#no ip next-hop-self eigrp 100\nR1(config-if)#end\nR1#show ip eigrp interfaces detail Tunnel0\nEIGRP-IPv4 Interfaces for AS(100)\n                              Xmit Queue   PeerQ        Mean   Pacing Time   Multicast    Pending\nInterface        Peers  Un/Reliable  Un/Reliable  SRTT   Un/Reliable   Flow Timer   Routes\nTu0               12        0/0       0/2          18       0/15          92           0\n  Hello-interval is 5, Hold-time is 15\n  Split-horizon is disabled\n  Next xmit serial <none>\n  Packetized sent/expedited: 47/3\n  Hello's sent/expedited: 4412/14\n  Un/reliable mcasts: 0/61  Un/reliable ucasts: 38/104\n  Mcast exceptions: 2  CR packets: 2  ACKs suppressed: 7\n  Retransmissions sent: 6  Out-of-sequence rcvd: 0\n  Topology-ids on interface - 0\n  Authentication mode is not set"}, {"id": "panr-vr-create", "vendor": "paloalto", "family": "PAN-OS", "mode": "config", "cmd": "set network virtual-router <VR> interface [ <ethernet1/X> <ethernet1/Y> ]", "aliases": ["set network virtual-router VR-TRUST interface [ ethernet1/1 ethernet1/2 ]", "set network virtual-router default interface ethernet1/1", "set network virtual-router VR-TRUST"], "purpose": "Creates a virtual router (PAN-OS's VRF-equivalent routing instance) and binds Layer 3 interfaces to it. An interface with no virtual router has no routing table at all, so this is the step people forget before wondering why their static route does nothing.", "tokens": [{"t": "set", "d": "Add or modify a node in the candidate configuration"}, {"t": "network virtual-router", "d": "The routing-instance branch of the config tree"}, {"t": "<VR>", "d": "Virtual router name. 'default' exists out of the box; names are case sensitive and referenced everywhere else"}, {"t": "interface [ ... ]", "d": "Space-separated list of Layer 3 interfaces/subinterfaces this VR owns. Brackets are required for a multi-value list"}], "syntax": "set network virtual-router <VR> [interface [ <intf> <intf> ... ]] [admin-dists static <10-240>] [ecmp enable yes]", "flags": [{"f": "interface [ ethernet1/1 ethernet1/2.100 tunnel.1 ]", "d": "Physical interfaces, tagged subinterfaces, tunnel, loopback and VLAN interfaces can all be members."}, {"f": "admin-dists static <10-240>", "d": "VR-wide default administrative distance for static routes (10 by default). Per-route admin-dist overrides it."}, {"f": "delete network virtual-router <VR> interface <intf>", "d": "Removes one interface from the VR without deleting the VR."}, {"f": "PAN-OS 11.x Advanced Routing Engine", "d": "If Advanced Routing is enabled (Device > Setup > Management), the tree becomes 'set network routing logical-router <LR> vrf <VRF> ...'. Everything in this deck uses the legacy virtual-router tree that the vast majority of firewalls still run."}], "sample": "admin@PA-3220> configure\nEntering configuration mode\n[edit]\nadmin@PA-3220# set network virtual-router VR-TRUST interface [ ethernet1/1 ethernet1/2 ]\n\n[edit]\nadmin@PA-3220# show network virtual-router VR-TRUST\nvirtual-router {\n  VR-TRUST {\n    interface [ ethernet1/1 ethernet1/2];\n    routing-table {\n      ip {\n      }\n    }\n  }\n}\n\n[edit]\nadmin@PA-3220#", "annotations": [{"field": "Entering configuration mode", "note": "You are now editing the candidate config. Nothing here is live until 'commit'."}, {"field": "[edit]", "note": "PAN-OS prints the current edit level before the prompt after every set. If it says [edit network virtual-router VR-TRUST] you are scoped down the tree and your next set command is relative."}, {"field": "interface [ ... ]", "note": "An interface can belong to exactly one virtual router. Adding it here silently removes it from whatever VR held it before, which moves traffic."}, {"field": "routing-table ip", "note": "Empty until you add static routes. Connected routes are derived automatically from interface addressing."}], "when": "Building a new routing instance for separation (guest, DMZ, MPLS vs internet) or when adding a freshly addressed interface to an existing VR.", "whenNot": "Do not create extra virtual routers just to organise routes. Each VR is a separate table, so anything crossing between them needs next-vr static routes or an inter-VR policy, and you have to hand-build the return path.", "safety": "caution", "related": ["panr-int-layer3-ip", "panr-static-destination", "panr-static-nexthop-variants", "panr-show-routing-route", "panr-commit"], "tags": ["paloalto", "virtual-router", "routing", "configuration", "beginner"], "equivalents": {"cisco": "vrf definition CUST-A / ip vrf CUST-A", "juniper": "set routing-instances VR-TRUST instance-type virtual-router interface ge-0/0/0.0", "linux": "ip route add table 100 ... (VRF-lite via ip rule / ip link add vrf)"}, "sandboxOutput": "admin@PA-3220> configure\nEntering configuration mode\n[edit]\nadmin@PA-3220# set network virtual-router VR-TRUST interface [ ethernet1/1 ethernet1/2 ]\n\n[edit]\nadmin@PA-3220# show network virtual-router VR-TRUST\nvirtual-router {\n  VR-TRUST {\n    interface [ ethernet1/1 ethernet1/2];\n    routing-table {\n      ip {\n      }\n    }\n  }\n}\n\n[edit]\nadmin@PA-3220#"}, {"id": "panr-int-layer3-ip", "vendor": "paloalto", "family": "PAN-OS", "mode": "config", "cmd": "set network interface ethernet <intf> layer3 ip <A.B.C.D/M>", "aliases": ["set network interface ethernet ethernet1/1 layer3 ip 198.51.100.2/30", "set network interface ethernet ethernet1/2 layer3 ip 10.1.1.1/24", "set network interface ethernet ethernet1/1 layer3 dhcp-client enable yes"], "purpose": "Puts a physical interface into Layer 3 mode and gives it an IP/mask, which creates the connected route once the interface is in a virtual router. A PAN-OS interface only passes traffic when it has all three things: an address, a virtual router, and a security zone.", "tokens": [{"t": "set network interface ethernet", "d": "Physical Ethernet interface branch (use 'set network interface tunnel/loopback/vlan' for logical types)"}, {"t": "<intf>", "d": "Interface name in full form, e.g. ethernet1/1. Subinterfaces are configured under 'units', e.g. ethernet1/1.100"}, {"t": "layer3", "d": "Interface type. Mutually exclusive with layer2, virtual-wire and tap"}, {"t": "ip <A.B.C.D/M>", "d": "Address with prefix length. The mask is mandatory - PAN-OS has no classful assumption"}], "syntax": "set network interface ethernet <intf> layer3 {ip <A.B.C.D/M> | dhcp-client enable yes | units <intf.tag> [tag <1-4094>] ip <A.B.C.D/M>} [interface-management-profile <PROFILE>] [mtu <576-9216>]", "flags": [{"f": "units ethernet1/1.100 tag 100 ip 10.100.0.1/24", "d": "Tagged subinterface. The tag must be set explicitly; the .100 suffix alone does not create the dot1q tag."}, {"f": "interface-management-profile <PROFILE>", "d": "Allows ping/SSH/SNMP to the interface IP. Without it the data-plane IP will not even answer ping, which fools people into thinking routing is broken."}, {"f": "set zone <ZONE> network layer3 [ <intf> ]", "d": "Binds the interface to a security zone. No zone means the interface exists but every packet is dropped with no session and no traffic log."}, {"f": "dhcp-client enable yes", "d": "Common on branch WAN links. Add 'create-default-route no' if you want to control the default route with a static route instead."}, {"f": "mtu <576-9216>", "d": "Per-interface MTU; jumbo frames also require a global jumbo-frame setting and a reboot."}], "sample": "admin@PA-3220# set network interface ethernet ethernet1/1 layer3 ip 198.51.100.2/30\n\n[edit]\nadmin@PA-3220# set network virtual-router default interface ethernet1/1\n\n[edit]\nadmin@PA-3220# set zone UNTRUST network layer3 [ ethernet1/1 ]\n\n[edit]\nadmin@PA-3220# set network interface ethernet ethernet1/1 layer3 interface-management-profile PING-ONLY\n\n[edit]\nadmin@PA-3220# commit\n\nCommit job 9142 is in progress. Use Ctrl+C to return to command prompt\n.....95%.....98%......100%\nConfiguration committed successfully", "annotations": [{"field": "layer3 ip 198.51.100.2/30", "note": "Creates connected route 198.51.100.0/30 and host route 198.51.100.2/32 in the VR once the interface is bound."}, {"field": "set network virtual-router default interface ethernet1/1", "note": "The address alone routes nothing. Until the interface joins a VR it does not appear in 'show routing route'."}, {"field": "set zone UNTRUST network layer3", "note": "Zone binding is a separate config branch from the interface itself - a classic missed step that produces silent drops."}, {"field": "interface-management-profile", "note": "Controls ping/SSH/HTTPS to the data-plane IP only; the MGT interface has its own permitted-IP list."}], "when": "Turning up any new routed link: WAN handoff, transit to a core switch, or a new inside VLAN subinterface.", "whenNot": "Not for interfaces that will run in virtual-wire, tap, or Layer 2 mode; changing an in-service interface's type wipes its subinterfaces and drops all sessions on it.", "safety": "caution", "related": ["panr-vr-create", "panr-show-interface", "panr-static-nexthop-ip", "panr-commit", "pan-zones"], "tags": ["paloalto", "interface", "layer3", "zones", "configuration", "beginner"], "equivalents": {"cisco": "interface GigabitEthernet0/1 ; ip address 198.51.100.2 255.255.255.252 ; no shutdown", "juniper": "set interfaces ge-0/0/0 unit 0 family inet address 198.51.100.2/30", "linux": "ip addr add 198.51.100.2/30 dev eth0 && ip link set eth0 up"}, "sandboxOutput": "admin@PA-3220# set network interface ethernet ethernet1/1 layer3 ip 198.51.100.2/30\n\n[edit]\nadmin@PA-3220# set network virtual-router default interface ethernet1/1\n\n[edit]\nadmin@PA-3220# set zone UNTRUST network layer3 [ ethernet1/1 ]\n\n[edit]\nadmin@PA-3220# set network interface ethernet ethernet1/1 layer3 interface-management-profile PING-ONLY\n\n[edit]\nadmin@PA-3220# commit\n\nCommit job 9142 is in progress. Use Ctrl+C to return to command prompt\n.....95%.....98%......100%\nConfiguration committed successfully"}, {"id": "panr-static-destination", "vendor": "paloalto", "family": "PAN-OS", "mode": "config", "cmd": "set network virtual-router <VR> routing-table ip static-route <NAME> destination <A.B.C.D/M>", "aliases": ["set network virtual-router default routing-table ip static-route DEFAULT-ISP1 destination 0.0.0.0/0", "set network virtual-router VR-TRUST routing-table ip static-route TO-DC 10.0.0.0/8", "set network virtual-router VR-TRUST routing-table ip static-route TO-DC destination 10.0.0.0/8"], "purpose": "Creates the static route object and sets the prefix it matches. In PAN-OS a static route is a named object, not a one-line command, so this is always the first of several set lines that together make one route.", "tokens": [{"t": "set network virtual-router <VR>", "d": "Which routing instance this route lives in"}, {"t": "routing-table ip", "d": "IPv4 unicast table. Use 'routing-table ipv6 static-route' for v6"}, {"t": "static-route <NAME>", "d": "Arbitrary label for the route object, max 31 chars. Every other attribute (nexthop, metric, path-monitor) hangs off this name"}, {"t": "destination <A.B.C.D/M>", "d": "The prefix being routed. 0.0.0.0/0 is the default route"}], "syntax": "set network virtual-router <VR> routing-table ip static-route <NAME> destination <A.B.C.D/M>", "flags": [{"f": "<NAME>", "d": "Name it for intent, e.g. DEFAULT-ISP1 or TO-DC-VIA-MPLS. Reusing an existing name edits that route instead of creating a second one - the usual way people accidentally overwrite a working route."}, {"f": "destination 0.0.0.0/0", "d": "Default route. PAN-OS accepts multiple default routes with different metrics/distances in the same VR."}, {"f": "routing-table ipv6 static-route <NAME> destination 2001:db8::/32", "d": "IPv6 equivalent, separate branch, separate admin distance pool."}, {"f": "route-table {unicast | multicast | both | no-install}", "d": "Which table the route is installed into. 'no-install' keeps the route in config for redistribution/reference but never installs it in the FIB."}], "sample": "admin@PA-3220> configure\nEntering configuration mode\n[edit]\nadmin@PA-3220# set network virtual-router default routing-table ip static-route DEFAULT-ISP1 destination 0.0.0.0/0\n\n[edit]\nadmin@PA-3220# set network virtual-router default routing-table ip static-route DEFAULT-ISP1 nexthop ip-address 198.51.100.1\n\n[edit]\nadmin@PA-3220# set network virtual-router default routing-table ip static-route DEFAULT-ISP1 interface ethernet1/1\n\n[edit]\nadmin@PA-3220# set network virtual-router default routing-table ip static-route DEFAULT-ISP1 metric 10\n\n[edit]\nadmin@PA-3220#", "annotations": [{"field": "static-route DEFAULT-ISP1", "note": "The name is the object key. All four set lines above build a single route because they share the name."}, {"field": "destination 0.0.0.0/0", "note": "Committing a destination with no nexthop and no interface produces a commit error: 'static route requires nexthop or interface'."}, {"field": "no output after set", "note": "PAN-OS prints nothing on a successful set. Silence is success; an error would print immediately with the offending token."}], "when": "Any time you need a route the firewall cannot learn dynamically - default route to the ISP, summary back to the campus, a blackhole prefix.", "whenNot": "Do not use static routes to work around an unstable dynamic protocol; a static route that outlives the outage becomes a permanent blackhole because nothing withdraws it (unless you add path monitoring).", "safety": "caution", "related": ["panr-static-nexthop-ip", "panr-static-interface", "panr-static-metric", "panr-static-admin-dist", "panr-static-delete", "panr-show-routing-route-static"], "tags": ["paloalto", "static-route", "routing", "configuration", "beginner"], "equivalents": {"cisco": "ip route 0.0.0.0 0.0.0.0 198.51.100.1", "juniper": "set routing-options static route 0.0.0.0/0 next-hop 198.51.100.1", "linux": "ip route add default via 198.51.100.1"}, "sandboxOutput": "admin@PA-3220> configure\nEntering configuration mode\n[edit]\nadmin@PA-3220# set network virtual-router default routing-table ip static-route DEFAULT-ISP1 destination 0.0.0.0/0\n\n[edit]\nadmin@PA-3220# set network virtual- , "safety": "caution", "related": ["panr-static-metric", "panr-static-path-monitor", "panr-show-routing-route", "panr-vr-protocol-redist", "cisco-ip-route-static"], "tags": ["paloalto", "static-route", "administrative-distance", "floating-static", "routing", "intermediate"], "equivalents": {"cisco": "ip route 10.50.0.0 255.255.0.0 172.16.9.2 200", "juniper": "set routing-options static route 10.50.0.0/16 next-hop 172.16.9.2 preference 200", "linux": "ip route add 10.50.0.0/16 via 172.16.9.2 metric 200"}, "sandboxOutput": "admin@PA-3220# set network virtual-router default routing-table ip static-route BACKUP-DC destination 10.50.0.0/16\n\n[edit]\nadmin@PA-3220# set network virtual-router default routing-table ip static-route BACKUP-DC nexthop ip-address 172.16.9.2\n\n[edit]\nadmin@PA-3220# set network virtual-router default routing-table ip static-route BACKUP-DC admin-dist 200\n\n[edit]\nadmin@PA-3220# commit\n\nCommit job 9151 is in progress. Use Ctrl+C to return to command prompt\n.....95%.....98%......100%\nConfiguration committed successfully\n\n[edit]\nadmin@PA-3220# run show routing route destination 10.50.0.0/16\n\nflags: A:active, ?:loose, C:connect, H:host, S:static, ~:internal, R:rip, O:ospf, B:bgp,\n       Oi:ospf intra-area, Oo:ospf inter-area, O1:ospf ext-type-1, O2:ospf ext-type-2, E:ecmp, M:multicast\n\nVIRTUAL ROUTER: default (id 1)\n  ==========\ndestination        nexthop           metric flags   age    interface          next-AS\n10.50.0.0/16       10.1.1.9              10 A Oi       412 ethernet1/2\n10.50.0.0/16       172.16.9.2            10   S       1180 ethernet1/6\n\ntotal routes shown: 2"}, {"id": "panr-static-path-monitor", "vendor": "paloalto", "family": "PAN-OS", "mode": "config", "cmd": "set network virtual-router <VR> routing-table ip static-route <NAME> path-monitor enable yes", "aliases": ["set network virtual-router default routing-table ip static-route DEFAULT-ISP1 path-monitor enable yes", "set network virtual-router default routing-table ip static-route DEFAULT-ISP1 path-monitor failure-condition any", "set network virtual-router default routing-table ip static-route DEFAULT-ISP1 path-monitor hold-time 2"], "purpose": "Turns on path monitoring for a static route so the firewall pings one or more destinations and withdraws the route from the FIB when they stop answering. This is the PAN-OS answer to Cisco's 'ip sla' plus 'track' plus a tracked static route - one feature instead of three, configured on the route itself.", "tokens": [{"t": "static-route <NAME>", "d": "The route object being monitored"}, {"t": "path-monitor enable yes", "d": "Master switch. Off by default; a static route with no path monitor lives forever as long as the interface is up"}, {"t": "failure-condition {any|all}", "d": "any = route fails if ANY monitored destination fails; all = only when every destination fails"}, {"t": "hold-time <0-1440>", "d": "Minutes the path must stay up before the route is reinstalled. Default 2, prevents flapping"}], "syntax": "set network virtual-router <VR> routing-table ip static-route <NAME> path-monitor {enable yes|no} [failure-condition {any | all}] [hold-time <0-1440>]", "flags": [{"f": "failure-condition any", "d": "Strict: one dead target takes the route down. Use with a single well-chosen target such as the ISP gateway."}, {"f": "failure-condition all", "d": "Tolerant: use with 2-3 targets (ISP gateway plus a public anycast resolver) so a single unreachable host does not fail your default route. This is usually what you want on an internet edge."}, {"f": "hold-time 0", "d": "Reinstall immediately when the path recovers. Fast, but flaps traffic if the circuit is bouncing."}, {"f": "Cisco mapping", "d": "ip sla 1 / icmp-echo -> monitor-destinations; track 1 ip sla 1 -> path-monitor enable yes; 'ip route ... track 1' -> the route object itself. delay down/up on the track object -> hold-time."}, {"f": "BFD alternative", "d": "'set network virtual-router <VR> routing-table ip static-route <NAME> bfd profile <PROFILE>' gives sub-second detection where the peer supports BFD; path monitoring is ICMP-based and much slower."}], "sample": "admin@PA-3220# set network virtual-router default routing-table ip static-route DEFAULT-ISP1 path-monitor enable yes\n\n[edit]\nadmin@PA-3220# set network virtual-router default routing-table ip static-route DEFAULT-ISP1 path-monitor failure-condition all\n\n[edit]\nadmin@PA-3220# set network virtual-router default routing-table ip static-route DEFAULT-ISP1 path-monitor hold-time 2\n\n[edit]\nadmin@PA-3220# show network virtual-router default routing-table ip static-route DEFAULT-ISP1\nstatic-route {\n  DEFAULT-ISP1 {\n    path-monitor {\n      enable yes;\n      failure-condition all;\n      hold-time 2;\n      monitor-destinations {\n        ISP1-GW {\n          enable yes;\n          source 198.51.100.2/30;\n          destination 198.51.100.1;\n          interval 3;\n          count 5;\n        }\n      }\n    }\n    nexthop {\n      ip-address 198.51.100.1;\n    }\n    interface ethernet1/1;\n    metric 10;\n    destination 0.0.0.0/0;\n  }\n}\n\n[edit]\nadmin@PA-3220#", "annotations": [{"field": "enable yes", "note": "Path monitoring only acts on this one route. Enabling it does not affect any other static in the VR."}, {"field": "failure-condition all", "note": "With one destination configured, 'all' and 'any' behave identically - the difference only matters once you add a second target."}, {"field": "hold-time 2", "note": "Minutes, not seconds. After recovery the route waits 2 minutes before reinstalling; failover in the down direction is immediate once the ping count is exceeded."}, {"field": "monitor-destinations", "note": "The actual probes. A path-monitor with enable yes but no destinations passes commit and does nothing."}], "when": "On any WAN/internet static default where the interface can stay up while the path is dead - MPLS handoffs, media converters, ISP switches, cloud gateways.", "whenNot": "Do not enable it on a route whose only monitored target sits behind the route itself in a way that makes failure self-fulfilling, and do not use it where the peer supports BFD and you need sub-second convergence.", "safety": "caution", "related": ["panr-static-path-monitor-dest", "panr-show-path-monitor", "panr-static-metric", "panr-static-admin-dist", "panr-show-routing-route-static"], "tags": ["paloalto", "static-route", "path-monitoring", "failover", "ip-sla", "high-availability", "intermediate"], "equivalents": {"cisco": "ip sla 1 / icmp-echo 198.51.100.1 / track 1 ip sla 1 reachability / ip route 0.0.0.0 0.0.0.0 198.51.100.1 track 1", "juniper": "set services rpm probe ... / set routing-options static route 0.0.0.0/0 qualified-next-hop ... (with RPM tracking)", "linux": "keepalived / custom ping watchdog script that runs 'ip route replace'"}, "sandboxOutput": "admin@PA-3220# set network virtual-router default routing-table ip static-route DEFAULT-ISP1 path-monitor enable yes\n\n[edit]\nadmin@PA-3220# set network virtual-router default routing-table ip static-route DEFAULT-ISP1 path-monitor failure-condition all\n\n[edit]\nadmin@PA-3220# set network virtual-router default routing-table ip static-route DEFAULT-ISP1 path-monitor hold-time 2\n\n[edit]\nadmin@PA-3220# show network virtual-router default routing-table ip static-route DEFAULT-ISP1\nstatic-route {\n  DEFAULT-ISP1 {\n    path-monitor {\n      enable yes;\n      failure-condition all;\n      hold-time 2;\n      monitor-destinations {\n        ISP1-GW {\n          enable yes;\n          source 198.51.100.2/30;\n          destination 198.51.100.1;\n          interval 3;\n          count 5;\n        }\n      }\n    }\n    nexthop {\n      ip-address 198.51.100.1;\n    }\n    interface ethernet1/1;\n    metric 10;\n    destination 0.0.0.0/0;\n  }\n}\n\n[edit]\nadmin@PA-3220#"}, {"id": "panr-static-path-monitor-dest", "vendor": "paloalto", "family": "PAN-OS", "mode": "config", "cmd": "set network virtual-router <VR> routing-table ip static-route <NAME> path-monitor monitor-destinations <MON> source <A.B.C.D/M> destination <A.B.C.D>", "aliases": ["set network virtual-router default routing-table ip static-route DEFAULT-ISP1 path-monitor monitor-destinations ISP1-GW source 198.51.100.2/30 destination 198.51.100.1", "set network virtual-router default routing-table ip static-route DEFAULT-ISP1 path-monitor monitor-destinations ISP1-GW interval 3", "set network virtual-router default routing-table ip static-route DEFAULT-ISP1 path-monitor monitor-destinations ISP1-GW count 5"], "purpose": "Defines the actual ICMP probe a path monitor runs: which source address to ping from, which target to ping, how often, and how many consecutive misses count as failure. Without at least one monitor-destination the path monitor does nothing.", "tokens": [{"t": "monitor-destinations <MON>", "d": "Name of this probe. You can define several under one route"}, {"t": "source <A.B.C.D/M>", "d": "Source address of the ping, given with its prefix length. It must exactly match an IP already configured on the route's egress interface"}, {"t": "destination <A.B.C.D>", "d": "Target to ping. Usually the next-hop gateway, or something one hop beyond it to test the ISP itself"}, {"t": "interval <1-60>", "d": "Seconds between pings, default 3"}, {"t": "count <3-10>", "d": "Consecutive missed replies before this destination is declared down, default 5"}], "syntax": "set network virtual-router <VR> routing-table ip static-route <NAME> path-monitor monitor-destinations <MON> [enable {yes|no}] [source <A.B.C.D/M>] [destination <A.B.C.D>] [interval <1-60>] [count <3-10>]", "flags": [{"f": "source", "d": "Must be an address configured on the egress interface of this route, written the same way (198.51.100.2/30, not 198.51.100.2). PAN-OS validates this at commit."}, {"f": "destination", "d": "Pinging only the directly connected gateway detects a dead gateway but not a dead ISP core. Pinging a stable public host (e.g. a well-known resolver) tests further but depends on that host answering ICMP."}, {"f": "interval x count", "d": "Detection time = interval x count. Default 3 x 5 = 15 seconds before the route is withdrawn. Tighten to 2 x 3 = 6s if the circuit tolerates it."}, {"f": "enable no", "d": "Disables one probe while keeping it configured - handy when an ISP target starts rate-limiting ICMP."}, {"f": "multiple destinations", "d": "Add a second named block for a second target, then set failure-condition all so both must fail before the route is pulled."}], "sample": "admin@PA-3220# set network virtual-router default routing-table ip static-route DEFAULT-ISP1 path-monitor monitor-destinations ISP1-GW source 198.51.100.2/30 destination 198.51.100.1\n\n[edit]\nadmin@PA-3220# set network virtual-router default routing-table ip static-route DEFAULT-ISP1 path-monitor monitor-destinations ISP1-GW interval 3 count 5 enable yes\n\n[edit]\nadmin@PA-3220# commit\n\nCommit job 9163 is in progress. Use Ctrl+C to return to command prompt\n.....95%.....98%......100%\nConfiguration committed successfully\n\n[edit]\nadmin@PA-3220# run show routing path-monitor\n\nVIRTUAL ROUTER: default (id 1)\n  ==========\nstatic route: DEFAULT-ISP1, path monitoring: enable, status: UP, failure condition: all, hold time(min): 2\n  monitor destination: ISP1-GW, enable: yes, source: 198.51.100.2, destination: 198.51.100.1\n    status: UP, ping interval(sec): 3, ping count: 5", "annotations": [{"field": "source: 198.51.100.2", "note": "Echoed without the mask in operational output even though the config leaf carries /30. Mismatch between this and the interface address is the number one commit failure for path monitoring."}, {"field": "ping interval(sec): 3 / ping count: 5", "note": "15 seconds of silence and the route leaves the FIB. Traffic then follows the next-best route - the higher-metric default, if you built one."}, {"field": "status: UP", "note": "Per-destination state. The route-level status is derived from these plus failure-condition."}], "when": "Right after enabling path-monitor on a route, and when tuning failover speed on a dual-ISP edge.", "whenNot": "Do not point the probe at a host that filters ICMP or lives behind a NAT you control - you will fail over on a false negative and take the circuit down for no reason.", "safety": "caution", "related": ["panr-static-path-monitor", "panr-show-path-monitor", "panr-static-metric", "panr-static-nexthop-ip", "pan-ping"], "tags": ["paloalto", "static-route", "path-monitoring", "icmp", "failover", "intermediate"], "equivalents": {"cisco": "ip sla 1 ; icmp-echo 198.51.100.1 source-ip 198.51.100.2 ; frequency 3", "juniper": "set services rpm probe ISP1 test GW target address 198.51.100.1 probe-interval 3", "linux": "fping -l -p 3000 198.51.100.1 (watchdog script)"}, "sandboxOutput": "admin@PA-3220# set network virtual-router default routing-table ip static-route DEFAULT-ISP1 path-monitor monitor-destinations ISP1-GW source 198.51.100.2/30 destination 198.51.100.1\n\n[edit]\nadmin@PA-3220# set network virtual-router default routing-table ip static-route DEFAULT-ISP1 path-monitor monitor-destinations ISP1-GW interval 3 count 5 enable yes\n\n[edit]\nadmin@PA-3220# commit\n\nCommit job 9163 is in progress. Use Ctrl+C to return to command prompt\n.....95%.....98%......100%\nConfiguration committed successfully\n\n[edit]\nadmin@PA-3220# run show routing path-monitor\n\nVIRTUAL ROUTER: default (id 1)\n  ==========\nstatic route: DEFAULT-ISP1, path monitoring: enable, status: UP, failure condition: all, hold time(min): 2\n  monitor destination: ISP1-GW, enable: yes, source: 198.51.100.2, destination: 198.51.100.1\n    status: UP, ping interval(sec): 3, ping count: 5"}, {"id": "panr-static-delete", "vendor": "paloalto", "family": "PAN-OS", "mode": "config", "cmd": "delete network virtual-router <VR> routing-table ip static-route <NAME>", "aliases": ["delete network virtual-router default routing-table ip static-route DEFAULT-ISP2", "delete network virtual-router default routing-table ip static-route DEFAULT-ISP1 path-monitor", "revert config"], "purpose": "Removes a static route object (or just one attribute of it) from the candidate configuration, and pairs with the rollback story: until you commit, 'revert config' throws the whole candidate away and restores the running config, so a bad delete costs you nothing if you catch it first.", "tokens": [{"t": "delete", "d": "Remove a node from the candidate configuration"}, {"t": "network virtual-router <VR> routing-table ip", "d": "Path to the IPv4 routing table of that VR"}, {"t": "static-route <NAME>", "d": "The route object to remove. Deleting the name removes every attribute under it"}, {"t": "[sub-node]", "d": "Appending a child node (path-monitor, metric, interface) deletes only that leaf and leaves the route in place"}], "syntax": "delete network virtual-router <VR> routing-table ip static-route <NAME> [nexthop | interface | metric | admin-dist | path-monitor]\nrevert config\nload config from running-config.xml", "flags": [{"f": "delete ... static-route <NAME>", "d": "Whole route. Once committed the prefix is gone from the FIB and traffic follows the next-best match, often the default route - silent, not an error."}, {"f": "delete ... static-route <NAME> path-monitor", "d": "Surgical removal of one attribute. Much safer than deleting and rebuilding the route."}, {"f": "revert config", "d": "Discards ALL uncommitted candidate changes and reloads the running config - yours and anyone else's who is editing. Your escape hatch before commit."}, {"f": "load config from running-config.xml", "d": "Same effect from a named file; also how you roll forward to a previously saved snapshot, e.g. 'load config from pre-change-2026-07-25.xml' then commit."}, {"f": "after a bad commit", "d": "Rollback is Device > Setup > Operations > Load named configuration snapshot, or 'load config from <autosave>.xml' followed by commit. PAN-OS keeps automatic versions of every committed config."}], "sample": "admin@PA-3220# delete network virtual-router default routing-table ip static-route DEFAULT-ISP2\n\n[edit]\nadmin@PA-3220# show config diff\n[edit network virtual-router default routing-table ip static-route]\n-  DEFAULT-ISP2 {\n-    nexthop {\n-      ip-address 203.0.113.1;\n-    }\n-    interface ethernet1/4;\n-    metric 20;\n-    destination 0.0.0.0/0;\n-  }\n\n[edit]\nadmin@PA-3220# revert config\nConfiguration reverted to running configuration\n\n[edit]\nadmin@PA-3220# show config diff\n\n[edit]\nadmin@PA-3220#", "annotations": [{"field": "lines prefixed with -", "note": "What the delete will remove at commit time. Read this before committing; it is the only place the blast radius is visible."}, {"field": "revert config", "note": "Restores the candidate from the running config. Everything you typed since the last commit is gone - including changes made by another admin in a parallel session."}, {"field": "empty show config diff", "note": "Candidate now equals running. Nothing will change on commit; this is what a clean rollback looks like."}], "when": "Decommissioning a circuit, cleaning up a route you added by mistake, or backing out of a change window before commit.", "whenNot": "Never delete a static route on a production edge without checking what else covers the prefix - 'show routing route destination <prefix>' first. And do not use 'revert config' on a shared firewall without telling the other admins; it discards their work too.", "safety": "danger", "related": ["panr-show-config-diff", "panr-commit", "panr-static-destination", "panr-show-routing-route", "panr-test-fib-lookup"], "tags": ["paloalto", "static-route", "rollback", "change-management", "configuration", "intermediate"], "equivalents": {"cisco": "no ip route 0.0.0.0 0.0.0.0 203.0.113.1 / configure replace flash:pre-change.cfg", "juniper": "delete routing-options static route 0.0.0.0/0 / rollback 0", "linux": "ip route del default via 203.0.113.1"}, "sandboxOutput": "admin@PA-3220# delete network virtual-router default routing-table ip static-route DEFAULT-ISP2\n\n[edit]\nadmin@PA-3220# show config diff\n[edit network virtual-router default routing-table ip static-route]\n-  DEFAULT-ISP2 {\n-    nexthop {\n-      ip-address 203.0.113.1;\n-    }\n-    interface ethernet1/4;\n-    metric 20;\n-    destination 0.0.0.0/0;\n-  }\n\n[edit]\nadmin@PA-3220# revert config\nConfiguration reverted to running configuration\n\n[edit]\nadmin@PA-3220# show config diff\n\n[edit]\nadmin@PA-3220#"}, {"id": "panr-commit", "vendor": "paloalto", "family": "PAN-OS", "mode": "config", "cmd": "commit", "aliases": ["commit force", "commit description \"add ISP1 default route\"", "commit partial admin eddie"], "purpose": "Pushes the candidate configuration to the running configuration and programs the dataplane. Nothing you typed in configure mode is live until this succeeds - the single biggest difference between PAN-OS and IOS for engineers coming from Cisco.", "tokens": [{"t": "commit", "d": "Validate the candidate config, then activate it on both the management plane and the dataplane"}, {"t": "force", "d": "Skip the incremental-validation shortcut and push the entire configuration, accepting non-blocking validation warnings"}, {"t": "description \"...\"", "d": "Free-text comment stored with the commit, visible in the config audit log"}], "syntax": "commit [force] [description \"<text>\"] [partial {admin <user> | device-and-network | policy-and-objects | vsys <vsys>}]", "flags": [{"f": "commit", "d": "Normal path. Routing changes are applied within the job; static route changes converge in well under a second once the job reaches 100%."}, {"f": "commit force", "d": "Use when a normal commit fails validation on unrelated pre-existing config or when the candidate and running have drifted. It re-pushes everything, so it takes longer and can briefly load the dataplane."}, {"f": "commit partial admin <user>", "d": "Commits only the change ig sync push it to the peer.", "whenNot": "Do not commit blind in a change window without a diff, and avoid 'commit force' as a habit - it hides the validation errors that would have told you the change was wrong.", "safety": "caution", "related": ["panr-show-config-diff", "panr-static-delete", "panr-static-destination", "panr-show-routing-route", "pan-commit"], "tags": ["paloalto", "commit", "candidate-config", "change-management", "configuration", "beginner"], "equivalents": {"cisco": "write memory (IOS applies config immediately; there is no candidate)", "juniper": "commit comment \"add ISP1 default route\"", "linux": "systemctl reload frr / netplan apply"}, "sandboxOutput": "admin@PA-3220# commit description \"add ISP1 default route + path monitor\"\n\nCommit job 9187 is in progress. Use Ctrl+C to return to command prompt\n.....10%.....20%.....40%.....60%.....75%.....95%.....98%......100%\nConfiguration committed successfully\n\n[edit]\nadmin@PA-3220# run show jobs id 9187\nEnqueued                  Dequeued           ID    Type   Status Result Completed\n--------------------------------------------------------------------------------\n2026/07/25 14:22:07       14:22:07         9187 Commit     FIN     OK   14:22:41\n\nWarnings:\nDetails:\nConfiguration committed successfully"}, {"id": "panr-show-config-diff", "vendor": "paloalto", "family": "PAN-OS", "mode": "config", "cmd": "show config diff", "aliases": ["show config running", "show config candidate", "show config diff | match static-route"], "purpose": "Prints the difference between the candidate configuration and the running configuration - exactly what your next commit will change. This is the pre-commit review step, and on PAN-OS it is the only cheap way to see a colleague's uncommitted edits sitting in the shared candidate.", "tokens": [{"t": "show config", "d": "Display a configuration, not operational state"}, {"t": "diff", "d": "Candidate minus running, in unified-diff style with - for removals and + f mmary"], "tags": ["paloalto", "fib", "forwarding", "dataplane", "troubleshooting", "intermediate"], "equivalents": {"cisco": "show ip cef", "juniper": "show route forwarding-table", "linux": "ip route get <dest>"}, "sandboxOutput": "admin@PA-3220> show routing fib\n\nvirtual-router: default\nroute table: unicast\ntotal route / max: 14/5000\nflags: u - up, h - host, g - gateway, e - ecmp, * - preferred path\n\nid     destination           nexthop          flags   interface            mtu\n-------------------------------------------------------------------------------\n1      0.0.0.0/0             198.51.100.1     ug      ethernet1/1          1500\n3      10.1.1.0/24           0.0.0.0          u       ethernet1/2          1500\n4      10.1.1.1/32           0.0.0.0          uh      ethernet1/2          1500\n7      10.50.0.0/16          10.1.1.9         ug      ethernet1/2          1500\n9      172.16.9.0/30         0.0.0.0          u       ethernet1/6          1500\n11     198.51.100.0/30       0.0.0.0          u       ethernet1/1          1500\n12     198.51.100.2/32       0.0.0.0          uh      ethernet1/1          1500\n14     203.0.113.0/30        0.0.0.0          u       ethernet1/4          1500\n\ntotal routes shown: 8"}, {"id": "panr-test-fib-lookup", "vendor": "paloalto", "family": "PAN-OS", "mode": "operational", "cmd": "test routing fib-lookup virtual-router <VR> ip <A.B.C.D>", "aliases": ["test routing fib-lookup virtual-router default ip 203.0.113.10", "test routing fib-lookup virtual-router default ip 192.0.2.50", "test routing fib-lookup virtual-router VR-TRUST ip 10.50.1.20"], "purpose": "Asks the firewall exactly what it would do with a packet to a given destination: which interface, which next hop, which source address. It is the single most useful forwarding-verification command on PAN-OS because it answers the real question - not 'what is in the table' but 'where would this packet actually go'.", "tokens": [{"t": "test routing", "d": "Run a routing lookup as the dataplane would, without sending a packet"}, {"t": "fib-lookup", "d": "Query the forwarding table, including recursion and ECMP hashing"}, {"t": "virtual-router <VR>", "d": "Which VR to ask. Required - the firewall will not guess"}, {"t": "ip <A.B.C.D>", "d": "The destination address you care about, a host address rather than a prefix"}], "syntax": "test routing fib-lookup virtual-router <VR> ip <A.B.C.D>", "flags": [{"f": "source in the result", "d": "The address the firewall would use for self-originated traffic to that destination - which is what the path-monitor and update servers will use."}, {"f": "ECMP", "d": "With ECMP enabled the answer is the path the hash selects for that destination, so different test IPs legitimately return different interfaces."}, {"f": "does not consider PBF", "d": "PBF is evaluated before the route lookup, so real traffic can leave a different interface than this predicts. Check with 'show pbf rule all' and 'test pbf-policy-match'."}, {"f": "companions", "d": "'test security-policy-match' for which rule allows it, 'test nat-policy-match' for translation. Together they let you prove an end-to-end path without generating traffic."}], "sample": "admin@PA-3220> test routing fib-lookup virtual-router default ip 203.0.113.10\n\nruntime route lookup\n--------------------------------------------------------------------------------\nvirtual-router:  default\ndestination:     203.0.113.10\nresult:\n  interface ethernet1/4\n  nexthop 203.0.113.1\n  source 203.0.113.2\n  metric 0\n  dst 203.0.113.0/30\n\nadmin@PA-3220> test routing fib-lookup virtual-router default ip 192.0.2.50\n\nruntime route lookup\n--------------------------------------------------------------------------------\nvirtual-router:  default\ndestination:     192.0.2.50\nresult:\n  interface ethernet1/1\n  nexthop 198.51.100.1\n  source 198.51.100.2\n  metric 10\n  dst 0.0.0.0/0", "annotations": [{"field": "dst", "note": "The prefix that actually matched. Seeing
