.2.50\n\nruntime route lookup\n--------------------------------------------------------------------------------\nvirtual-router:  default\ndestination:     192.0.2.50\nresult:\n  interface ethernet1/1\n  nexthop 198.51.100.1\n  source 198.51.100.2\n  metric 10\n  dst 0.0.0.0/0"}, {"id": "panr-show-routing-summary", "vendor": "paloalto", "family": "PAN-OS", "mode": "operational", "cmd": "show routing summary", "aliases": ["show routing summary virtual-router default"], "purpose": "Prints per-virtual-router route counts by source. A five-second sanity check for 'did my BGP session drop' or 'am I approaching the platform route limit' without paging through the whole table.", "tokens": [{"t": "show routing", "d": "Routing subsystem"}, {"t": "summary", "d": "Counts per route type per virtual router, not the routes themselves"}], "syntax": "show routing summary [virtual-router <VR>]", "flags": [{"f": "static count", "d": "Should match the number of committed static-route objects that are actually installed. A lower number than you configured means some are inactive."}, {"f": "ebgp/ibgp counts", "d": "The fastest way to spot a peer that dropped: the count falls by the size of that peer's contribution."}, {"f": "total vs platform max", "d": "Compare against the model's FIB limit shown in 'show routing fib'. On a PA-3220 the unicast FIB is a few thousand entries, not a full table."}], "sample": "admin@PA-3220> show routing summary\n\nVIRTUAL ROUTER: default (id 1)\n  ==========\n  route-table: unicast\n    static            : 3\n    static-ipv6       : 0\n    connected         : 5\n    host              : 5\n    rip               : 0\n    ospf-int          : 6\n    ospf-ext          : 2\n    ospfv3-int        : 0\n    ospfv3-ext        : 0\n    ibgp              : 0\n    ebgp              : 12\n    total             : 33\n\nVIRTUAL ROUTER: VR-GUEST (id 2)\n  ==========\n  route-table: unicast\n    static            : 1\n    connected         : 2\n    host              : 2\n    total             : 5", "annotations": [{"field": "static", "note": "Installed static routes only. If you configured four and see three, one lost on distance/metric or has an unreachable next hop."}, {"field": "host", "note": "The /32 routes for each interface address - normally equal to the connected count."}, {"field": "ebgp", "note": "Prefixes accepted from external peers after inbound filtering, not what the peer sent. Compare with 'show routing protocol bgp peer' counters."}, {"field": "per-VR blocks", "note": "Each virtual router is counted separately; there is no global total because there is no global table."}], "when": "Quick health check at the start of a troubleshooting session, and for before/after comparison across a change window.", "whenNot": "Too coarse for diagnosing an individual prefix. Once a count looks wrong, move to 'show routing route type <x>' to see which specific routes are missing.", "safety": "safe", "related": ["panr-show-routing-route", "panr-show-routing-fib", "panr-show-bgp-summary", "panr-show-routing-route-static"], "tags": ["paloalto", "routing", "verification", "capacity", "troubleshooting", "beginner"], "equivalents": {"cisco": "show ip route summary", "juniper": "show route summary", "linux": "ip route show | wc -l"}, "sandboxOutput": "admin@PA-3220> show routing summary\n\nVIRTUAL ROUTER: default (id 1)\n  ==========\n  route-table: unicast\n    static            : 3\n    static-ipv6       : 0\n    connected         : 5\n    host              : 5\n    rip               : 0\n    ospf-int          : 6\n    ospf-ext          : 2\n    ospfv3-int        : 0\n    ospfv3-ext        : 0\n    ibgp              : 0\n    ebgp              : 12\n    total             : 33\n\nVIRTUAL ROUTER: VR-GUEST (id 2)\n  ==========\n  route-table: unicast\n    static            : 1\n    connected         : 2\n    host              : 2\n    total             : 5"}, {"id": "panr-show-path-monitor", "vendor": "paloalto", "family": "PAN-OS", "mode": "operational", "cmd": "show routing path-monitor", "aliases": ["show routing path-monitor virtual-router default"], "purpose": "Shows the live state of every static-route path monitor: whether the route is up, which destinations are being pinged, and which one failed. This is where you go the moment a dual-ISP edge fails over and you need to know why.", "tokens": [{"t": "show routing", "d": "Routing subsystem"}, {"t": "path-monitor", "d": "Static route path monitoring state - the PAN-OS equivalent of 'show ip sla statistics' plus 'show track'"}], "syntax": "show routing path-monitor [virtual-router <VR>]", "flags": [{"f": "route-level status", "d": "UP means the route is installed. DOWN means path monitoring pulled it from the FIB even though the interface may still be up."}, {"f": "destination-level status", "d": "Per-probe state. With failure-condition all, one DOWN destination is not enough to fail the route."}, {"f": "hold time", "d": "After recovery, the route waits this many minutes before reinstalling. A route showing all destinations UP but not yet installed is usually inside its hold time."}, {"f": "no output", "d": "No static route in any VR has path monitoring enabled - a common and unpleasant discovery during an outage."}], "sample": "admin@PA-3220> show routing path-monitor\n\nVIRTUAL ROUTER: default (id 1)\n  ==========\nstatic route: DEFAULT-ISP1, path monitoring: enable, status: UP, failure condition: all, hold time(min): 2\n  monitor destination: ISP1-GW, enable: yes, source: 198.51.100.2, destination: 198.51.100.1\n    status: UP, ping interval(sec): 3, ping count: 5\n  monitor destination: ISP1-FAR, enable: yes, source: 198.51.100.2, destination: 192.0.2.53\n    status: UP, ping interval(sec): 3, ping count: 5\n\nstatic route: DEFAULT-ISP2, path monitoring: enable, status: DOWN, failure condition: any, hold time(min): 2\n  monitor destination: ISP2-GW, enable: yes, source: 203.0.113.2, destination: 203.0.113.1\n    status: DOWN, ping interval(sec): 3, ping count: 5", "annotations": [{"field": "status: UP (route level)", "note": "Route is in the FIB. Combined with 'show routing route type static' showing the A flag, that is full confirmation."}, {"field": "status: DOWN (route level)", "note": "The route has been withdrawn by path monitoring. Traffic is now on whatever the next-best match is; the config still shows the route as present."}, {"field": "failure condition: any vs all", "note": "ISP1 uses 'all' with two targets so a single dead probe does not fail the circuit; ISP2 uses 'any' with one target and went down as soon as the gateway stopped replying."}, {"field": "ping interval / ping count", "note": "3 x 5 = 15 seconds of loss before the route is pulled. Your failover time is roughly this plus commit-free FIB reprogramming."}], "when": "During or after an unexpected failover, when validating a new path-monitor build, and as evidence when an ISP denies there was an outage.", "whenNot": "Does not tell you why the pings failed - only that they did. Pair it with a ping sourced from the same interface and a look at interface counters/errors.", "safety": "safe", "related": ["panr-static-path-monitor", "panr-static-path-monitor-dest", "panr-show-routing-route-static", "panr-show-interface", "pan-ping"], "tags": ["paloalto", "path-monitoring", "failover", "verification", "troubleshooting", "intermediate"], "equivalents": {"cisco": "show ip sla statistics / show track", "juniper": "show services rpm probe-results", "linux": "systemctl status keepalived / journalctl -u keepalived"}, "sandboxOutput": "admin@PA-3220> show routing path-monitor\n\nVIRTUAL ROUTER: default (id 1)\n  ==========\nstatic route: DEFAULT-ISP1, path monitoring: enable, status: UP, failure condition: all, hold time(min): 2\n  monitor destination: ISP1-GW, enable: yes, source: 198.51.100.2, destination: 198.51.100.1\n    status: UP, ping interval(sec): 3, ping count: 5\n  monitor destination: ISP1-FAR, enable: yes, source: 198.51.100.2, destination: 192.0.2.53\n    status: UP, ping interval(sec): 3, ping count: 5\n\nstatic route: DEFAULT-ISP2, path monitoring: enable, status: DOWN, failure condition: any, hold time(min): 2\n  monitor destination: ISP2-GW, enable: yes, source: 203.0.113.2, destination: 203.0.113.1\n    status: DOWN, ping interval(sec): 3, ping count: 5"}, {"id": "panr-show-bgp-summary", "vendor": "paloalto", "family": "PAN-OS", "mode": "operational", "cmd": "show routing protocol bgp summary", "aliases": ["show routing protocol bgp summary virtual-router default", "show routing protocol bgp peer"], "purpose": "Shows the BGP process parameters for a virtual router - router ID, local AS, timers, and whether the process is actually running. Useful when a static route is competing with, or backing up, a BGP-learned prefix.", "tokens": [{"t": "show routing protocol", "d": "Dynamic routing protocol state within the virtual router"}, {"t": "bgp", "d": "BGP process"}, {"t": "summary", "d": "Process-level parameters and counters for the VR"}], "syntax": "show routing protocol bgp summary [virtual-router <VR>]", "flags": [{"f": "not the same as Cisco's peer table", "d": "PAN-OS 'bgp summary' prints process parameters, NOT one line per neighbour. For peer state and prefix counts use 'show routing protocol bgp peer'."}, {"f": "show routing protocol bgp peer", "d": "Per-peer status: Established/Idle/Connect, uptime, and prefix counters. This is the command you actually want during a peering problem."}, {"f": "show routing protocol bgp loc-rib / rib-out", "d": "What the firewall has selected locally and what it is advertising to a given peer."}, {"f": "PAN-OS 11.x Advanced Routing", "d": "Becomes 'show advanced-routing bgp summary', which does print a Cisco-style neighbour table."}], "sample": "admin@PA-3220> show routing protocol bgp summary\n\nVIRTUAL ROUTER: default (id 1)\n  ==========\n  router id: 10.255.255.1\n  local AS: 65001\n  BGP state: enabled\n  install route: yes\n  graceful restart: enabled, stale route time 120, local restart time 120\n  always compare MED: no\n  deterministic MED: yes\n  default local preference: 100\n  aggregate MED: yes\n  aggregate routes: 0\n  peer groups: 1\n  peers: 2 (established 2)\n  loc-rib entries: 12\n  rib-out entries: 3", "annotations": [{"field": "BGP state: enabled", "note": "Confirms 'protocol bgp enable yes' was committed. If this says disabled, no peer will ever come up regardless of the peer config."}, {"field": "install route: yes", "note": "Whether BGP routes are installed into the VR's RIB. If this is no, you will see BGP prefixes in the loc-rib but never in 'show routing route' - and your static will always win."}, {"field": "peers: 2 (established 2)", "note": "Process-level peer count. Drill into per-peer state with 'show routing protocol bgp peer'."}, {"field": "loc-rib / rib-out entries", "note": "Prefixes selected locally versus advertised outward. rib-out of 3 with a redist profile applied tells you the profile matched three routes."}], "when": "When BGP and static routes contend for the same prefix, after enabling BGP on a VR, or as the first check when advertised prefixes disappear.", "whenNot": "Not the command for neighbour troubleshooting despite the name - use 'show routing protocol bgp peer'. And it says nothing about which route won; that is 'show routing route destination <prefix>'.", "safety": "safe", "related": ["panr-vr-protocol-redist", "panr-show-routing-summary", "panr-show-routing-route", "panr-static-admin-dist"], "tags": ["paloalto", "bgp", "routing", "verification", "troubleshooting", "advanced"], "equivalents": {"cisco": "show ip bgp summary", "juniper": "show bgp summary", "linux": "vtysh -c 'show ip bgp summary'"}, "sandboxOutput": "admin@PA-3220> show routing protocol bgp summary\n\nVIRTUAL ROUTER: default (id 1)\n  ==========\n  router id: 10.255.255.1\n  local AS: 65001\n  BGP state: enabled\n  install route: yes\n  graceful restart: enabled, stale route time 120, local restart time 120\n  always compare MED: no\n  deterministic MED: yes\n  default local preference: 100\n  aggregate MED: yes\n  aggregate routes: 0\n  peer groups: 1\n  peers: 2 (established 2)\n  loc-rib entries: 12\n  rib-out entries: 3"}, {"id": "panr-show-interface", "vendor": "paloalto", "family": "PAN-OS", "mode": "operational", "cmd": "show interface <intf>", "aliases": ["show interface ethernet1/1", "show interface all", "show interface logical"], "purpose": "Gives the full picture of one interface: link state and speed, operating mode, virtual router, zone, IP address, and packet/error counters. Whenever a static route will not install, this is where you confirm the interface is up, addressed, and in the right VR.", "tokens": [{"t": "show interface", "d": "Interface operational state from both the management and data planes"}, {"t": "<intf>", "d": "ethernet1/1, ethernet1/1.100, tunnel.1, loopback.1, vlan.10, or the keywords all / logical / hardware"}], "syntax": "show interface {<intf> | all | logical | hardware}", "flags": [{"f": "all", "d": "Summary table of every interface with state, zone, VR and IP - the closest thing PAN-OS has to 'show ip interface brief'."}, {"f": "logical", "d": "Logical interfaces only (subinterfaces, tunnels, loopbacks) with zone and VR."}, {"f": "hardware", "d": "Physical port state, speed/duplex and transceiver info."}, {"f": "counters", "d": "The per-interface counters at the bottom include drops. Rising 'receive errors' or 'packets dropped' point at cabling or a mismatch rather than a routing bug."}], "sample": "admin@PA-3220> show interface ethernet1/1\n\n--------------------------------------------------------------------------------\nName: ethernet1/1, ID: 16\nLink status:\n  Runtime link speed/duplex/state: 1000/full/up\n  Configured link speed/duplex/state: auto/auto/auto\nMAC address:\n  Port MAC address b4:0c:25:1a:2f:10\n--------------------------------------------------------------------------------\nName: ethernet1/1, ID: 16\nOperation mode: layer3\nVirtual router default\nInterface MGT profile: PING-ONLY\nSdwan interface profile: N/A\nZone: UNTRUST, virtual system: vsys1\nAdjust TCP MSS: no\nParent interface: N/A\nInherited interface: N/A\nAddress: 198.51.100.2/30\n--------------------------------------------------------------------------------\nLogical interface counters read from CPU:\n  bytes received                                    418235905\n  bytes transmitted                                 221904418\n  packets received                                     982143\n  packets transmitted                                  774210\n  receive errors                                            0\n  packets dropped                                          17\n  forwarding errors                                         0\n  no route                                                  4\n  arp not found                                             0\n  neighbor not found                                        0\n  land attacks                                              0\n  ping-of-death attacks                                     0", "annotations": [{"field": "Runtime link speed/duplex/state", "note": "Physical truth. 'up' here with a dead path is exactly the case path monitoring exists to catch."}, {"field": "Virtual router default", "note": "If this says N/A the interface is in no VR, so it has no routing table and your static route referencing it will fail commit or stay inactive."}, {"field": "Zone: UNTRUST", "note": "No zone means every packet is discarded with no session and no traffic log - looks exactly like a routing problem, is not."}, {"field": "no route", "note": "Counter of packets dropped because the FIB had no match. A climbing value here is a routing gap, not a policy problem."}, {"field": "arp not found", "note": "The route resolved but the next hop never answered ARP - dead gateway, wrong VLAN, or wrong mask."}], "when": "First check when a route will not install, when validating a new circuit turn-up, and when deciding whether a failover was physical or path-related.", "whenNot": "Counters here are cumulative since boot or since a counter clear, so they are poor for spotting a problem happening right now - use them as a delta over a few minutes.", "safety": "safe", "related": ["panr-int-layer3-ip", "panr-static-interface", "panr-show-path-monitor", "panr-show-routing-route", "pan-sh-int-all"], "tags": ["paloalto", "interface", "verification", "troubleshooting", "counters", "beginner"], "equivalents": {"cisco": "show interfaces GigabitEthernet0/1", "juniper": "show interfaces ge-0/0/0 extensive", "linux": "ip -s link show eth0", "powershell": "Get-NetAdapter -Name Ethernet | Format-List"}, "sandboxOutput": "admin@PA-3220> show interface ethernet1/1\n\n--------------------------------------------------------------------------------\nName: ethernet1/1, ID: 16\nLink status:\n  Runtime link speed/duplex/state: 1000/full/up\n  Configured link speed/duplex/state: auto/auto/auto\nMAC address:\n  Port MAC address b4:0c:25:1a:2f:10\n--------------------------------------------------------------------------------\nName: ethernet1/1, ID: 16\nOperation mode: layer3\nVirtual router default\nInterface MGT profile: PING-ONLY\nSdwan interface profile: N/A\nZone: UNTRUST, virtual system: vsys1\nAdjust TCP MSS: no\nParent interface: N/A\nInherited interface: N/A\nAddress: 198.51.100.2/30\n--------------------------------------------------------------------------------\nLogical interface counters read from CPU:\n  bytes received                                    418235905\n  bytes transmitted                                 221904418\n  packets received                                     982143\n  packets transmitted                                  774210\n  receive errors                                            0\n  packets dropped                                          17\n  forwarding errors                                         0\n ==  ===  ==========  =======  ===============  ===============  ==============\nPBF-GUEST-DIA     1  Active      Forward  ethernet1/4      203.0.113.1      UP\nPBF-VOICE-MPLS    2  Active      Forward  ethernet1/6      172.16.9.2       UP\nPBF-LAB-NO-PBF    3  Disabled    No PBF   N/A              N/A              N/A\n\nadmin@PA-3220> test pbf-policy-match from TRUST source 10.1.1.50 destination 203.0.113.10\n\nPBF-GUEST-DIA {\n  from TRUST;\n  source 10.1.1.0/24;\n  destination any;\n  action Forward;\n  egress interface ethernet1/4;\n  nexthop 203.0.113.1;\n}", "annotations": [{"field": "Rule State Active", "note": "The rule is live and will steer matching new sessions away from whatever the routing table says."}, {"field": "Action No PBF", "note": "An explicit exemption rule - matching traffic falls through to the normal route lookup. Standard way to carve exceptions out of a broad PBF rule."}, {"field": "NextHop Status UP", "note": "Comes from PBF path monitoring, which is configured separately from static-route path monitoring and does not share its state."}, {"field": "test pbf-policy-match output", "note": "Shows the matching rule and the egress it would impose. If this returns a rule, stop debugging your static route - PBF is what is steering the traffic."}], "when": "Any time observed forwarding contradicts 'show routing route' or 'test routing fib-lookup', and when auditing a firewall someone else built before you trust its routing table.", "whenNot": "Not a routing table view - it tells you nothing about prefixes that PBF does not match. And do not reach for PBF as a fix for a routing design problem; a static route or a metric change is almost always cleaner and survives session persistence.", "safety": "safe", "related": ["panr-test-fib-lookup", "panr-show-routing-fib", "panr-show-routing-route", "panr-ecmp", "pan-security-policy"], "tags": ["paloalto", "pbf", "policy-based-forwarding", "routing", "troubleshooting", "advanced"], "equivalents": {"cisco": "show ip policy / show route-map", "juniper": "show firewall filter <name> (filter-based forwarding) / show route forwarding-table", "linux": "ip rule show"}, "sandboxOutput": "admin@PA-3220> show pbf rule all\n\nRule            ID   Rule State  Action   Egress IF/VSYS   NextHop          NextHop Status\n==============  ===  ==========  =======  ===============  ===============  ==============\nPBF-GUEST-DIA     1  Active      Forward  ethernet1/4      203.0.113.1      UP\nPBF-VOICE-MPLS    2  Active      Forward  ethernet1/6      172.16.9.2       UP\nPBF-LAB-NO-PBF    3  Disabled    No PBF   N/A              N/A              N/A\n\nadmin@PA-3220> test pbf-policy-match from TRUST source 10.1.1.50 destination 203.0.113.10\n\nPBF-GUEST-DIA {\n  from TRUST;\n  source 10.1.1.0/24;\n  destination any;\n  action Forward;\n  egress interface ethernet1/4;\n  nexthop 203.0.113.1;\n}"}, {"id": "esx-nic-list", "vendor": "vmware", "family": "ESXi/esxcli", "mode": "shell", "cmd": "esxcli network nic list", "aliases": ["esxcli network nic list"], "purpose": "Lists the host's physical NICs (vmnic0..N) with driver, link state, speed, duplex and MTU. This is the hypervisor end of your cabling \u2014 the first command when a network engineer SSHes to an ESXi host.", "tokens": [{"t": "esxcli", "d": "ESXi's structured CLI \u2014 namespace tree, strict syntax"}, {"t": "network nic", "d": "Physical uplink (vmnic) namespace"}, {"t": "list", "d": "One row per physical adapter"}], "syntax": "esxcli network nic list", "flags": [], "sample": "[root@esxi01:~] esxcli network nic list\nName    PCI Device    Driver  Admin Status  Link Status  Speed  Duplex  MAC Address         MTU  Description\n------  ------------  ------  ------------  -----------  -----  ------  -----------------   ---  -----------\nvmnic0  0000:3b:00.0  ixgben  Up            Up           10000  Full    3c:fd:fe:aa:10:00  9000  Intel(R) Ethernet Controller X710 for 10GbE SFP+\nvmnic1  0000:3b:00.1  ixgben  Up            Up es the physical port config. EST (External Switch Tagging): portgroup VLAN 0, switch access port tags. VST (Virtual Switch Tagging): portgroup VLAN 1-4094, vSwitch tags, switchport MUST be a trunk. VGT (Virtual Guest Tagging): portgroup 4095, the GUEST tags, trunk passes everything the guest needs.", "tokens": [{"t": "EST \u2014 VLAN 0", "d": "Host sends untagged; switchport is an access port (or the frames ride the trunk's native VLAN)"}, {"t": "VST \u2014 VLAN 1-4094", "d": "The standard mode: vSwitch tags on egress, strips on ingress; switchport = 802.1Q trunk allowing those VLANs"}, {"t": "VGT \u2014 VLAN 4095", "d": "Tags pass through untouched to the VM \u2014 for virtual firewalls/routers that speak dot1q themselves"}], "syntax": "portgroup VLAN ID: 0 = EST, 1-4094 = VST, 4095 = VGT", "flags": [{"f": "switch side for VST", "d": "switchport mode trunk + switchport trunk allowed vlan <list> \u2014 allow ONLY the VLANs the host's portgroups use"}, {"f": "native VLAN hygiene", "d": "Untagged (EST/native) frames land in the trunk's native VLAN \u2014 make it a dead VLAN, not VLAN 1, and never overlap it with a VST VLAN"}], "sample": "mode  portgroup VLAN  who tags      switchport config (Cisco)\n----  --------------  -----------   -------------------------------------------\nEST   0               the switch    switchport mode access\n                                    switchport access vlan 20\nVST   20              the vSwitch   switchport mode trunk\n                                    switchport trunk allowed vlan 10,20,30,50\nVGT   4095            the guest OS  switchport mode trunk\n                                    switchport trunk allowed vlan <all guest vlans>", "annotations": [{"field": "VST is the default assumption", "note": "Almost every enterprise portgroup is VST \u2014 so almost every ESXi-facing switchport is a trunk. An ESXi host on an access port with VST portgroups gets NOTHING"}, {"field": "mixed native trap", "note": "'Management works (VLA kens": [{"t": "Route based on originating port (srcport/portid)", "d": "Default. Each vNIC/vmk pinned to one uplink by hash. NO channel"}, {"t": "Route based on source MAC", "d": "Same idea, MAC-hashed. NO channel"}, {"t": "Route based on IP hash", "d": "Per-flow hash across uplinks \u2014 REQUIRES static EtherChannel (vSS: 'mode on', never PAgP/LACP-negotiated)"}, {"t": "LBT (vDS only)", "d": "Load-based teaming \u2014 moves ports off uplinks above 75% load. NO channel"}, {"t": "Explicit failover", "d": "Strict active/standby order. NO channel"}], "syntax": "policy on host <-> matching (or deliberately absent) channel on switch \u2014 always change both sides in one window", "flags": [{"f": "symptom of channel + non-iphash", "d": "Switch sees one 'port' but same MAC from alternating members: flaps, flooding, intermittent loss"}, {"f": "symptom of iphash + no channel", "d": "MAC flapping alarms between two switchports, ARP instability, VMs unreachable in bursts"}], "sample": "teaming mode (host)            switch config needed\n----------------------------   ---------------------------------\noriginating port ID (default)  independent trunks (NO channel)\nsource MAC hash                independent trunks (NO channel)\nIP hash (vSS)                  static EtherChannel: channel-group N mode on\nLACP (vDS only)                channel-group N mode active\nload-based teaming (vDS)       independent trunks (NO channel)\nexplicit failover              independent trunks (NO channel)", "annotations": [{"field": "the one rule", "note": "Channel on the switch if and only if the host runs IP hash (or vDS LACP). Anything else mismatched = incident"}, {"field": "'mode on' not 'active'", "note": "vSS IP hash cannot speak LACP \u2014 a channel-group in mode active never comes up against a standard vSwitch. Use mode on, or use a vDS with LACP"}, {"field": "default is channel-free", "note": "Most estates run originating-port-ID \u2014 when in doubt, the safe switch config is independent identical trunks"}], "when": "Writing switchport templates for ESXi, reviewing inherited configs, and diagnosing any MAC-flap alarm involving hypervisor uplinks.", "whenNot": "Don't 'fix' MAC flapping by extending MAC timers \u2014 fix the teaming/channel mismatch it's telling you about.", "safety": "safe", "related": ["pcli-get-nicteaming", "pcli-concept-physical-uplink", "pcli-concept-vss-vds"], "tags": ["vmware", "concept", "teaming", "etherchannel", "core"], "equivalents": {"cisco": "show etherchannel summary / mac address-table flap logs", "linux": "bonding modes: balance-xor vs 802.3ad vs active-backup"}, "sandboxOutput": "teaming mode (host)            switch config needed\n----------------------------   ---------------------------------\noriginating port ID (default)  independent trunks (NO channel)\nsource MAC hash                independent trunks (NO channel)\nIP hash (vSS)                  static EtherChannel: channel-group N mode on\nLACP (vDS only)                channel-group N mode active\nload-based teaming (vDS)       independent trunks (NO channel)\nexplicit failover              independent trunks (NO channel)"}, {"id": "pcli-concept-vmotion", "vendor": "vmware", "family": "vSphere concept", "mode": "powercli", "cmd": "concept: vMotion network requirements", "aliases": ["concept vmotion", "vmotion network requirements"], "purpose": "vMotion copies a VM's entire RAM between hosts while it runs \u2014 a bursty, latency-sensitive elephant flow on a dedicated vmk network. The network engineer owns: a dedicated VLAN, enough bandwidth, consistent MTU, and (for stretched designs) sub-150ms RTT.", "tokens": [{"t": "vmk with VMotion tag", "d": "The traffic sources from tagged vmks \u2014 that subnet is your engineering target"}, {"t": "dedicated VLAN", "d": "Isolate it: vMotion traffic is unencrypted RAM by default and it will saturate what it's given"}, {"t": "bandwidth", "d": "10G+ standard; multi-NIC vMotion and NIOC shares for bigger hosts"}, {"t": "MTU", "d": "Jumbo (9000) helps measurably \u2014 but ONLY if consistent end to end; prove with vmkping -d -s 8972"}], "syntax": "checklist: VLAN trunked to all hosts | same subnet+MTU on all vMotion vmks | RTT < 150 ms | isolated or NIOC-throttled", "flags": [{"f": "routed vMotion", "d": "Supported via the vmotion netstack's own gateway \u2014 the route lives in that stack, not the default one"}, {"f": "security", "d": "vMotion VLAN = live memory on the wire. No general access; encrypted vMotion exists but costs CPU"}], "sample": "failure mode                       network cause\n--------------------------------   -----------------------------------------\nmigration hangs at 14%             vMotion VLAN missing on one host's trunk\n'no vMotion network configured'    vmk lacks the VMotion tag/service\nslow migrations, evac takes hours  1G uplink or congested shared path\nworks A->B, fails B->A             asymmetric VLAN/MTU on one host's uplinks\nintermittent failures under load   MTU mismatch: jumbo vmk over 1500 path", "annotations": [{"field": "14% hang", "note": "The famous stall = hosts can't reach each other's vMotion vmks \u2014 VLAN or MTU, and vmkping both directions settles which"}, {"field": "DRS multiplier", "note": "DRS moves VMs automatically all day \u2014 a weak vMotion network degrades the whole cluster's balance, invisibly"}, {"field": "host evacuation", "note": "Patch-window evacuations move EVERY VM \u2014 vMotion bandwidth decides your maintenance window length"}], "when": "Cluster designs and reviews, patch-window planning, any migration-failure ticket.", "whenNot": "Don't share the vMotion VLAN with storage or management on constrained uplinks without NIOC/limits \u2014 RAM copies will starve the neighbors.", "safety": "safe", "related": ["pcli-new-vmk", "pcli-get-vmhostnetworkadapter", "pcli-concept-mtu"], "tags": ["vmware", "concept", "vmotion", "design", "core"], "equivalents": {"cisco": "same discipline as any east-west elephant-flow ter switch reboot: degraded       vSAN VLAN missing from replacement config"}, {"id": "pcli-concept-mtu", "vendor": "vmware", "family": "vSphere concept", "mode": "powercli", "cmd": "concept: MTU and jumbo frames end to end", "aliases": ["concept mtu", "jumbo frames end to end"], "purpose": "Jumbo frames only work when EVERY layer agrees: guest vNIC, vSwitch/vDS, vmk, physical switchports, and every switch in between. One 1500 link in a 9000 path doesn't degrade \u2014 it black-holes large frames while pings still work, the cruelest failure mode in networking.", "tokens": [{"t": "the layers", "d": "guest OS NIC -> portgroup's vSwitch MTU -> vmk MTU -> physical switch interface/system MTU -> every transit switch"}, {"t": "why small pings lie", "d": "A default ping fits any MTU \u2014 only a full-size DF-bit probe tests the claim"}, {"t": "8972", "d": "9000 - 20 (IP) - 8 (ICMP) = the magic vmkping/ping payload that proves 9000 exactly"}, {"t": "9216 on switches", "d": "Switch max MTU above 9000 leaves headroom for encapsulation (VXLAN/Geneve adds ~50-100 bytes)"}], "syntax": "raise top-down: physical first, vSwitch second, vmk/guest last. lower bottom-up. prove: vmkping -I <vmk> -d -s 8972 <peer> in BOTH directions", "flags": [{"f": "esxcli layers", "d": "vSwitch: 'vswitch standard set -m 9000'; vmk: 'ip interface set -m 9000'; verify: 'ip interface list'"}, {"f": "overlay tax", "d": "NSX Geneve transport needs underlay MTU >= 1600 (9000-capable recommended) \u2014 the overlay's frames carry extra headers"}], "sample": "symptom                              cause\n----------------------------------   ---------------------------------------\nping works, big transfers hang       MTU black hole (DF'd large frames dropped)\nvmkping ok, -d -s 8972 fails         a 1500 hop hiding in the 9000 path\nNFS mounts, then stalls on writes    storage VLAN MTU mismatch\nvMotion fails at random %            jumbo vmk over non-jumbo transit\nworks in-rack, fails cross-rack      core/spine link MTU lower than access", "annotations": [{"field": "bisect with -s", "note": "-s 1472 passes but 8972 fails = standard MTU only. Walk sizes to find the ceiling, then find the hop that owns it"}, {"field": "both directions, all pairs", "note": "MTU is per-link per-direction in practice (asymmetric paths) \u2014 commissioning means testing the full mesh, scripted"}, {"field": "document the design MTU", "note": "Whatever you choose (1500 or 9000), write it into switch templates and host build docs \u2014 mixed defaults are how mismatches are born"}], "when": "Every storage/vMotion/overlay network build, and any 'works for small, dies for big' mystery.", "whenNot": "Don't enable jumbo 'because faster' without the discipline to keep it consistent forever \u2014 an unmanaged 9000 estate fails weirder than a plain 1500 one.", "safety": "safe", "related": ["pcli-concept-vmotion", "pcli-concept-vsan", "pcli-get-vmhostnetworkadapter"], "tags": ["vmware", "concept", "mtu", "jumbo", "core"], "equivalents": {"cisco": "system mtu jumbo / interface mtu + ping df-bit size sweep", "linux": "ip link set mtu + ping -M do -s sweep"}, "sandboxOutput": "symptom                              cause\n----------------------------------   ---------------------------------------\nping works, big transfers hang       MTU black hole (DF'd large frames dropped)\nvmkping ok, -d -s 8972 fails         a 1500 hop hiding in the 9000 path\nNFS mounts, then stalls on writes    storage VLAN MTU mismatch\nvMotion fails at random %            jumbo vmk over non-jumbo transit\nworks in-rack, fails cross-rack      core/spine link MTU lower than access"}, {"id": "pcli-concept-security", "vendor": "vmware", "family": "vSphere concept", "mode": "powercli", "cmd": "concept: portgroup security \u2014 promiscuous / MAC changes / forged transmits", "aliases": ["concept portgroup security", "promiscuous mode mac changes forged transmits"], "purpose": "Three per-portgroup security toggles control what a VM may do at L2: Promiscuous mode (may it see others' frames?), MAC address changes (may it change its receive MAC?), Forged transmits (may it SEND from a foreign MAC?). Default Reject on vDS; understand them before any virtual appliance goes in.", "tokens": [{"t": "Promiscuous mode", "d": "Accept = the vNIC sees all the portgroup's (VLAN's) traffic \u2014 virtual IDS/packet brokers need it; everything else shouldn't have it"}, {"t": "MAC address changes", "d": "Accept = guest may change its effective RX MAC \u2014 needed by some clustering/NLB designs"}, {"t": "Forged transmits", "d": "Accept = frames may source foreign MACs \u2014 needed by nested hypervisors, bridging appliances, some HA products"}], "syntax": "per portgroup (overrides vSwitch): Reject by default; Accept only with a documented reason", "flags": [{"f": "audit", "d": "Get-SecurityPolicy -VirtualPortGroup <pg> (PowerCLI) \u2014 hunt for unexplained Accepts"}, {"f": "who legitimately needs Accepts", "d": "virtual firewalls bridging traffic, IDS taps, nested ESXi labs, Microsoft NLB unicast (infamously)"}], "sample": "toggle              default  legit Accept users              risk when Accept\n-----------------   -------  ----------------------------    ---------------------------\nPromiscuous mode    Reject   IDS/monitor taps, nested labs   VM sniffs neighbors' traffic\nMAC changes         Reject   MS NLB, some cluster products   MAC spoof on receive path\nForged transmits    Reject   bridges, nested hypervisors     MAC spoof on send path", "annotations": [{"field": "spoofing angle", "note": "MAC changes + Forged transmits both Accept = a VM can fully impersonate another MAC \u2014 with port security absent inside vSwitches, these toggles ARE your port security"}, {"field": "promiscuous != span", "note": "Promiscuous shows the VLAN's flooded/broadcast view on a vSS; for real mirroring use vDS port mirroring (ERSPAN) toward a proper sensor"}, {"field": "compliance", "note": "Auditors ask for these three settings' state \u2014 keep the estate Reject-by-default and exceptions documented"}], "when": "Deploying/reviewing virtual firewalls, load balancers, IDS taps, nested labs \u2014 and every security audit of a vSphere estate.", "whenNot": "Never flip a production portgroup to Accept 'to test' \u2014 create a dedicated portgroup for the appliance with only IT set Accept.", "safety": "safe", "related": ["pcli-get-virtualportgroup", "pcli-concept-vss-vds", "pcli-vlan-audit"], "tags": ["vmware", "concept", "security", "l2", "portgroup"], "equivalents": {"cisco": "port-security / DAI / storm-control (spiritual counterparts)", "linux": "bridge ageing/learning flags, macvlan modes"}, "sandboxOutput": "toggle              default  legit Accept users              risk when Accept\n-----------------   -------  ----------------------------    ---------------------------\nPromiscuous mode    Reject   IDS/monitor taps, nested labs   VM sniffs neighbors' traffic\nMAC changes         Reject   MS NLB, some cluster products   MAC spoof on receive path\nForged transmits    Reject   bridges, nested hypervisors     MAC spoof on send path"}, {"id": "pcli-concept-nsx", "vendor": "vmware", "family": "vSphere concept", "mode": "powercli", "cmd": "concept: NSX overlay segments vs VLAN-backed networks", "aliases": ["concept nsx", "nsx overlay vs vlan"], "purpose": "NSX moves segmentation into software: VM networks become overlay segments (Geneve-encapsulated) stitched between hosts over a routed underlay, instead of VLANs you trunk. Your job shifts from 'trunk VLAN 20 everywhere' to 'provide a boring, fast, jumbo-clean routed IP fabric' \u2014 plus the edges where overlay meets physical.", "tokens": [{"t": "overlay segment", "d": "L2 network in software; frames ride Geneve/UDP between host TEPs \u2014 no VLAN per app network anymore"}, {"t": "TEP", "d": "Tunnel endpoint vmk on each host \u2014 a real IP on a real (VLAN-backed) transport network YOU still provide"}, {"t": "underlay", "d": "Routed fabric between TEPs: needs MTU >= 1600 (9000 recommended), clean routing, low loss \u2014 and nothing else"}, {"t": "Tier-0 edge", "d": "Where overlay meets your physical network \u2014 BGP peering between NSX edges and your routers/firewalls"}], "syntax": "network team owns: TEP transport VLAN + MTU | routed underlay | BGP to Tier-0 | the remaining real VLANs (mgmt, vMotion, storage, edge uplinks)", "flags": [{"f": "what disappears", "d": "Per-app VLAN sprawl, trunk-everything-everywhere, VLAN-limit pressure"}, {"f": "what appears", "d": "MTU discipline (Geneve overhead), BGP sessions to virtual edges, distributed firewall policy conversations"}], "sample": "before NSX                          with NSX\n---------------------------------   ---------------------------------------\napp networks = VLANs on trunks      app networks = overlay segments (Geneve)\nnew network = switch change ticket  new network = NSX API call, no switch change\nsecurity = VLAN + firewall zones    + distributed firewall at every vNIC\nyour interface: trunks everywhere    your interface: routed fabric + BGP @ T0\nMTU 1500 usually fine                underlay MTU >= 1600 (9000 recommended)", "annotations": [{"field": "the fabric is still yours", "note": "NSX doesn't remove the physical network \u2014 it concentrates your responsibility into underlay quality: MTU, ECMP, latency, loss"}, {"field": "BGP at Tier-0", "note": "North-south enters via edge BGP \u2014 you'll peer with NSX edges like any other router, with all your policy discipline intact"}, {"field": "troubleshooting split", "note": "Overlay problems (segment reachability) live in NSX tooling; underlay problems (TEP-to-TEP) are classic IP: vmkping between TEPs at full MTU"}], "when": "Any estate adopting NSX/VCF \u2014 get into the TEP/underlay/MTU/BGP design conversations EARLY; retrofitting MTU later is misery.", "whenNot": "Don't cling to per-app VLAN thinking in an overlay shop \u2014 and don't accept an underlay you can't guarantee jumbo-clean.", "safety": "safe", "related": ["pcli-concept-mtu", "pcli-concept-vss-vds", "pcli-get-vdportgroup"], "tags": ["vmware", "concept", "nsx", "overlay", "design"], "equivalents": {"cisco": "VXLAN/EVPN fabric (same encapsulation physics)", "linux": "VXLAN + FRR on hosts (DIY sibling)"}, "sandboxOutput": "before NSX                          with NSX\n---------------------------------   ---------------------------------------\napp networks = VLANs on trunks      app networks = overlay segments (Geneve)\nnew network = switch change ticket  new network = NSX API call, no switch change\nsecurity = VLAN + firewall zones    + distributed firewall at every vNIC\nyour interface: trunks everywhere    your interface: routed fabric + BGP @ T0\nMTU 1500 usually fine                underlay MTU >= 1600 (9000 recommended)"}, {"id": "pcli-concept-physical-uplink", "vendor": "vmware", "family": "vSphere concept", "mode": "powercli", "cmd": "concept: the switchport template for an ESXi uplink", "aliases": ["concept esxi switchport", "physical switch config for esxi"], "purpose": "The distilled physical-side recipe for a standard (non-iphash) ESXi host: identical trunks on every uplink, fast STP edge behavior, pruned VLANs, jumbo if designed, and discovery protocol on. Codify it once as a template \u2014 hand-typed ESXi ports are where mysteries come from.", "tokens": [{"t": "trunk + pruned list", "d": "VST portgroups need a trunk; allow exactly the host's VLANs, nothing more"}, {"t": "spanning-tree edge trunk", "d": "The host bridges nothing \u2014 portfast/edge stops 30s convergence eating vMotion and failovers"}, {"t": "identical on ALL uplinks", "d": "Teaming hashes VMs across uplinks \u2014 one port missing a VLAN = per-VM random blackouts"}, {"t": "no channel (default teaming)", "d": "Independent ports for srcport/MAC/LBT modes \u2014 channel ONLY for iphash/LACP designs"}], "syntax": "template per uplink port (Cisco IOS example in sample) \u2014 deviations only vi   function getFilteredCommands() {
    const q = (state.query || "").trim().toLowerCase();
    return COMMANDS.filter(c => {
      if (state.vendorFilter !== "all" && c.vendor !== state.vendorFilter) return false;
      if (!q) return true;
      const hay = [c.cmd, c.purpose, ...(c.aliases || []), ...(c.tags || []), c.vendor, c.family, c.mode].join(" ").toLowerCase();
      return hay.includes(q);
    });
  }

  function findCmd(id) { return COMMANDS.find(c => c.id === id); }

  function normalizeSandboxInput(raw) {
    return raw.trim().replace(/\s+/g, " ");
  }

  function matchCommand(vendor, input) {
    const n = normalizeSandboxInput(input).toLowerCase();
    if (!n) return null;
    const pool = COMMANDS.filter(c => c.vendor === vendor);
    // exact cmd or alias
    for (const c of pool) {
      if (c.cmd.toLowerCase() === n) return c;
      if ((c.aliases || []).some(a => a.toLowerCase() === n)) return c;
    }
    // prefix / includes
    let best = null;
    for (const c of pool) {
      const candidates = [c.cmd, ...(c.aliases || [])].map(x => x.toLowerCase());
      for (const cand of candidates) {
        if (n === cand || n.startsWith(cand + " ") || cand.startsWith(n)) {
          if (!best || cand.length > best._score) best = Object.assign({}, c, { _score: cand.length });
        }
      }
    }
    return best;
  }

  function currentPrompt() {
    const v = VENDORS.find(x => x.id === state.sandboxVendor);
    const modes = v.prompt;
    const keys = Object.keys(modes);
    if (modes[state.sandboxMode]) return modes[state.sandboxMode];
    return modes[keys[0]];
  }

  function runSandboxCommand(raw, silentRender) {
    const input = normalizeSandboxInput(raw);
    if (!input) return;
    const prompt = currentPrompt();
    // mode switches
    const low = input.toLowerCase();
    if (state.sandboxVendor === "cisco") {
      if (low === "configure terminal" || low === "conf t" || low === "config t") state.sandboxMode = "config";
      if (low === "end" || (low === "exit" && state.sandboxMode !== "exec")) state.sandboxMode = "exec";
    }
    if (state.sandboxVendor === "juniper" || state.sandboxVendor === "paloalto") {
      if (low === "configure" || low === "edit") state.sandboxMode = "config";
      if (low === "exit" || low === "quit") state.sandboxMode = state.sandboxVendor === "juniper" ? "operational" : "operational";
    }
    let output, err = false, matched = matchCommand(state.sandboxVendor, input);
    if (matched) {
      output = matched.sandboxOutput || matched.sample;
      state.lastCmd = matched;
    } else if (["exit","end","quit","top"].includes(low)) {
      output = "";
    } else if (low === "help" || low === "?") {
      output = COMMANDS.filter(c => c.vendor === state.sandboxVendor).slice(0, 12).map(c => c.cmd).join("\n") + "\n… (search encyclopedia for more)";
    } else {
      err = true;
      output = `% Unknown command in sandbox: ${input}\nHint: try 'help' or open Encyclopedia for ${state.sandboxVendor} commands.`;
      state.lastCmd = null;
    }
    state.sandboxHist.push({ prompt, input, output, err, cmdId: matched?.id || null });
    if (state.sandboxHist.length > 80) state.sandboxHist.shift();
    if (!silentRender && state.view === "sandbox") {
      const body = $("#term-body");
      if (body) {
        body.innerHTML += `<div class="line-in">${escapeHtml(prompt + " " + input)}</div><div class="line-out ${err?'line-err':''}">${escapeHtml(output)}</div>`;
        body.scrollTop = body.scrollHeight;
        // update prompt label
        $(".prompt").innerHTML = `${currentPrompt()}<span class="cursor-blink">▌</span>`;
      }
    } else if (silentRender) {
      // hist only; renderSandbox will paint
    }
  }

      </div>`;
    bindNav(el);
    $all("[data-daily]", el).forEach(b => b.addEventListener("click", () => {
      const key = tk + ":" + b.dataset.daily;
      state.dailyDone[key] = !state.dailyDone[key];
      if (state.dailyDone[key]) bumpStreak();
      saveState(); renderPlanner();
    }));
    $all("[data-set-vendor]", el).forEach(b => b.addEventListener("click", () => { state.vendorFilter = b.dataset.setVendor; }));
    $("#save-journal", el).addEventListener("click", () => {
      state.journal = $("#journal", el).value;
      saveState(); bumpStreak();
      $("#save-journal", el).textContent = "Saved";
    });
  }

  function renderToolkit() {
    const el = $("#view-toolkit");
    el.innerHTML = `
      <div class="section-title"><h2>Networker toolkit</h2><span class="muted">What to learn alongside NetForge</span></div>
      ${TOOLKIT.map(cat => `
        <div class="section-title"><h2>${escapeHtml(cat.cat)}</h2></div>
        <div class="grid cards">
          ${cat.items.map(it => `
            <div class="panel">
              <h3>${escapeHtml(it.name)}</h3>
              <p><span class="k muted">Why</span><br>${escapeHtml(it.why)}</p>
              <p style="margin-top:.5rem"><span class="k muted">When</span><br>${escapeHtml(it.when)}</p>
              <p style="margin-top:.5rem"><span class="k muted">Offline tip</span><br>${escapeHtml(it.tip)}</p>
            </div>`).join("")}
        </div>`).join("")}
      <div class="panel" style="margin-top:1rem">
        <h3>Suggested weekly mix</h3>
        <p class="muted">2 days Packet Tracer/GNS3 · 1 day Wireshark pcaps · 1 day Netmiko scripts · 1 day host Linux/PowerShell · weekend scenario review in NetForge drills.</p>
      </div>`;
  }

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[ch]));
  }

  function bindNav(root) {
    $all("[data-nav]", root).forEach(b => b.addEventListener("click", () => setView(b.dataset.nav)));
  }

  function renderView() {
    switch (state.view) {
      case "home": renderHome(); break;
      case "encyclopedia": renderEncyclopedia(); break;
      case "compare": renderCompare(); break;
      case "sandbox": renderSandbox(); break;
      case "labs": renderLabs(); break;
      case "drills": renderDrills(); break;
      case "planner": renderPlanner(); break;
      case "toolkit": renderToolkit(); break;
      default: renderHome();
    }
  }

  function init() {
    COMMANDS = window.NETFORGE_COMMANDS || [];
    loadState();
    // nav
    $all(".desktop-nav button, .bottom-nav button, .brand").forEach(b => {
      b.addEventListener("click", () => setView(b.dataset.nav || "home"));
    });
    const search = $("#global-search");
    let t = null;
    search.addEventListener("input", () => {
      clearTimeout(t);
      t = setTimeout(() => {
        state.query = search.value;
        state.selectedId = null;
        if (state.view !== "encyclopedia") setView("encyclopedia");
        else renderEncyclopedia();
      }, 120);
    });
    search.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        state.query = search.value;
        state.selectedId = null;
        setView("encyclopedia");
      }
    });
    setView("home");
  }

  document.addEventListener("DOMContentLoaded", init);
})();

</script>
</body>
</html>
