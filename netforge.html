<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0c1218" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="NetForge — offline multi-vendor network engineering study tool" />
<title>NetForge — Offline Network Engineering Study Tool</title>
<style>
:root {
  --bg0: #0c1218;
  --bg1: #121b24;
  --bg2: #182430;
  --bg3: #1e2e3c;
  --line: rgba(120, 160, 180, 0.18);
  --text: #e6eef4;
  --muted: #8aa0b2;
  --copper: #d4894a;
  --copper2: #f0b27a;
  --teal: #3db8a0;
  --teal2: #7ee0cb;
  --danger: #e85d5d;
  --caution: #e0b34d;
  --safe: #4ecf8a;
  --font: "IBM Plex Sans", "Segoe UI", "Helvetica Neue", sans-serif;
  --mono: "IBM Plex Mono", "SF Mono", "Consolas", monospace;
  --radius: 10px;
  --nav-h: 64px;
  --bottom-h: 64px;
  --shadow: 0 12px 40px rgba(0,0,0,.35);
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100dvh;
  font-family: var(--font);
  color: var(--text);
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(212,137,74,.14), transparent 55%),
    radial-gradient(900px 500px at 100% 0%, rgba(61,184,160,.10), transparent 50%),
    linear-gradient(180deg, var(--bg0), #0a1015 40%, var(--bg0));
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(var(--bottom-h) + env(safe-area-inset-bottom));
}
body::before {
  content: "";
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(rgba(125,170,190,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(125,170,190,.04) 1px, transparent 1px);
  background-size: 28px 28px;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
}
#app { position: relative; z-index: 1; min-height: 100dvh; }
a { color: var(--teal2); text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: .75rem;
  padding: .75rem 1rem;
  padding-top: calc(.75rem + env(safe-area-inset-top));
  background: rgba(12,18,24,.86);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex; align-items: center; gap: .6rem; min-width: max-content;
  border: 0; background: transparent; padding: 0;
}
.brand-mark {
  width: 34px; height: 34px; border-radius: 9px;
  background: linear-gradient(145deg, var(--copper), #9a5a28);
  display: grid; place-items: center;
  box-shadow: 0 0 0 1px rgba(240,178,122,.25), 0 8px 20px rgba(212,137,74,.25);
  animation: pulseGlow 3.2s ease-in-out infinite;
}
.brand-mark svg { width: 18px; height: 18px; }
.brand-text { text-align: left; line-height: 1.05; }
.brand-text strong { display: block; font-size: 1.05rem; letter-spacing: .02em; }
.brand-text span { font-size: .72rem; color: var(--muted); }
.search-wrap { flex: 1; position: relative; max-width: 640px; }
.search-wrap input {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--bg2);
  border-radius: 999px;
  padding: .7rem 1rem .7rem 2.4rem;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.search-wrap input:focus {
  border-color: rgba(61,184,160,.55);
  box-shadow: 0 0 0 3px rgba(61,184,160,.15);
}
.search-wrap .ico {
  position: absolute; left: .85rem; top: 50%; transform: translateY(-50%);
  color: var(--muted); pointer-events: none;
}
.desktop-nav { display: none; gap: .35rem; margin-left: auto; }
.desktop-nav button {
  border: 1px solid transparent; background: transparent; color: var(--muted);
  padding: .45rem .7rem; border-radius: 8px; font-size: .85rem;
}
.desktop-nav button.active, .desktop-nav button:hover {
  color: var(--text); background: var(--bg3); border-color: var(--line);
}
.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: .15rem;
  padding: .35rem .35rem calc(.35rem + env(safe-area-inset-bottom));
  background: rgba(12,18,24,.94);
  border-top: 1px solid var(--line);
  backdrop-filter: blur(14px);
}
.bottom-nav button {
  border: 0; background: transparent; color: var(--muted);
  padding: .35rem .2rem; border-radius: 10px; font-size: .68rem;
  display: flex; flex-direction: column; align-items: center; gap: .15rem;
}
.bottom-nav button.active { color: var(--copper2); background: rgba(212,137,74,.12); }
.bottom-nav svg { width: 18px; height: 18px; }
.view { display: none; padding: 1rem; max-width: 1100px; margin: 0 auto; animation: fadeUp .35s ease; }
.view.active { display: block; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
@keyframes pulseGlow {
  0%,100% { box-shadow: 0 0 0 1px rgba(240,178,122,.25), 0 8px 20px rgba(212,137,74,.2); }
  50% { box-shadow: 0 0 0 1px rgba(240,178,122,.4), 0 8px 28px rgba(212,137,74,.4); }
}
@keyframes blink { 50% { opacity: 0; } }
.cursor-blink { animation: blink 1.1s step-end infinite; }
.hero {
  padding: 1.25rem 0 1.5rem;
  display: grid; gap: 1rem;
}
.hero h1 {
  margin: 0; font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1.05;
  letter-spacing: -.02em;
  background: linear-gradient(90deg, var(--text), var(--copper2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero p { margin: 0; color: var(--muted); max-width: 36rem; font-size: 1.02rem; }
.vendor-strip { display: flex; flex-wrap: wrap; gap: .45rem; }
.chip, .tag {
  display: inline-flex; align-items: center; gap: .35rem;
  border: 1px solid var(--line); background: rgba(24,36,48,.8);
  color: var(--text); border-radius: 999px; padding: .35rem .7rem; font-size: .8rem;
}
.chip.active, .chip:hover { border-color: rgba(212,137,74,.5); color: var(--copper2); }
.chip[data-v="cisco"].active { border-color: rgba(61,184,160,.5); color: var(--teal2); }
.grid { display: grid; gap: .85rem; }
.grid.cards { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.card-btn, .panel {
  border: 1px solid var(--line); background: linear-gradient(180deg, rgba(30,46,60,.9), rgba(18,27,36,.92));
  border-radius: var(--radius); padding: 1rem; text-align: left;
  box-shadow: var(--shadow);
  transition: transform .2s ease, border-color .2s;
}
.card-btn:hover { transform: translateY(-2px); border-color: rgba(212,137,74,.4); }
.card-btn h3, .panel h3 { margin: 0 0 .35rem; font-size: 1rem; }
.card-btn p, .muted { color: var(--muted); margin: 0; font-size: .9rem; }
.section-title {
  display: flex; align-items: end; justify-content: space-between; gap: 1rem;
  margin: 1.25rem 0 .75rem;
}
.section-title h2 { margin: 0; font-size: 1.15rem; }
.toolbar { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .85rem; align-items: center; }
.btn {
  border: 1px solid var(--line); background: var(--bg3); color: var(--text);
  border-radius: 8px; padding: .55rem .85rem; font-size: .88rem;
}
.btn:hover { border-color: rgba(61,184,160,.45); }
.btn.primary {
  background: linear-gradient(135deg, var(--copper), #a8642f);
  border-color: transparent; color: #1a1008; font-weight: 600;
}
.btn.ghost { background: transparent; }
.btn.small { padding: .35rem .6rem; font-size: .78rem; }
.list { display: grid; gap: .55rem; }
.list-item {
  display: grid; gap: .25rem;
  border: 1px solid var(--line); background: rgba(18,27,36,.85);
  border-radius: 10px; padding: .85rem .95rem; text-align: left; width: 100%;
  animation: fadeUp .3s ease;
}
.list-item:hover { border-color: rgba(61,184,160,.4); }
.list-item .row { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
.cmd-name { font-family: var(--mono); font-size: .95rem; color: var(--teal2); }
.badge {
  font-size: .68rem; text-transform: uppercase; letter-spacing: .04em;
  padding: .15rem .45rem; border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
}
.badge.cisco { color: #7ec8ff; border-color: rgba(126,200,255,.3); }
.badge.juniper { color: #86e0a8; border-color: rgba(134,224,168,.3); }
.badge.paloalto { color: #f0a070; border-color: rgba(240,160,112,.3); }
.badge.linux { color: #f0d56a; border-color: rgba(240,213,106,.3); }
.badge.powershell { color: #9bb7ff; border-color: rgba(155,183,255,.3); }
.badge.safe { color: var(--safe); }
.badge.caution { color: var(--caution); }
.badge.danger { color: var(--danger); }
.detail { display: grid; gap: 1rem; }
.detail .syntax, pre, code, .term-out {
  font-family: var(--mono); font-size: .84rem;
}
.detail .syntax, pre, .term-out {
  background: #070b10; border: 1px solid var(--line); border-radius: 10px;
  padding: .9rem 1rem; overflow: auto; white-space: pre-wrap; word-break: break-word;
}
.token-list { display: grid; gap: .45rem; }
.token {
  display: grid; grid-template-columns: minmax(90px, auto) 1fr; gap: .6rem;
  padding: .55rem .7rem; border-radius: 8px; background: var(--bg2); border: 1px solid var(--line);
}
.token code { color: var(--copper2); }
.kv { display: grid; gap: .65rem; }
.kv .k { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
.compare-grid {
  display: grid; gap: .75rem;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
}
.compare-card {
  border: 1px solid var(--line); border-radius: 10px; padding: .85rem; background: var(--bg2);
}
.compare-card h4 { margin: 0 0 .5rem; font-size: .85rem; color: var(--muted); text-transform: uppercase; }
.compare-card code { color: var(--teal2); font-size: .82rem; display: block; margin-bottom: .35rem; }
.terminal {
  background: #070b10; border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  box-shadow: var(--shadow);
}
.terminal-bar {
  display: flex; gap: .5rem; align-items: center; justify-content: space-between;
  padding: .55rem .8rem; background: var(--bg2); border-bottom: 1px solid var(--line);
}
.terminal-body {
  min-height: 280px; max-height: 52vh; overflow: auto; padding: .85rem;
  font-family: var(--mono); font-size: .84rem; line-height: 1.45;
}
.terminal-input-row {
  display: flex; gap: .4rem; align-items: center; padding: .65rem .8rem;
  border-top: 1px solid var(--line); background: #0a1016;
}
.terminal-input-row .prompt { color: var(--copper2); white-space: nowrap; font-family: var(--mono); font-size: .84rem; }
.terminal-input-row input {
  flex: 1; border: 0; outline: none; background: transparent; font-family: var(--mono); font-size: .84rem;
}
.line-in { color: var(--text); }
.line-out { color: #b7c7d4; margin: .25rem 0 .7rem; white-space: pre-wrap; }
.line-err { color: var(--caution); }
.lab-block { display: grid; gap: .75rem; }
.lab-line {
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg2);
}
.lab-line summary {
  list-style: none; cursor: pointer; padding: .7rem .85rem; display: flex; justify-content: space-between; gap: .5rem;
  font-family: var(--mono); font-size: .82rem; color: var(--teal2);
}
.lab-line summary::-webkit-details-marker { display: none; }
.lab-line .explain { padding: 0 .85rem .85rem; color: var(--muted); font-size: .9rem; }
.flash-card {
  min-height: 180px; display: grid; place-items: center; text-align: center; padding: 1.25rem;
  border: 1px solid var(--line); border-radius: 14px; background: linear-gradient(160deg, var(--bg3), var(--bg1));
  cursor: pointer; user-select: none;
}
.flash-card .front { font-family: var(--mono); font-size: 1.15rem; color: var(--teal2); }
.flash-card .back { color: var(--text); font-size: 1rem; }
.progress {
  height: 8px; border-radius: 999px; background: var(--bg3); overflow: hidden; border: 1px solid var(--line);
}
.progress > span { display: block; height: 100%; background: linear-gradient(90deg, var(--copper), var(--teal)); width: 0; transition: width .35s ease; }
.quiz-opt {
  display: block; width: 100%; text-align: left; margin: .4rem 0; padding: .75rem .9rem;
  border-radius: 10px; border: 1px solid var(--line); background: var(--bg2);
}
.quiz-opt.correct { border-color: var(--safe); background: rgba(78,207,138,.1); }
.quiz-opt.wrong { border-color: var(--danger); background: rgba(232,93,93,.1); }
.journal {
  width: 100%; min-height: 90px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg2); padding: .75rem; resize: vertical;
}
.empty { color: var(--muted); padding: 1.5rem .5rem; text-align: center; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
@media (min-width: 900px) {
  .bottom-nav { display: none; }
  .desktop-nav { display: flex; }
  body { padding-bottom: 0; }
  .view { padding: 1.25rem 1.5rem 2rem; }
}

</style>
</head>

  </nav>
</div>

  function getFilteredCommands() {
    const q = (state.query || "").trim().toLowerCase();
    return COMMANDS.filter(c => {
      if (state.vendorFilter !== "all" && c.vendor !== state.vendorFilter) return false;
      if (!q) return true;
      const hay = [c.cmd, c.purpose, ...(c.aliases || []), ...(c.tags || []), c.vendor, c.family, c.mode].join(" ").toLowerCase();
      return hay.includes(q);
    });
  }

  function findCmd(id) { return COMMANDS.find(c => c.id === id); }

  function normalizeSandboxInput(raw) {
    return raw.trim().replace(/\s+/g, " ");
  }

  function matchCommand(vendor, input) {
    const n = normalizeSandboxInput(input).toLowerCase();
    if (!n) return null;
    const pool = COMMANDS.filter(c => c.vendor === vendor);
    // exact cmd or alias
    for (const c of pool) {
      if (c.cmd.toLowerCase() === n) return c;
      if ((c.aliases || []).some(a => a.toLowerCase() === n)) return c;
    }
    // prefix / includes
    let best = null;
    for (const c of pool) {
      const candidates = [c.cmd, ...(c.aliases || [])].map(x => x.toLowerCase());
      for (const cand of candidates) {
        if (n === cand || n.startsWith(cand + " ") || cand.startsWith(n)) {
          if (!best || cand.length > best._score) best = Object.assign({}, c, { _score: cand.length });
        }
      }
    }
    return best;
  }

        <label class="muted">Task</label>
        <select id="compare-select" class="btn">${COMPARE_TASKS.map(t=>`<option value="${t.id}" ${t.id===task.id?'selected':''}>${escapeHtml(t.title)}</option>`).join("")}</select>
      </div>
      <p class="muted">${escapeHtml(task.note)}</p>
      <div class="compare-grid" style="margin-top:.75rem">
        ${VENDORS.map(v => {
          const id = task.map[v.id];
          const c = id ? findCmd(id) : null;
          return `<div class="compare-card">
            <h4>${v.label}</h4>
            ${c ? `<code>${escapeHtml(c.cmd)}</code><p class="muted">${escapeHtml(c.purpose.slice(0,120))}…</p>
              <button class="btn small" data-cmd="${c.id}">Open</button>` : `<p class="muted">See related set/syntax notes in encyclopedia.</p>`}
          </div>`;
        }).join("")}
      </div>`;
    $("#compare-select", el).addEventListener("change", e => { state.compareTask = e.target.value; renderCompare(); });
    $all("[data-cmd]", el).forEach(b => b.addEventListener("click", () => { state.selectedId = b.dataset.cmd; setView("encyclopedia"); }));
  }

  function renderSandbox() {
    const el = $("#view-sandbox");
    const scenario = SCENARIOS.filter(s => s.vendor === state.sandboxVendor);
    el.innerHTML = `
      <div class="section-title"><h2>CLI sandbox</h2><span class="muted">Study simulator — not a real device</span></div>
      <div class="toolbar">
        ${VENDORS.map(v => `<button class="chip ${state.sandboxVendor===v.id?'active':''}" data-sv="${v.id}">${v.label.split(' ')[0]}</button>`).join("")}
      </div>
      <div class="terminal" id="term">
        <div class="terminal-bar">
          <span class="muted">${VENDORS.find(v=>v.id===state.sandboxVendor).label}</span>
          <div>
            <button class="btn small" id="explain-last">Explain last</button>
            <button class="btn small" id="clear-term">Clear</button>
          </div>
        </div>
        <div class="terminal-body" id="term-body"></div>
        <div class="terminal-input-row">
          <span class="prompt">${currentPrompt()}<span class="cursor-blink">▌</span></span>
          <input id="term-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type a command…" />
        </div>
      </div>
      <div id="explain-panel" class="panel hidden" style="margin-top:.75rem"></div>
      <div class="section-title"><h2>Scenarios</h2></div>
      <div class="grid cards">
        ${SCENARIOS.map(s => `
          <button class="card-btn" data-scen="${s.id}">
            <h3>${escapeHtml(s.title)}</h3>
            <p>${vendorBadge(s.vendor)} ${escapeHtml(s.explain)}</p>
          </button>`).join("")}
      </div>`;
    const body = $("#term-body", el);
    state.sandboxHist.forEach(h => {
      body.innerHTML += `<div class="line-in">${escapeHtml(h.prompt + " " + h.input)}</div><div class="line-out ${h.err?'line-err':''}">${escapeHtml(h.output)}</div>`;
    });
    body.scrollTop = body.scrollHeight;
    $all("[data-sv]", el).forEach(b => b.addEventListener("click", () => {
      state.sandboxVendor = b.dataset.sv;
      const v = VENDORS.find(x => x.id === state.sandboxVendor);
      state.sandboxMode = Object.keys(v.prompt)[0];
      state.sandboxHist = [];
      saveState();
      renderSandbox();
    }));
    const input = $("#term-input", el);
    input.focus();
    input.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        runSandboxCommand(input.value);
        input.value = "";
      }
    });
    $("#clear-term", el).addEventListener("click", () => { state.sandboxHist = []; renderSandbox(); });
    $("#explain-last", el).addEventListener("click", explainLast);
    $all("[data-scen]", el).forEach(b => b.addEventListener("click", () => {
      const s = SCENARIOS.find(x => x.id === b.dataset.scen);
      state.sandboxVendor = s.vendor;
      const v = VENDORS.find(x => x.id === s.vendor);
      state.sandboxMode = Object.keys(v.prompt)[0];
      state.sandboxHist = [];
      s.steps.forEach(cmd => runSandboxCommand(cmd, true));
      bumpStreak();
      renderSandbox();
    }));
  }

  function runSandboxCommand(raw, silentRender) {
    const input = normalizeSandboxInput(raw);
    if (!input) return;
    const prompt = currentPrompt();
    // mode switches
    const low = input.toLowerCase();
    if (state.sandboxVendor === "cisco") {
      if (low === "configure terminal" || low === "conf t" || low === "config t") state.sandboxMode = "config";
      if (low === "end" || (low === "exit" && state.sandboxMode !== "exec")) state.sandboxMode = "exec";
    }
    if (state.sandboxVendor === "juniper" || state.sandboxVendor === "paloalto") {
      if (low === "configure" || low === "edit") state.sandboxMode = "config";
      if (low === "exit" || low === "quit") state.sandboxMode = state.sandboxVendor === "juniper" ? "operational" : "operational";
    }
    let output, err = false, matched = matchCommand(state.sandboxVendor, input);
    if (matched) {
      output = matched.sandboxOutput || matched.sample;
      state.lastCmd = matched;
    } else if (["exit","end","quit","top"].includes(low)) {
      output = "";
    } else if (low === "help" || low === "?") {
      output = COMMANDS.filter(c => c.vendor === state.sandboxVendor).slice(0, 12).map(c => c.cmd).join("\n") + "\n… (search encyclopedia for more)";
    } else {
      err = true;
      output = `% Unknown command in sandbox: ${input}\nHint: try 'help' or open Encyclopedia for ${state.sandboxVendor} commands.`;
      state.lastCmd = null;
    }
    state.sandboxHist.push({ prompt, input, output, err, cmdId: matched?.id || null });
    if (state.sandboxHist.length > 80) state.sandboxHist.shift();
    if (!silentRender && state.view === "sandbox") {
      const body = $("#term-body");
      if (body) {
        body.innerHTML += `<div class="line-in">${escapeHtml(prompt + " " + input)}</div><div class="line-out ${err?'line-err':''}">${escapeHtml(output)}</div>`;
        body.scrollTop = body.scrollHeight;
        // update prompt label
        $(".prompt").innerHTML = `${currentPrompt()}<span class="cursor-blink">▌</span>`;
      }
    } else if (silentRender) {
      // hist only; renderSandbox will paint
    }
  }

  function explainLast() {
    const panel = $("#explain-panel");
    if (!panel) return;
    const last = state.sandboxHist[state.sandboxHist.length - 1];
    if (!last) { panel.classList.remove("hidden"); panel.innerHTML = `<p class="muted">No command yet.</p>`; return; }
    const c = last.cmdId ? findCmd(last.cmdId) : state.lastCmd;
    panel.classList.remove("hidden");
    if (!c) {
      panel.innerHTML = `<h3>Explain</h3><p>No encyclopedia match for <code>${escapeHtml(last.input)}</code>. Search the encyclopedia.</p>
        <button class="btn" data-nav="encyclopedia">Encyclopedia</button>`;
      bindNav(panel);
      return;
    }
    panel.innerHTML = `
      <h3>Explain: <span class="cmd-name">${escapeHtml(c.cmd)}</span></h3>
      <p>${escapeHtml(c.purpose)}</p>
      <div class="token-list">${(c.tokens||[]).map(t=>`<div class="token"><code>${escapeHtml(t.t)}</code><span>${escapeHtml(t.d)}</span></div>`).join("")}</div>
      <button class="btn small" data-cmd="${c.id}" style="margin-top:.6rem">Open full card</button>`;
    $("[data-cmd]", panel).addEventListener("click", () => { state.selectedId = c.id; setView("encyclopedia"); });
  }
  function renderLabs() {
    const el = $("#view-labs");
    el.innerHTML = `
      <div class="section-title"><h2>Automation lab</h2><span class="muted">Copy scripts to your lab PC / GuestShell</span></div>
      <div class="grid cards" id="lab-cards">
        ${LABS.map(l => `<button class="card-btn" data-lab="${l.id}"><h3>${escapeHtml(l.title)}</h3><p>${escapeHtml(l.blurb)}</p></button>`).join("")}
      </div>
      <div id="lab-detail"></div>`;
    $all("[data-lab]", el).forEach(b => b.addEventListener("click", () => showLab(b.dataset.lab)));
  }

  function showLab(id) {
    const lab = LABS.find(l => l.id === id);
    const box = $("#lab-detail");
    const codeAll = lab.lines.map(l => l.code).join("\n\n");
    box.innerHTML = `
      <article class="panel lab-block" style="margin-top:1rem">
        <div class="toolbar" style="justify-content:space-between">
          <h3 style="margin:0">${escapeHtml(lab.title)}</h3>
          <button class="btn small" id="copy-lab">Copy all</button>
        </div>
        <p class="muted">${escapeHtml(lab.blurb)}</p>
        ${lab.lines.map((ln,i) => `
          <details class="lab-line" ${i===0?'open':''}>
            <summary><span>${escapeHtml(ln.code.split('\n')[0].slice(0,80))}${ln.code.length>80?'…':''}</span><span class="muted">explain</span></summary>
            <pre style="margin:.25rem .85rem;background:#070b10;border-radius:8px;padding:.7rem;border:1px solid var(--line)">${escapeHtml(ln.code)}</pre>
            <div class="explain">${escapeHtml(ln.explain)}</div>
          </details>`).join("")}
        <div class="kv" style="margin-top:.5rem">
          <div class="k">Mini quiz</div>
          <p>${escapeHtml(lab.quiz.q)}</p>
          ${lab.quiz.opts.map((o,i)=>`<button class="quiz-opt" data-qi="${i}">${escapeHtml(o)}</button>`).join("")}
          <div id="lab-quiz-msg" class="muted"></div>
        </div>
      </article>`;
    $("#copy-lab", box).addEventListener("click", async () => {
      try { await navigator.clipboard.writeText(codeAll); $("#copy-lab", box).textContent = "Copied"; }
      catch { $("#copy-lab", box).textContent = "Select & copy manually"; }
    });
    $all(".quiz-opt", box).forEach(btn => btn.addEventListener("click", () => {
      const i = +btn.dataset.qi;
      $all(".quiz-opt", box).forEach(x => x.classList.remove("correct","wrong"));
      if (i === lab.quiz.a) { btn.classList.add("correct"); $("#lab-quiz-msg").textContent = "Correct."; bumpStreak(); }
      else { btn.classList.add("wrong"); $all(".quiz-opt", box)[lab.quiz.a].classList.add("correct"); $("#lab-quiz-msg").textContent = "Review the line explainers above."; }
    }));
  }

  function flashDeck() {
    // prefer hard cards
    const base = COMMANDS.map(c => ({ id: c.id, front: c.cmd, back: `${c.vendor}: ${c.purpose}`, vendor: c.vendor }));
    const hard = base.filter(c => state.flashHard[c.id]);
    const deck = hard.length ? hard.concat(base.filter(c => !state.flashHard[c.id])) : base;
    return deck;
  }

  function renderDrills() {
    const el = $("#view-drills");
    const deck = flashDeck();
    if (state.flashIdx >= deck.length) state.flashIdx = 0;
    const card = deck[state.flashIdx];
    const quiz = QUIZZES[state.quizIdx % QUIZZES.length];
    el.innerHTML = `
      <div class="section-title"><h2>Flashcards</h2><span class="muted">${state.flashIdx+1}/${deck.length}</span></div>
      <div class="flash-card" id="flash">
        ${state.flashSide==='front'
          ? `<div><div class="muted" style="margin-bottom:.5rem">${vendorBadge(card.vendor)}</div><div class="front">${escapeHtml(card.front)}</div><p class="muted" style="margin-top:1rem">Tap to reveal</p></div>`
          : `<div class="back">${escapeHtml(card.back)}</div>`}
      </div>
      <div class="toolbar" style="margin-top:.75rem">
        <button class="btn" id="flash-prev">Prev</button>
        <button class="btn" id="flash-hard">Mark hard</button>
        <button class="btn primary" id="flash-next">Next</button>
      </div>
      <div class="section-title"><h2>Scenario quiz</h2></div>
      <div class="panel">
        <p>${escapeHtml(quiz.q)}</p>
        ${quiz.opts.map((o,i)=>`<button class="quiz-opt" data-ans="${i}">${escapeHtml(o)}</button>`).join("")}
        <div id="quiz-msg" class="muted" style="margin-top:.5rem"></div>
        <button class="btn small" id="quiz-next" style="margin-top:.5rem">Next question</button>
      </div>
      <div class="section-title"><h2>Incident scenarios</h2></div>
      <div class="list">
        ${SCENARIOS.map(s => `
          <button class="list-item" data-go-scen="${s.id}">
            <div class="row">${vendorBadge(s.vendor)}</div>
            <strong>${escapeHtml(s.title)}</strong>
            <p class="muted">${escapeHtml(s.explain)}</p>
          </button>`).join("")}
      </div>`;
    $("#flash", el).addEventListener("click", () => { state.flashSide = state.flashSide === "front" ? "back" : "front"; renderDrills(); });
    $("#flash-next", el).addEventListener("click", () => { state.flashIdx++; state.flashSide = "front"; bumpStreak(); renderDrills(); });
    $("#flash-prev", el).addEventListener("click", () => { state.flashIdx = Math.max(0, state.flashIdx-1); state.flashSide = "front"; renderDrills(); });
    $("#flash-hard", el).addEventListener("click", () => { state.flashHard[card.id] = Date.now(); saveState(); $("#flash-hard", el).textContent = "Marked"; });
    $all("[data-ans]", el).forEach(b => b.addEventListener("click", () => {
      const i = +b.dataset.ans;
      $all("[data-ans]", el).forEach(x => x.classList.remove("correct","wrong"));
      if (i === quiz.a) { b.classList.add("correct"); $("#quiz-msg").textContent = "Nice."; bumpStreak(); state.quizDone[state.quizIdx] = true; saveState(); }
      else { b.classList.add("wrong"); $all("[data-ans]", el)[quiz.a].classList.add("correct"); $("#quiz-msg").textContent = "Check encyclopedia equivalents."; }
    }));
    $("#quiz-next", el).addEventListener("click", () => { state.quizIdx++; renderDrills(); });
    $all("[data-go-scen]", el).forEach(b => b.addEventListener("click", () => {
      const s = SCENARIOS.find(x => x.id === b.dataset.goScen);
      state.sandboxVendor = s.vendor;
      state.sandboxHist = [];
      setView("sandbox");
      setTimeout(() => { s.steps.forEach(cmd => runSandboxCommand(cmd, true)); renderSandbox(); }, 0);
    }));
  }

  function renderPlanner() {
    const el = $("#view-planner");
    const tk = todayKey();
    const doneCount = DAILY.filter(d => state.dailyDone[tk + ":" + d.id]).length;
    el.innerHTML = `
      <div class="section-title"><h2>Study planner</h2><span class="muted">Streak ${state.streak||0}</span></div>
      <div class="panel">
        <h3>Daily loop (20–40 min)</h3>
        <div class="progress" style="margin:.6rem 0 1rem"><span style="width:${(doneCount/DAILY.length)*100}%"></span></div>
        <div class="list">
          ${DAILY.map(d => {
            const key = tk + ":" + d.id;
            const done = !!state.dailyDone[key];
            return `<div class="list-item" style="display:flex;justify-content:space-between;gap:.75rem;align-items:center">
              <div>
                <strong>${escapeHtml(d.title)}</strong>
                <p class="muted">${d.mins} min · ${escapeHtml(d.detail)}</p>
              </div>
              <div class="toolbar">
                <button class="btn small" data-nav="${d.action}">Go</button>
                <button class="btn small ${done?'primary':''}" data-daily="${d.id}">${done?'Done':'Check'}</button>
              </div>
            </div>`;
          }).join("")}
        </div>
      </div>
      <div class="section-title"><h2>Weekly focus</h2></div>
      <div class="list">
        ${WEEKLY.map(w => `
          <button class="list-item" data-nav="${w.action}" ${w.vendor?`data-set-vendor="${w.vendor}"`:''}>
            <div class="row"><span class="badge">${w.day}</span></div>
            <strong>${escapeHtml(w.focus)}</strong>
          </button>`).join("")}
      </div>
      <div class="section-title"><h2>Troubleshooting journal</h2></div>
      <div class="panel">
        <textarea class="journal" id="journal" placeholder="What would you check first if users in VLAN 10 suddenly lost the gateway?">${escapeHtml(state.journal||"")}</textarea>
        <button class="btn primary" id="save-journal" style="margin-top:.6rem">Save journal</button>
      </div>`;
    bindNav(el);
    $all("[data-daily]", el).forEach(b => b.addEventListener("click", () => {
      const key = tk + ":" + b.dataset.daily;
      state.dailyDone[key] = !state.dailyDone[key];
      if (state.dailyDone[key]) bumpStreak();
      saveState(); renderPlanner();
    }));
    $all("[data-set-vendor]", el).forEach(b => b.addEventListener("click", () => { state.vendorFilter = b.dataset.setVendor; }));
    $("#save-journal", el).addEventListener("click", () => {
      state.journal = $("#journal", el).value;
      saveState(); bumpStreak();
      $("#save-journal", el).textContent = "Saved";
    });
  }

  function renderToolkit() {
    const el = $("#view-toolkit");
    el.innerHTML = `
      <div class="section-title"><h2>Networker toolkit</h2><span class="muted">What to learn alongside NetForge</span></div>
      ${TOOLKIT.map(cat => `
        <div class="section-title"><h2>${escapeHtml(cat.cat)}</h2></div>
        <div class="grid cards">
          ${cat.items.map(it => `
            <div class="panel">
              <h3>${escapeHtml(it.name)}</h3>
              <p><span class="k muted">Why</span><br>${escapeHtml(it.why)}</p>
              <p style="margin-top:.5rem"><span class="k muted">When</span><br>${escapeHtml(it.when)}</p>
              <p style="margin-top:.5rem"><span class="k muted">Offline tip</span><br>${escapeHtml(it.tip)}</p>
            </div>`).join("")}
        </div>`).join("")}
      <div class="panel" style="margin-top:1rem">
        <h3>Suggested weekly mix</h3>
        <p class="muted">2 days Packet Tracer/GNS3 · 1 day Wireshark pcaps · 1 day Netmiko scripts · 1 day host Linux/PowerShell · weekend scenario review in NetForge drills.</p>
      </div>`;
  }

  function escapeHtml(s) {
    return String(s ?? "").replace(/[&<>"']/g, ch => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[ch]));
  }

  function bindNav(root) {
    $all("[data-nav]", root).forEach(b => b.addEventListener("click", () => setView(b.dataset.nav)));
  }

  function renderView() {
    switch (state.view) {
      case "home": renderHome(); break;
      case "encyclopedia": renderEncyclopedia(); break;
      case "compare": renderCompare(); break;
      case "sandbox": renderSandbox(); break;
      case "labs": renderLabs(); break;
      case "drills": renderDrills(); break;
      case "planner": renderPlanner(); break;
      case "toolkit": renderToolkit(); break;
      default: renderHome();
    }
  }

  function init() {
    COMMANDS = window.NETFORGE_COMMANDS || [];
    loadState();
    // nav
    $all(".desktop-nav button, .bottom-nav button, .brand").forEach(b => {
      b.addEventListener("click", () => setView(b.dataset.nav || "home"));
    });
    const search = $("#global-search");
    let t = null;
    search.addEventListener("input", () => {
      clearTimeout(t);
      t = setTimeout(() => {
        state.query = search.value;
        state.selectedId = null;
        if (state.view !== "encyclopedia") setView("encyclopedia");
        else renderEncyclopedia();
      }, 120);
    });
    search.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        state.query = search.value;
        state.selectedId = null;
        setView("encyclopedia");
      }
    });
    setView("home");
  }

  document.addEventListener("DOMContentLoaded", init);
})();

</script>
</body>
</html>
