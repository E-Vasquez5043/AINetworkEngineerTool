<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<meta name="theme-color" content="#0c1218" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="description" content="NetForge — offline multi-vendor network engineering study tool" />
<title>NetForge — Offline Network Engineering Study Tool</title>
<style>
:root {
  --bg0: #0c1218;
  --bg1: #121b24;
  --bg2: #182430;
  --bg3: #1e2e3c;
  --line: rgba(120, 160, 180, 0.18);
  --text: #e6eef4;
  --muted: #8aa0b2;
  --copper: #d4894a;
  --copper2: #f0b27a;
  --teal: #3db8a0;
  --teal2: #7ee0cb;
  --danger: #e85d5d;
  --caution: #e0b34d;
  --safe: #4ecf8a;
  --font: "IBM Plex Sans", "Segoe UI", "Helvetica Neue", sans-serif;
  --mono: "IBM Plex Mono", "SF Mono", "Consolas", monospace;
  --radius: 10px;
  --nav-h: 64px;
  --bottom-h: 64px;
  --shadow: 0 12px 40px rgba(0,0,0,.35);
}
*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  min-height: 100dvh;
  font-family: var(--font);
  color: var(--text);
  background:
    radial-gradient(1200px 600px at 10% -10%, rgba(212,137,74,.14), transparent 55%),
    radial-gradient(900px 500px at 100% 0%, rgba(61,184,160,.10), transparent 50%),
    linear-gradient(180deg, var(--bg0), #0a1015 40%, var(--bg0));
  background-attachment: fixed;
  -webkit-font-smoothing: antialiased;
  padding-bottom: calc(var(--bottom-h) + env(safe-area-inset-bottom));
}
body::before {
  content: "";
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image:
    linear-gradient(rgba(125,170,190,.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(125,170,190,.04) 1px, transparent 1px);
  background-size: 28px 28px;
  mask-image: radial-gradient(ellipse at center, black 30%, transparent 75%);
}
#app { position: relative; z-index: 1; min-height: 100dvh; }
a { color: var(--teal2); text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.topbar {
  position: sticky; top: 0; z-index: 40;
  display: flex; align-items: center; gap: .75rem;
  padding: .75rem 1rem;
  padding-top: calc(.75rem + env(safe-area-inset-top));
  background: rgba(12,18,24,.86);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--line);
}
.brand {
  display: flex; align-items: center; gap: .6rem; min-width: max-content;
  border: 0; background: transparent; padding: 0;
}
.brand-mark {
  width: 34px; height: 34px; border-radius: 9px;
  background: linear-gradient(145deg, var(--copper), #9a5a28);
  display: grid; place-items: center;
  box-shadow: 0 0 0 1px rgba(240,178,122,.25), 0 8px 20px rgba(212,137,74,.25);
  animation: pulseGlow 3.2s ease-in-out infinite;
}
.brand-mark svg { width: 18px; height: 18px; }
.brand-text { text-align: left; line-height: 1.05; }
.brand-text strong { display: block; font-size: 1.05rem; letter-spacing: .02em; }
.brand-text span { font-size: .72rem; color: var(--muted); }
.search-wrap { flex: 1; position: relative; max-width: 640px; }
.search-wrap input {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--bg2);
  border-radius: 999px;
  padding: .7rem 1rem .7rem 2.4rem;
  outline: none;
  transition: border-color .2s, box-shadow .2s;
}
.search-wrap input:focus {
  border-color: rgba(61,184,160,.55);
  box-shadow: 0 0 0 3px rgba(61,184,160,.15);
}
.search-wrap .ico {
  position: absolute; left: .85rem; top: 50%; transform: translateY(-50%);
  color: var(--muted); pointer-events: none;
}
.desktop-nav { display: none; gap: .35rem; margin-left: auto; }
.desktop-nav button {
  border: 1px solid transparent; background: transparent; color: var(--muted);
  padding: .45rem .7rem; border-radius: 8px; font-size: .85rem;
}
.desktop-nav button.active, .desktop-nav button:hover {
  color: var(--text); background: var(--bg3); border-color: var(--line);
}
.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: grid; grid-template-columns: repeat(5, 1fr);
  gap: .15rem;
  padding: .35rem .35rem calc(.35rem + env(safe-area-inset-bottom));
  background: rgba(12,18,24,.94);
  border-top: 1px solid var(--line);
  backdrop-filter: blur(14px);
}
.bottom-nav button {
  border: 0; background: transparent; color: var(--muted);
  padding: .35rem .2rem; border-radius: 10px; font-size: .68rem;
  display: flex; flex-direction: column; align-items: center; gap: .15rem;
}
.bottom-nav button.active { color: var(--copper2); background: rgba(212,137,74,.12); }
.bottom-nav svg { width: 18px; height: 18px; }
.view { display: none; padding: 1rem; max-width: 1100px; margin: 0 auto; animation: fadeUp .35s ease; }
.view.active { display: block; }
@keyframes fadeUp {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}
@keyframes pulseGlow {
  0%,100% { box-shadow: 0 0 0 1px rgba(240,178,122,.25), 0 8px 20px rgba(212,137,74,.2); }
  50% { box-shadow: 0 0 0 1px rgba(240,178,122,.4), 0 8px 28px rgba(212,137,74,.4); }
}
@keyframes blink { 50% { opacity: 0; } }
.cursor-blink { animation: blink 1.1s step-end infinite; }
.hero {
  padding: 1.25rem 0 1.5rem;
  display: grid; gap: 1rem;
}
.hero h1 {
  margin: 0; font-size: clamp(2rem, 6vw, 3.2rem); line-height: 1.05;
  letter-spacing: -.02em;
  background: linear-gradient(90deg, var(--text), var(--copper2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.hero p { margin: 0; color: var(--muted); max-width: 36rem; font-size: 1.02rem; }
.vendor-strip { display: flex; flex-wrap: wrap; gap: .45rem; }
.chip, .tag {
  display: inline-flex; align-items: center; gap: .35rem;
  border: 1px solid var(--line); background: rgba(24,36,48,.8);
  color: var(--text); border-radius: 999px; padding: .35rem .7rem; font-size: .8rem;
}
.chip.active, .chip:hover { border-color: rgba(212,137,74,.5); color: var(--copper2); }
.chip[data-v="cisco"].active { border-color: rgba(61,184,160,.5); color: var(--teal2); }
.grid { display: grid; gap: .85rem; }
.grid.cards { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.card-btn, .panel {
  border: 1px solid var(--line); background: linear-gradient(180deg, rgba(30,46,60,.9), rgba(18,27,36,.92));
  border-radius: var(--radius); padding: 1rem; text-align: left;
  box-shadow: var(--shadow);
  transition: transform .2s ease, border-color .2s;
}
.card-btn:hover { transform: translateY(-2px); border-color: rgba(212,137,74,.4); }
.card-btn h3, .panel h3 { margin: 0 0 .35rem; font-size: 1rem; }
.card-btn p, .muted { color: var(--muted); margin: 0; font-size: .9rem; }
.section-title {
  display: flex; align-items: end; justify-content: space-between; gap: 1rem;
  margin: 1.25rem 0 .75rem;
}
.section-title h2 { margin: 0; font-size: 1.15rem; }
.toolbar { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: .85rem; align-items: center; }
.btn {
  border: 1px solid var(--line); background: var(--bg3); color: var(--text);
  border-radius: 8px; padding: .55rem .85rem; font-size: .88rem;
}
.btn:hover { border-color: rgba(61,184,160,.45); }
.btn.primary {
  background: linear-gradient(135deg, var(--copper), #a8642f);
  border-color: transparent; color: #1a1008; font-weight: 600;
}
.btn.ghost { background: transparent; }
.btn.small { padding: .35rem .6rem; font-size: .78rem; }
.list { display: grid; gap: .55rem; }
.list-item {
  display: grid; gap: .25rem;
  border: 1px solid var(--line); background: rgba(18,27,36,.85);
  border-radius: 10px; padding: .85rem .95rem; text-align: left; width: 100%;
  animation: fadeUp .3s ease;
}
.list-item:hover { border-color: rgba(61,184,160,.4); }
.list-item .row { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; }
.cmd-name { font-family: var(--mono); font-size: .95rem; color: var(--teal2); }
.badge {
  font-size: .68rem; text-transform: uppercase; letter-spacing: .04em;
  padding: .15rem .45rem; border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
}
.badge.cisco { color: #7ec8ff; border-color: rgba(126,200,255,.3); }
.badge.juniper { color: #86e0a8; border-color: rgba(134,224,168,.3); }
.badge.paloalto { color: #f0a070; border-color: rgba(240,160,112,.3); }
.badge.linux { color: #f0d56a; border-color: rgba(240,213,106,.3); }
.badge.powershell { color: #9bb7ff; border-color: rgba(155,183,255,.3); }
.badge.vmware { color: #7fe3d0; border-color: rgba(127,227,208,.3); }
.badge.safe { color: var(--safe); }
.badge.caution { color: var(--caution); }
.badge.danger { color: var(--danger); }
.detail { display: grid; gap: 1rem; }
.detail .syntax, pre, code, .term-out {
  font-family: var(--mono); font-size: .84rem;
}
.detail .syntax, pre, .term-out {
  background: #070b10; border: 1px solid var(--line); border-radius: 10px;
  padding: .9rem 1rem; overflow: auto; white-space: pre-wrap; word-break: break-word;
}
.token-list { display: grid; gap: .45rem; }
.token {
  display: grid; grid-template-columns: minmax(90px, auto) 1fr; gap: .6rem;
  padding: .55rem .7rem; border-radius: 8px; background: var(--bg2); border: 1px solid var(--line);
}
.token code { color: var(--copper2); }
.kv { display: grid; gap: .65rem; }
.kv .k { color: var(--muted); font-size: .78rem; text-transform: uppercase; letter-spacing: .04em; }
.compare-grid {
  display: grid; gap: .75rem;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
}
.compare-card {
  border: 1px solid var(--line); border-radius: 10px; padding: .85rem; background: var(--bg2);
}
.compare-card h4 { margin: 0 0 .5rem; font-size: .85rem; color: var(--muted); text-transform: uppercase; }
.compare-card code { color: var(--teal2); font-size: .82rem; display: block; margin-bottom: .35rem; }
.terminal {
  background: #070b10; border: 1px solid var(--line); border-radius: 12px; overflow: hidden;
  box-shadow: var(--shadow);
}
.terminal-bar {
  display: flex; gap: .5rem; align-items: center; justify-content: space-between;
  padding: .55rem .8rem; background: var(--bg2); border-bottom: 1px solid var(--line);
}
.terminal-body {
  min-height: 280px; max-height: 52vh; overflow: auto; padding: .85rem;
  font-family: var(--mono); font-size: .84rem; line-height: 1.45;
}
.terminal-input-row {
  display: flex; gap: .4rem; align-items: center; padding: .65rem .8rem;
  border-top: 1px solid var(--line); background: #0a1016;
}
.terminal-input-row .prompt { color: var(--copper2); white-space: nowrap; font-family: var(--mono); font-size: .84rem; }
.terminal-input-row input {
  flex: 1; border: 0; outline: none; background: transparent; font-family: var(--mono); font-size: .84rem;
}
.line-in { color: var(--text); }
.line-out { color: #b7c7d4; margin: .25rem 0 .7rem; white-space: pre-wrap; }
.line-err { color: var(--caution); }
.lab-block { display: grid; gap: .75rem; }
.lab-line {
  border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--bg2);
}
.lab-line summary {
  list-style: none; cursor: pointer; padding: .7rem .85rem; display: flex; justify-content: space-between; gap: .5rem;
  font-family: var(--mono); font-size: .82rem; color: var(--teal2);
}
.lab-line summary::-webkit-details-marker { display: none; }
.lab-line .explain { padding: 0 .85rem .85rem; color: var(--muted); font-size: .9rem; }
.flash-card {
  min-height: 180px; display: grid; place-items: center; text-align: center; padding: 1.25rem;
  border: 1px solid var(--line); border-radius: 14px; background: linear-gradient(160deg, var(--bg3), var(--bg1));
  cursor: pointer; user-select: none;
}
.flash-card .front { font-family: var(--mono); font-size: 1.15rem; color: var(--teal2); }
.flash-card .back { color: var(--text); font-size: 1rem; }
.progress {
  height: 8px; border-radius: 999px; background: var(--bg3); overflow: hidden; border: 1px solid var(--line);
}
.progress > span { display: block; height: 100%; background: linear-gradient(90deg, var(--copper), var(--teal)); width: 0; transition: width .35s ease; }
.quiz-opt {
  display: block; width: 100%; text-align: left; margin: .4rem 0; padding: .75rem .9rem;
  border-radius: 10px; border: 1px solid var(--line); background: var(--bg2);
}
.quiz-opt.correct { border-color: var(--safe); background: rgba(78,207,138,.1); }
.quiz-opt.wrong { border-color: var(--danger); background: rgba(232,93,93,.1); }
.journal {
  width: 100%; min-height: 90px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--bg2); padding: .75rem; resize: vertical;
}
.empty { color: var(--muted); padding: 1.5rem .5rem; text-align: center; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }
@media (min-width: 900px) {
  .bottom-nav { display: none; }
  .desktop-nav { display: flex; }
  body { padding-bottom: 0; }
  .view { padding: 1.25rem 1.5rem 2rem; }
}

</style>
</head>

  </nav>
</div>

at you typed."}], "when": "Turning EIGRP on for a set of links, and whenever an expected neighbor never comes up.", "whenNot": "Do not use a broad classful network statement on a router with internet or DMZ interfaces in the same major net \u2014 you will leak hellos onto untrusted segments. Use passive-interface default or an exact 0.0.0.0 wildcard instead.", "safety": "caution", "related": ["eigrp-router-eigrp", "eigrp-sh-interfaces", "eigrp-passive-interface-default", "eigrp-sh-ip-protocols", "cisco-eigrp-nei"], "tags": ["eigrp", "routing", "configuration", "wildcard-mask", "gotcha"], "equivalents": {"juniper": "set protocols ospf area 0 interface ge-0/0/0.0", "paloalto": "set network virtual-router default protocol ospf area 0.0.0.0 interface ethernet1/1", "linux": "vtysh -c 'router eigrp 100' -c 'network 10.1.1.0/24' (FRRouting)"}, "sandboxOutput": "R1(config)#router eigrp 100\nR1(config-router)#network 10.1.1.0 0.0.0.255\nR1(config-router)#\n*Jul 25 14:12:33.881: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.1.2 (GigabitEthernet0/0) is up: new adjacency\nR1(config-router)#network 10.1.2.0 0.0.0.255\nR1(config-router)#\n*Jul 25 14:12:51.207: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.2.2 (FastEthernet0/1) is up: new adjacency"}, {"id": "eigrp-router-id", "vendor": "cisco", "family": "IOS/XE", "mode": "config", "cmd": "eigrp router-id <rid>", "aliases": ["eigrp router-id 1.1.1.1", "eigrp router-id 10.255.0.1", "no eigrp router-id"], "purpose": "Pins the 32-bit EIGRP router ID instead of letting IOS derive it. The RID stamps external (redistributed) routes so the originator can recognise and discard its own routes coming back.", "tokens": [{"t": "eigrp", "d": "EIGRP-specific sub-command inside router configuration mode"}, {"t": "router-id", "d": "Sets the process router ID"}, {"t": "<rid>", "d": "Dotted-quad value. It is an identifier, not an address \u2014 it does not have to be reachable or even exist on the box"}], "syntax": "eigrp router-id <A.B.C.D>", "flags": [{"f": "default derivation", "d": "Highest IP on an up loopback; if no loopback, highest IP on any up interface. Reboot with a different interface up and your RID silently changes."}, {"f": "no eigrp router-id", "d": "Reverts to automatic derivation."}], "sample": "R1(config)#router eigrp 100\nR1(config-router)#eigrp router-id 1.1.1.1\nR1(config-router)#end\nR1#show ip protocols | include Router-ID\n    Router-ID: 1.1.1.1", "annotations": [{"field": "Router-ID: 1.1.1.1", "note": "Confirm here, not in show run \u2014 if the command was rejected or overridden you still see the derived value."}, {"field": "Duplicate RID symptom", "note": "Two routers sharing a RID cause EX (external/redistributed) routes to be dropped as self-originated. Internal routes keep working, so the failure looks partial and baffling."}, {"field": "Taking effect", "note": "Existing topology entries keep the old stamp. Clear the neighbors (or reload the process) if you changed the RID to fix a duplicate."}], "when": "Always set it explicitly at build time, and set it first when redistribution is involved.", "whenNot": "Do not reuse an OSPF RID pattern blindly across routers, and do not treat it as a loopback address \u2014 EIGRP never sends packets to the RID.", "safety": "caution", "related": ["eigrp-router-eigrp", "eigrp-sh-ip-protocols", "eigrp-clear-neighbors", "cisco-sh-ip-ospf"], "tags": ["eigrp", "routing", "configuration", "router-id", "redistribution"], "equivalents": {"juniper": "set routing-options router-id 1.1.1.1", "paloalto": "set network virtual-router default protocol ospf router-id 1.1.1.1", "linux": "vtysh -c 'router eigrp 100' -c 'eigrp router-id 1.1.1.1' (FRRouting)"}, "sandboxOutput": "R1(config)#router eigrp 100\nR1(config-router)#eigrp router-id 1.1.1.1\nR1(config-router)#end\nR1#show ip protocols | include Router-ID\n    Router-ID: 1.1.1.1"}, {"id": "eigrp-passive-interface", "vendor": "cisco", "family": "IOS/XE", "mode": "config", "cmd": "passive-interface <interface>", "aliases": ["passive-interface GigabitEthernet0/3", "passive-interface Gi0/3", "passive-interface Loopback0", "no passive-interface GigabitEthernet0/3"], "purpose": "Stops EIGRP hellos on one interface so no adjacency can form there, while still advertising that interface's connected subnet into EIGRP. The standard treatment for user-VLAN SVIs, loopbacks and any edge link.", "tokens": [{"t": "passive-interface", "d": "Suppress protocol hellos on the named interface"}, {"t": "<interface>", "d": "Full or abbreviated interface name, e.g. GigabitEthernet0/3 or Gi0/3"}], "syntax": "passive-interface <interface-type> <interface-number>", "flags": [{"f": "no passive-interface <intf>", "d": "Re-enables hellos on that interface."}, {"f": "Loopback0", "d": "Loopbacks should essentially always be passive \u2014 nothing can peer over them anyway."}], "sample": "R1(config)#router eigrp 100\nR1(config-router)#passive-interface GigabitEthernet0/3\nR1(config-router)#\n*Jul 25 14:17:44.612: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.4.2 (GigabitEthernet0/3) is down: interface passive\nR1(config-router)#passive-interface Loopback0\nR1(config-router)#end\nR1#show ip eigrp interfaces\nEIGRP-IPv4 Interfaces for AS(100)\n                        Xmit Queue   PeerQ        Mean   Pacing Time   Multicast    Pending\nInterface        Peers  Un/Reliable  Un/Reliable  SRTT   Un/Reliable   Flow Timer   Routes\nGi0/0              1        0/0       0/0           5       0/1           50           0\nFa0/1              1        0/0       0/0          22       0/1          114           0\nGi0/2              1        0/0       0/0           7       0/1           50           0", "annotations": [{"field": "is down: interface passive", "note": "Any existing neighbor on that link is torn down immediately \u2014 this is not a safe-by-default command on a transit link."}, {"field": "Gi0/3 absent from show ip eigrp interfaces", "note": "Passive interfaces disappear from this table. Missing = passive took effect. That is the cleanest verification."}, {"field": "Subnet still advertised", "note": "The 10.1.4.0/24 prefix is still sent to other neighbors \u2014 passive suppresses hellos, it does not withdraw the route. This is what people get wrong."}], "when": "Any interface facing hosts, servers, an ISP, or a security boundary where you never want to peer but do want the subnet in EIGRP.", "whenNot": "Never on a link where you expect a neighbor. Also not a substitute for a distribute-list \u2014 it does not filter prefixes.", "safety": "caution", "related": ["eigrp-passive-interface-default", "eigrp-sh-interfaces", "eigrp-sh-ip-protocols", "cisco-eigrp-nei", "eigrp-network"], "tags": ["eigrp", "routing", "configuration", "security", "hardening"], "equivalents": {"juniper": "set protocols ospf area 0 interface ge-0/0/3.0 passive", "paloalto": "set network virtual-router default protocol ospf area 0.0.0.0 interface ethernet1/4 passive yes", "linux": "vtysh -c 'router eigrp 100' -c 'passive-interface eth3' (FRRouting)"}, "sandboxOutput": "R1(config)#router eigrp 100\nR1(config-router)#passive-interface GigabitEthernet0/3\nR1(config-router)#\n*Jul 25 14:17:44.612: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.4.2 (GigabitEthernet0/3) is down: interface passive\nR1(config-router)#passive-interface Loopback0\nR1(config-router)#end\nR1#show ip eigrp interfaces\nEIGRP-IPv4 Interfaces for AS(100)\n                        Xmit Queue   PeerQ        Mean   Pacing Time   Multicast    Pending\nInterface        Peers  Un/Reliable  Un/Reliable  SRTT   Un/Reliable   Flow Timer   Routes\nGi0/0              1        0/0       0/0           5       0/1           50           0\nFa0/1              1        0/0       0/0          22       0/1          114           0\nGi0/2              1        0/0       0/0           7       0/1           50           0"}, {"id": "eigrp-passive-interface-default", "vendor": "cisco", "family": "IOS/XE", "mode": "config", "cmd": "passive-interface default", "aliases": ["no passive-interface GigabitEthernet0/0", "no passive-interface Gi0/0", "passive-interface default"], "purpose": "Flips the policy to deny-by-default: every EIGRP-enabled interface goes passive, then you explicitly re-enable hellos only on real transit links with 'no passive-interface'. This is the safe build pattern.", "tokens": [{"t": "passive-interface", "d": "Hello suppression control"}, {"t": "default", "d": "Apply to ALL interfaces the process currently covers and any future ones"}], "syntax": "passive-interface default\n no passive-interface <interface-type> <interface-number>", "flags": [{"f": "no passive-interface <intf>", "d": "Carve-out: re-enables hellos on one interface. Repeat for each transit link."}, {"f": "Ordering", "d": "It is an implicit deny-all with permit exceptions \u2014 order does not matter, but forgetting a carve-out drops that adjacency."}], "sample": "R1(config)#router eigrp 100\nR1(config-router)#passive-interface default\nR1(config-router)#\n*Jul 25 14:19:02.118: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.1.2 (GigabitEthernet0/0) is down: interface passive\n*Jul 25 14:19:02.122: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.2.2 (FastEthernet0/1) is down: interface passive\n*Jul 25 14:19:02.126: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.3.2 (GigabitEthernet0/2) is down: interface passive\nR1(config-router)#no passive-interface GigabitEthernet0/0\nR1(config-router)#\n*Jul 25 14:19:18.443: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.1.2 (GigabitEthernet0/0) is up: new adjacency\nR1(config-router)#no passive-interface FastEthernet0/1\nR1(config-router)#no passive-interface GigabitEthernet0/2", "annotations": [{"field": "Three simultaneous 'is down: interface passive'", "note": "Every adjacency drops the instant you type 'default'. On a production box this is an outage window \u2014 paste the whole block, or pre-stage it in a config session."}, {"field": "'is up: new adjacency'", "note": "Each carve-out brings its neighbor straight back. If one does not come back you found your typo."}, {"field": "Verification", "note": "show ip protocols lists every passive interface; show ip eigrp interfaces lists only the non-passive ones. Cross-check both."}], "when": "Standard hardening on any router with more edge ports than transit ports \u2014 campus distribution, branch routers, anything facing users.", "whenNot": "Do not type it interactively over a link you are SSHed through and whose route depends on EIGRP \u2014 you can cut your own session. Stage it as a single paste.", "safety": "danger", "related": ["eigrp-passive-interface", "eigrp-sh-interfaces", "eigrp-sh-ip-protocols", "eigrp-network", "cisco-eigrp-nei"], "tags": ["eigrp", "routing", "configuration", "hardening", "security", "intermediate"], "equivalents": {"juniper": "set protocols ospf area 0 interface all passive + explicit non-passive per interface", "paloalto": "set network virtual-router default protocol ospf area 0.0.0.0 interface <intf> passive yes", "linux": "vtysh -c 'router eigrp 100' -c 'passive-interface default' (FRRouting)"}, "sandboxOutput": "R1(config)#router eigrp 100\nR1(config-router)#passive-interface default\nR1(config-router)#\n*Jul 25 14:19:02.118: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.1.2 (GigabitEthernet0/0) is down: interface passive\n*Jul 25 14:19:02.122: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.2.2 (FastEthernet0/1) is down: interface passive\n*Jul 25 14:19:02.126: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.3.2 (GigabitEthernet0/2) is down: interface passive\nR1(config-router)#no passive-interface GigabitEthernet0/0\nR1(config-router)#\n*Jul 25 14:19:18.443: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.1.2 (GigabitEthernet0/0) is up: new adjacency\nR1(config-router)#no passive-interface FastEthernet0/1\nR1(config-router)#no passive-interface GigabitEthernet0/2"}, {"id": "eigrp-no-auto-summary", "vendor": "cisco", "family": "IOS/XE", "mode": "config", "cmd": "no auto-summary", "aliases": ["auto-summary", "no auto-summary"], "purpose": "Disables automatic summarization to the classful boundary when EIGRP advertises across a major-network border. Mandatory on any discontiguous address plan, which in practice means every real network.", "tokens": [{"t": "no", "d": "Negate the feature"}, {"t": "auto-summary", "d": "Classful auto-summarization at major network boundaries"}], "syntax": "no auto-summary", "flags": [{"f": "Default state", "d": "Disabled by default on IOS 15.x/IOS-XE. Enabled by default on 12.x. Never assume \u2014 read it from show ip protocols."}, {"f": "auto-summary", "d": "Re-enables it. There is almost no modern reason to do this."}], "sample": "R1(config)#router eigrp 100\nR1(config-router)#no auto-summary\nR1(config-router)#\n*Jul 25 14:21:10.774: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.1.2 (GigabitEthernet0/0) is resync: summary configured\n*Jul 25 14:21:10.778: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.3.2 (GigabitEthernet0/2) is resync: summary configured\nR1(config-router)#end\nR1#show ip protocols | include Automatic\n  Automatic Summarization: disabled", "annotations": [{"field": "is resync: summary configured", "note": "Not a reset \u2014 EIGRP does a graceful resync and re-exchanges the topology. Brief churn, no adjacency loss."}, {"field": "Automatic Summarization: disabled", "note": "The authoritative check. 'no auto-summary' may not appear in show run at all when it is already the default."}, {"field": "Discontiguous networks", "note": "If 172.16.10.0/24 sits behind R2 and 172.16.20.0/24 behind R3, with auto-summary on both advertise 172.16.0.0/16. Every router sees two equal paths to the same /16 and half your traffic black-holes."}], "when": "Include it in every EIGRP template, even on 15.x where it is already the default \u2014 it documents intent and survives a downgrade.", "whenNot": "Do not rely on it as your summarization strategy. Deliberate summarization belongs on the interface with ip summary-address eigrp.", "safety": "caution", "related": ["eigrp-ip-summary-address", "eigrp-sh-ip-protocols", "eigrp-sh-topology", "eigrp-router-eigrp", "cisco-sh-ip-route"], "tags": ["eigrp", "routing", "configuration", "summarization", "gotcha"], "equivalents": {"juniper": "(no classful auto-summary concept in Junos)", "paloalto": "(no classful auto-summary concept in PAN-OS)", "linux": "vtysh -c 'router eigrp 100' -c 'no auto-summary' (FRRouting)"}, "sandboxOutput": "R1(config)#router eigrp 100\nR1(config-router)#no auto-summary\nR1(config-router)#\n*Jul 25 14:21:10.774: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.1.2 (GigabitEthernet0/0) is resync: summary configured\n*Jul 25 14:21:10.778: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.3.2 (GigabitEthernet0/2) is resync: summary configured\nR1(config-router)#end\nR1#show ip protocols | include Automatic\n  Automatic Summarization: disabled"}, {"id": "eigrp-ip-summary-address", "vendor": "cisco", "family": "IOS/XE", "mode": "config-if", "cmd": "ip summary-address eigrp <ASN> <network> <mask>", "aliases": ["ip summary-address eigrp 100 172.16.0.0 255.255.0.0", "ip summary-address eigrp 100 10.10.0.0 255.255.0.0 90", "no ip summary-address eigrp 100 172.16.0.0 255.255.0.0"], "purpose": "Advertises one summary prefix out this interface and suppresses the component routes on that interface only. The main tool for shrinking the routing table AND \u2014 more importantly \u2014 bounding the EIGRP query domain.", "tokens": [{"t": "ip summary-address", "d": "Manual outbound summarization on this interface"}, {"t": "eigrp", "d": "Applies to the EIGRP process"}, {"t": "<ASN>", "d": "The EIGRP autonomous system number, e.g. 100"}, {"t": "<network>", "d": "Summary network address, e.g. 172.16.0.0"}, {"t": "<mask>", "d": "Normal SUBNET mask here (255.255.0.0), NOT a wildcard \u2014 opposite convention to the network statement"}], "syntax": "ip summary-address eigrp <as-number> <network-address> <subnet-mask> [<admin-distance>] [leak-map <name>]", "flags": [{"f": "<admin-distance>", "d": "Optional AD for the local Null0 discard route (default 5). Raise it if a summary is competing with another protocol."}, {"f": "leak-map <name>", "d": "Lets specific component routes escape the summary while everything else stays suppressed."}, {"f": "Direction", "d": "Per-interface and outbound only. Configure it on every interface facing the routers that should see the summary."}], "sample": "R1(config)#interface GigabitEthernet0/0\nR1(config-if)#ip summary-address eigrp 100 172.16.0.0 255.255.0.0\nR1(config-if)#\n*Jul 25 14:24:31.905: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.1.2 (GigabitEthernet0/0) is resync: summary configured\nR1(config-if)#end\nR1#show ip route | include Null0\nD        172.16.0.0/16 is a summary, 00:00:22, Null0", "annotations": [{"field": "is a summary, 00:00:22, Null0", "note": "IOS auto-installs a discard route to Null0 with AD 5. This is loop protection: traffic to a covered-but-nonexistent subnet is dropped locally instead of following a default route back out."}, {"field": "Summary metric", "note": "The advertised summary inherits the metric of the BEST component route. When that component disappears the summary metric changes and triggers an update \u2014 but the summary itself stays up as long as one component remains."}, {"field": "Query boundary", "note": "The real payoff. A router that summarizes answers a query for a component prefix itself instead of flooding it onward. Summaries + stubs are the two ways to prevent Stuck-In-Active."}, {"field": "Mask direction", "note": "Subnet mask here, wildcard mask in 'network'. Mixing them up is the second most common EIGRP config error."}], "when": "At distribution/aggregation layers, on WAN hub interfaces, and anywhere you want queries to stop.", "whenNot": "Not on a router that does not hold all component subnets \u2014 you will advertise reachability you do not have and black-hole traffic at your Null0.", "safety": "caution", "related": ["eigrp-no-auto-summary", "eigrp-stub", "eigrp-sh-topology", "eigrp-sh-ip-route", "cisco-sh-ip-route"], "tags": ["eigrp", "routing", "summarization", "query-scoping", "intermediate"], "equivalents": {"juniper": "set protocols ospf area 0.0.0.1 area-range 172.16.0.0/16", "paloalto": "set network virtual-router default protocol ospf area 0.0.0.1 range 172.16.0.0/16", "linux": "vtysh -c 'interface eth0' -c 'ip summary-address eigrp 100 172.16.0.0/16' (FRRouting)"}, "sandboxOutput": "R1(config)#interface GigabitEthernet0/0\nR1(config-if)#ip summary-address eigrp 100 172.16.0.0 255.255.0.0\nR1(config-if)#\n*Jul 25 14:24:31.905: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.1.2 (GigabitEthernet0/0) is resync: summary configured\nR1(config-if)#end\nR1#show ip route | include Null0\nD        172.16.0.0/16 is a summary, 00:00:22, Null0"}, {"id": "eigrp-bandwidth", "vendor": "cisco", "family": "IOS/XE", "mode": "config-if", "cmd": "bandwidth <kbps>", "aliases": ["bandwidth 10000", "bandwidth 1544", "bandwidth 100000", "no bandwidth"], "purpose": "Sets the interface bandwidth value in kbps. It changes nothing about actual throughput \u2014 it is a routing/QoS input. In the classic EIGRP metric only the SLOWEST bandwidth along the path is used.", "tokens": [{"t": "bandwidth", "d": "Administrative bandwidth attribute of the interface"}, {"t": "<kbps>", "d": "Value in kilobits per second, e.g. 1544 for a T1, 10000 for a 10 Mbps CIR"}], "syntax": "bandwidth <1-10000000>   (kbps)", "flags": [{"f": "Metric role", "d": "EIGRP uses 10^7 / (slowest-bandwidth-in-kbps) as the bandwidth term. A Gig interface contributes 10^7/1000000 = 10."}, {"f": "Side effects", "d": "Also drives ip bandwidth-percent eigrp (EIGRP self-limits to 50% of this value), QoS shaping references, OSPF cost and SNMP ifSpeed. Changing it for routing quietly changes those too."}, {"f": "no bandwidth", "d": "Returns to the hardware default for the media type."}], "sample": "R1(config)#interface Serial0/0/0\nR1(config-if)#bandwidth 1544\nR1(config-if)#end\nR1#show interfaces Serial0/0/0 | include BW\n  MTU 1500 bytes, BW 1544 Kbit/sec, DLY 20000 usec,\nR1#show ip eigrp topology 172.16.50.0/24 | include Total delay|Minimum bandwidth\n      Minimum bandwidth is 1544 Kbit\n      Total delay is 20100 microseconds", "annotations": [{"field": "BW 1544 Kbit/sec", "note": "What EIGRP reads. It is a label, not a rate limiter \u2014 the link still forwards at line rate."}, {"field": "Minimum bandwidth is 1544 Kbit", "note": "Confirms this is the bottleneck hop for that prefix. Only the single slowest link in the path counts \u2014 adding a second slow hop does NOT make the metric worse via this term."}, {"field": "Why not use this for tuning", "note": "Because it is overloaded (QoS, bandwidth-percent, ifSpeed). For pure path preference prefer 'delay', which only routing protocols read."}], "when": "Set it to the actual contracted/CIR speed on WAN sub-interfaces and tunnels, where the physical rate lies (a 50 Mbps Metro-E handoff on a Gig port defaults to 1000000).", "whenNot": "Do not tweak it as a traffic-engineering knob on LAN links \u2014 use delay. And do not expect it to police traffic; it is purely advisory.", "safety": "caution", "related": ["eigrp-delay", "eigrp-sh-topology", "eigrp-maximum-paths", "cisco-sh-int", "eigrp-sh-ip-route"], "tags": ["eigrp", "routing", "metric", "interfaces", "intermediate"], "equivalents": {"juniper": "set interfaces ge-0/0/0 unit 0 family inet ... / set protocols ospf area 0 interface ge-0/0/0.0 metric 10", "paloalto": "set network virtual-router default protocol ospf area 0.0.0.0 interface ethernet1/1 metric 10", "linux": "ip link set dev eth0 txqueuelen ... / vtysh 'bandwidth 1544' (FRRouting)"}, "sandboxOutput": "R1(config)#interface Serial0/0/0\nR1(config-if)#bandwidth 1544\nR1(config-if)#end\nR1#show interfaces Serial0/0/0 | include BW\n  MTU 1500 bytes, BW 1544 Kbit/sec, DLY 20000 usec,\nR1#show ip eigrp topology 172.16.50.0/24 | include Total delay|Minimum bandwidth\n      Minimum bandwidth is 1544 Kbit\n      Total delay is 20100 microseconds"}, {"id": "eigrp-delay", "vendor": "cisco", "family": "IOS/XE", "mode": "config-if", "cmd": "delay <tens-of-microseconds>", "aliases": ["delay 100", "delay 500", "delay 1000", "no delay"], "purpose": "Sets the interface delay in units of 10 microseconds. Delay is CUMULATIVE along the whole path, and it is the metric knob you should actually use for EIGRP path preference because nothing else consumes it.", "tokens": [{"t": "delay", "d": "Administrative delay attribute of the interface"}, {"t": "<tens-of-microseconds>", "d": "Units of 10 usec. 'delay 100' = 1000 usec = 1 ms. show interfaces reports it as DLY in usec, so the numbers differ by 10x"}], "syntax": "delay <1-16777215>   (tens of microseconds)", "flags": [{"f": "Unit trap", "d": "You type tens-of-usec; show interfaces prints usec. Type 'delay 100', see 'DLY 1000 usec'. Both are correct."}, {"f": "Defaults", "d": "GigabitEthernet 10 usec (delay 1), FastEthernet 100 usec (delay 10), Serial/T1 20000 usec (delay 2000)."}, {"f": "Metric role", "d": "Sum of every outbound interface delay along the path, divided by 10, added to the bandwidth term. Metric = 256 * (10^7/BWmin + cumulative-delay/10)."}], "sample": "R1(config)#interface GigabitEthernet0/2\nR1(config-if)#delay 100\nR1(config-if)#end\nR1#show interfaces GigabitEthernet0/2 | include DLY\n  MTU 1500 bytes, BW 1000000 Kbit/sec, DLY 1000 usec,\nR1#show ip eigrp topology 192.168.20.0/24\nEIGRP-IPv4 Topology Entry for AS(100)/ID(1.1.1.1) for 192.168.20.0/24\n  State is Passive, Query origin flag is 1, 1 Successor(s), FD is 28160\n  Descriptor Blocks:\n  10.1.3.2 (GigabitEthernet0/2), from 10.1.3.2, Send flag is 0x0\n      Composite metric is (28160/3072), route is Internal\n      Vector metric:\n        Minimum bandwidth is 1000000 Kbit\n        Total delay is 1020 microseconds\n        Reliability is 255/255\n        Load is 1/255\n        Minimum MTU is 1500\n        Hop count is 2\n        Originating router is 4.4.4.4", "annotations": [{"field": "DLY 1000 usec", "note": "Ten times the number you typed. Always sanity-check here after changing delay."}, {"field": "Composite metric is (28160/3072)", "note": "Left number is FD (this router's total cost), right is RD (what the neighbor reported). Raising delay raised FD from 3328 to 28160 and de-preferred this path."}, {"field": "Total delay is 1020 microseconds", "note": "Cumulative: 1000 (your Gi0/2) + 10 + 10 for the two downstream Gig hops. This is the term you control."}, {"field": "Reliability 255/255, Load 1/255", "note": "K2/K4/K5 are 0 by default, so these are informational only. Never enable them \u2014 they are dynamic and would cause constant reconvergence."}, {"field": "Hop count is 2", "note": "Not part of the metric. It is only checked against the 100-hop maximum (default) as a loop backstop."}], "when": "Traffic engineering: make a backup path less preferred, or steer between two equal-cost links. Raise delay on the path you want to avoid.", "whenNot": "Do not use it to model real latency \u2014 it is a static administrative number. And do not change it on one side only; EIGRP metrics are computed per-direction, so asymmetric delay gives asymmetric routing.", "safety": "caution", "related": ["eigrp-bandwidth", "eigrp-sh-topology", "eigrp-sh-topology-all-links", "eigrp-maximum-paths", "cisco-sh-int"], "tags": ["eigrp", "routing", "metric", "traffic-engineering", "intermediate"], "equivalents": {"juniper": "set protocols ospf area 0 interface ge-0/0/2.0 metric 100", "paloalto": "set network virtual-router default protocol ospf area 0.0.0.0 interface ethernet1/3 metric 100", "linux": "vtysh -c 'interface eth2' -c 'delay 100' (FRRouting)"}, "sandboxOutput": "R1(config)#interface GigabitEthernet0/2\nR1(config-if)#delay 100\nR1(config-if)#end\nR1#show interfaces GigabitEthernet0/2 | include DLY\n  MTU 1500 bytes, BW 1000000 Kbit/sec, DLY 1000 usec,\nR1#show ip eigrp topology 192.168.20.0/24\nEIGRP-IPv4 Topology Entry for AS(100)/ID(1.1.1.1) for 192.168.20.0/24\n  State is Passive, Query origin flag is 1, 1 Successor(s), FD is 28160\n  Descriptor Blocks:\n  10.1.3.2 (GigabitEthernet0/2), from 10.1.3.2, Send flag is 0x0\n      Composite metric is (28160/3072), route is Internal\n      Vector metric:\n        Minimum bandwidth is 1000000 Kbit\n        Total delay is 1020 microseconds\n        Reliability is 255/255\n        Load is 1/255\n        Minimum MTU is 1500\n        Hop count is 2\n        Originating router is 4.4.4.4"}, {"id": "eigrp-timers-hello-hold", "vendor": "cisco", "family": "IOS/XE", "mode": "config-if", "cmd": "ip hello-interval eigrp <ASN> <seconds>", "aliases": ["ip hello-interval eigrp 100 2", "ip hold-time eigrp 100 6", "ip hello-interval eigrp 100 5", "ip hold-time eigrp 100 15", "no ip hello-interval eigrp 100"], "purpose": "Tunes how often this interface sends EIGRP hellos, and (with the companion ip hold-time command) how long a neighbor waits before declaring us dead. The pair controls failure-detection speed when there is no link-down signal.", "tokens": [{"t": "ip hello-interval", "d": "Interval between EIGRP hellos on this interface"}, {"t": "eigrp", "d": "EIGRP-specific"}, {"t": "<ASN>", "d": "Autonomous system number the setting applies to, e.g. 100"}, {"t": "<seconds>", "d": "Hello period in seconds (1-65535). Default 5 on most media, 60 on low-speed NBMA"}], "syntax": "ip hello-interval eigrp <as-number> <seconds>\n ip hold-time eigrp <as-number> <seconds>", "flags": [{"f": "ip hold-time eigrp <ASN> <sec>", "d": "The other half. Changing hello does NOT change hold automatically \u2014 you must set both, and it is the classic tuning bug."}, {"f": "Defaults", "d": "5 s hello / 15 s hold on LAN and point-to-point links; 60 s / 180 s on multipoint NBMA links of T1 speed or below."}, {"f": "Rule of thumb", "d": "Keep hold >= 3x hello. Setting hold below the hello interval guarantees a flapping adjacency."}, {"f": "Asymmetry allowed", "d": "Unlike OSPF, EIGRP timers do NOT have to match between neighbors. Each router advertises its own hold time in its hello and the peer honours it."}], "sample": "R1(config)#interface GigabitEthernet0/0\nR1(config-if)#ip hello-interval eigrp 100 2\nR1(config-if)#ip hold-time eigrp 100 6\nR1(config-if)#end\nR1#show ip eigrp interfaces detail GigabitEthernet0/0 | include Hello-interval\n  Hello-interval is 2, Hold-time is 6\nR1#show ip eigrp neighbors\nEIGRP-IPv4 Neighbors for AS(100)\nH   Address                 Interface              Hold Uptime   SRTT   RTO  Q  Seq\n                                                   (sec)         (ms)       Cnt Num\n0   10.1.1.2                Gi0/0                     5 00:31:07    5   100  0  47", "annotations": [{"field": "Hello-interval is 2, Hold-time is 6", "note": "Verify both. If you only changed hello you would see 'Hello-interval is 2, Hold-time is 15' \u2014 works, but wastes the fast detection you wanted."}, {"field": "Hold column = 5", "note": "Counts DOWN from the hold time the NEIGHBOR advertised, resetting on each of its hellos. If it counts below about one third of the configured hold, you are losing hellos."}, {"field": "Direction", "note": "Changing the timers on R1's interface changes what R1's NEIGHBOR uses to time R1 out. It does not change how fast R1 detects the neighbor."}, {"field": "Better alternatives", "note": "On a link with reliable carrier-loss detection, physical link-down converges instantly and beats any timer. For pseudo-wires or L2 clouds prefer BFD over sub-second hello tuning."}], "when": "Links where the far end can fail without dropping carrier: L2 metro-Ethernet handoffs, EoMPLS pseudowires, tunnels through a provider.", "whenNot": "Not on a normal LAN or fiber where link-down already fires in milliseconds \u2014 you gain nothing and add hello load. Avoid aggressive timers on a hub with hundreds of spokes.", "safety": "caution", "related": ["cisco-eigrp-nei", "eigrp-sh-interfaces", "eigrp-clear-neighbors", "eigrp-debug-packets", "eigrp-sh-traffic"], "tags": ["eigrp", "routing", "timers", "convergence", "intermediate"], "equivalents": {"juniper": "set protocols ospf area 0 interface ge-0/0/0.0 hello-interval 2 dead-interval 6", "paloalto": "set network virtual-router default protocol ospf area 0.0.0.0 interface ethernet1/1 hello-interval 2 dead-counts 3", "linux": "vtysh -c 'interface eth0' -c 'ip hello-interval eigrp 2' -c 'ip hold-time eigrp 6' (FRRouting)"}, "sandboxOutput": "R1(config)#interface GigabitEthernet0/0\nR1(config-if)#ip hello-interval eigrp 100 2\nR1(config-if)#ip hold-time eigrp 100 6\nR1(config-if)#end\nR1#show ip eigrp interfaces detail GigabitEthernet0/0 | include Hello-interval\n  Hello-interval is 2, Hold-time is 6\nR1#show ip eigrp neighbors\nEIGRP-IPv4 Neighbors for AS(100)\nH   Address                 Interface              Hold Uptime   SRTT   RTO  Q  Seq\n                                                   (sec)         (ms)       Cnt Num\n0   10.1.1.2                Gi0/0                     5 00:31:07    5   100  0  47"}, {"id": "eigrp-sh-interfaces", "vendor": "cisco", "family": "IOS/XE", "mode": "exec", "cmd": "show ip eigrp interfaces", "aliases": ["sh ip eigrp int", "show ip eigrp interfaces detail", "show ip eigrp interfaces detail GigabitEthernet0/0", "sh ip eigrp interfaces GigabitEthernet0/0"], "purpose": "Shows exactly which interfaces EIGRP is actually running on and how many peers each has. The fastest way to prove a network statement matched \u2014 or that an interface went passive.", "tokens": [{"t": "show ip eigrp", "d": "EIGRP operational data for IPv4"}, {"t": "interfaces", "d": "Per-interface protocol state, peer counts and queues"}], "syntax": "show ip eigrp [<as-number>] interfaces [detail] [<interface-type> <interface-number>]", "flags": [{"f": "detail", "d": "Adds hello/hold timers, split-horizon state, authentication mode, retransmission and mcast counters per interface."}, {"f": "<interface>", "d": "Restricts output to one interface \u2014 use it with detail to avoid a wall of text."}, {"f": "<as-number>", "d": "Needed only when the router runs multiple EIGRP autonomous systems."}], "sample": "R1#show ip eigrp interfaces\nEIGRP-IPv4 Interfaces for AS(100)\n                        Xmit Queue   PeerQ        Mean   Pacing Time   Multicast    Pending\nInterface        Peers  Un/Reliable  Un/Reliable  SRTT   Un/Reliable   Flow Timer   Routes\nGi0/0              1        0/0       0/0           5       0/1           50           0\nFa0/1              1        0/0       0/0          22       0/1          114           0\nGi0/2              1        0/0       0/0           7       0/1           50           0\n\nR1#show ip eigrp interfaces detail GigabitEthernet0/0\nEIGRP-IPv4 Interfaces for AS(100)\n                        Xmit Queue   PeerQ        Mean   Pacing Time   Multicast    Pending\nInterface        Peers  Un/Reliable  Un/Reliable  SRTT   Un/Reliable   Flow Timer   Routes\nGi0/0              1        0/0       0/0           5       0/1           50           0\n  Hello-interval is 5, Hold-time is 15\n  Split-horizon is enabled\n  Next xmit serial <none>\n  Packetized sent/expedited: 24/1\n  Hello's sent/expedited: 1842/3\n  Un/reliable mcasts: 0/12  Un/reliable ucasts: 18/34\n  Mcast exceptions: 0  CR packets: 0  ACKs suppressed: 1\n  Retransmissions sent: 2  Out-of-sequence rcvd: 0\n  Topology-ids on interface - 0\n  Authentication mode is not set", "annotations": [{"field": "Interfaces listed", "note": "Only NON-passive, EIGRP-enabled interfaces appear. If an interface you expect is missing, either no network statement covers it or it is passive. This one fact solves most 'why no neighbor' tickets."}, {"field": "Peers", "note": "Adjacency count on that interface. 0 on a transit link means hellos are going out but nobody is answering: check AS number, subnet mask mismatch, K-values, authentication, or an ACL blocking 224.0.0.10."}, {"field": "Xmit Queue Un/Reliable", "note": "Packets queued to send. Persistently non-zero on the reliable side means retransmissions are backing up \u2014 usually an MTU mismatch or unidirectional link."}, {"field": "Mean SRTT", "note": "Smoothed round-trip time in ms to peers on that interface. Fa0/1 at 22 ms vs Gi0/0 at 5 ms is the WAN link showing itself."}, {"field": "Pacing Time Un/Reliable", "note": "Inter-packet spacing EIGRP imposes to stay within ip bandwidth-percent eigrp (50% of interface bandwidth by default)."}, {"field": "Pending Routes", "note": "Routes still waiting to be sent to peers on this interface. Should settle to 0; a stuck non-zero value points at a wedged peer."}, {"field": "Hello-interval is 5, Hold-time is 15", "note": "From the detail output \u2014 the per-interface timers actually in effect, which is where you confirm a timer change."}, {"field": "Split-horizon is enabled", "note": "Default on. On a hub-and-spoke multipoint interface (DMVPN phase 1, Frame Relay) this is why spokes cannot see each other's routes."}], "when": "Second command in any EIGRP adjacency troubleshoot, right after show ip eigrp neighbors comes back empty.", "whenNot": "It will not tell you WHY a peer is refused (mismatched K-values, authentication). For that use debug eigrp packets or check the log for %DUAL-5-NBRCHANGE reasons.", "safety": "safe", "related": ["cisco-eigrp-nei", "eigrp-network", "eigrp-passive-interface", "eigrp-timers-hello-hold", "eigrp-sh-ip-protocols"], "tags": ["eigrp", "routing", "troubleshooting", "interfaces", "verification"], "equivalents": {"juniper": "show ospf interface detail", "paloalto": "show routing protocol ospf interface", "linux": "vtysh -c 'show ip eigrp interfaces' (FRRouting)"}, "sandboxOutput": "R1#show ip eigrp interfaces\nEIGRP-IPv4 Interfaces for AS(100)\n                        Xmit Queue   PeerQ        Mean   Pacing Time   Multicast    Pending\nInterface        Peers  Un/Reliable  Un/Reliable  SRTT   Un/Reliable   Flow Timer   Routes\nGi0/0              1        0/0       0/0           5       0/1           50           0\nFa0/1              1        0/0       0/0          22       0/1          114           0\nGi0/2              1        0/0       0/0           7       0/1           50           0\n\nR1#show ip eigrp interfaces detail GigabitEthernet0/0\nEIGRP-IPv4 Interfaces for AS(100)\n                        Xmit Queue   PeerQ        Mean   Pacing Time   Multicast    Pending\nInterface        Peers  Un/Reliable  Un/Reliable  SRTT   Un/Reliable   Flow Timer   Routes\nGi0/0              1        0/0       0/0           5       0/1           50           0\n  Hello-interval is 5, Hold-time is 15\n  Split-horizon is enabled\n  Next xmit serial <none>\n  Packetized sent/expedited: 24/1\n  Hello's sent/expedited: 1842/3\n  Un/reliable mcasts: 0/12  Un/reliable ucasts: 18/34\n  Mcast exceptions: 0  CR packets: 0  ACKs suppressed: 1\n  Retransmissions sent: 2  Out-of-sequence rcvd: 0\n  Topology-ids on interface - 0\n  Authentication mode is not set"}, {"id": "eigrp-sh-topology", "vendor": "cisco", "family": "IOS/XE", "mode": "exec", "cmd": "show ip eigrp topology", "aliases": ["sh ip eigrp topo", "sh ip eigrp topology", "show ip eigrp topology 172.16.50.0/24", "show ip eigrp topology active"], "purpose": "Shows the DUAL topology table: every destination, its feasible distance, its successor(s) and any feasible successors. This is where EIGRP's fast reconvergence story is either true or not \u2014 the routing table only shows you the winner.", "tokens": [{"t": "show ip eigrp", "d": "EIGRP operational data for IPv4"}, {"t": "topology", "d": "DUAL topology table \u2014 successors and feasible successors, not the RIB"}], "syntax": "show ip eigrp [<as-number>] topology [<prefix>/<len> | active | all-links | zero-successors | summary]", "flags": [{"f": "<prefix>/<len>", "d": "Full detail for one destination: composite metric, vector metric, originating router, every descriptor block."}, {"f": "active", "d": "Only routes currently in Active state. On a healthy network this is empty \u2014 if it is not, you are watching a convergence event or an SIA in progress."}, {"f": "all-links", "d": "Also shows paths that FAILED the feasibility condition. See eigrp-sh-topology-all-links."}, {"f": "zero-successors", "d": "Entries with no usable successor \u2014 often the residue of a failed summarization or filter."}, {"f": "summary", "d": "Counts of routes/peers and topology memory usage."}], "sample": "EIGRP-IPv4 Topology Table for AS(100)/ID(1.1.1.1)\nCodes: P - Passive, A - Active, U - Update, Q - Query, R - Reply,\n       r - reply Status, s - sia Status\n\nP 10.1.1.0/24, 1 successors, FD is 2816\n        via Connected, GigabitEthernet0/0\nP 10.1.2.0/24, 1 successors, FD is 28160\n        via Connected, FastEthernet0/1\nP 10.1.3.0/24, 1 successors, FD is 2816\n        via Connected, GigabitEthernet0/2\nP 172.16.50.0/24, 1 successors, FD is 3072\n        via 10.1.1.2 (3072/2816), GigabitEthernet0/0\n        via 10.1.2.2 (28416/2816), FastEthernet0/1\nP 172.16.60.0/24, 1 successors, FD is 3328\n        via 10.1.1.2 (3328/3072), GigabitEthernet0/0\nP 192.168.20.0/24, 1 successors, FD is 3328\n        via 10.1.3.2 (3328/3072), GigabitEthernet0/2", "annotations": [{"field": "P (Passive)", "note": "The route is stable and DUAL is not computing. Passive is the GOOD state \u2014 this trips up everyone once. Nearly every entry should be P."}, {"field": "A (Active)", "note": "DUAL has lost its successor, found no feasible successor, and has sent QUERIES to all neighbors. It cannot use the route until every neighbor replies. Stuck here for 3 minutes = Stuck-In-Active and the adjacency gets reset."}, {"field": "r / s codes", "note": "'r' marks a neighbor whose reply is still outstanding on an active route; 's' marks one already declared SIA. When troubleshooting a slow convergence, these name the culprit."}, {"field": "FD is 3072", "note": "Feasible Distance: this router's best total metric to the destination. It is also the LOW-WATER MARK used to test alternate paths."}, {"field": "via 10.1.1.2 (3072/2816)", "note": "The pair is (FD via this neighbor / RD reported by this neighbor). 3072 is what it costs R1 through R2; 2816 is what R2 says it costs R2. The first listed path with metric == FD is the SUCCESSOR and is what gets installed in the RIB."}, {"field": "via 10.1.2.2 (28416/2816) \u2014 the feasible successor", "note": "FEASIBILITY CONDITION: an alternate path qualifies only if its RD is STRICTLY LESS THAN the current FD. Here RD 2816 < FD 3072, so R3 is provably not routing through us and this is a loop-free backup. Its own metric (28416) can be far worse \u2014 that is irrelevant to feasibility."}, {"field": "172.16.60.0/24 has no FS", "note": "The only other path had RD 3072, which is not < FD 3072. Equal is not good enough. If Gi0/0 fails, this prefix goes ACTIVE and R1 must query the network instead of switching over in sub-second time."}, {"field": "via Connected", "note": "Locally attached subnets appear with the interface's own metric (Gig = 2816, Fast = 28160) and are advertised from here."}], "when": "Any time you need to know whether a prefix has a loop-free backup ready, or to see EIGRP's view before the RIB filters it down to one path.", "whenNot": "Not for what the router is actually forwarding on \u2014 that is show ip route / show ip cef. A path can sit here as a feasible successor and never appear in the RIB.", "safety": "safe", "related": ["eigrp-sh-topology-all-links", "eigrp-sh-ip-route", "eigrp-delay", "eigrp-bandwidth", "eigrp-maximum-paths", "cisco-sh-ip-route"], "tags": ["eigrp", "routing", "dual", "feasible-successor", "troubleshooting", "intermediate"], "equivalents": {"juniper": "show ospf database / show route protocol ospf", "paloalto": "show routing protocol ospf dumplsdb", "linux": "vtysh -c 'show ip eigrp topology' (FRRouting)"}, "sandboxOutput": "EIGRP-IPv4 Topology Table for AS(100)/ID(1.1.1.1)\nCodes: P - Passive, A - Active, U - Update, Q - Query, R - Reply,\n       r - reply Status, s - sia Status\n\nP 10.1.1.0/24, 1 successors, FD is 2816\n        via Connected, GigabitEthernet0/0\nP 10.1.2.0/24, 1 successors, FD is 28160\n        via Connected, FastEthernet0/1\nP 10.1.3.0/24, 1 successors, FD is 2816\n        via Connected, GigabitEthernet0/2\nP 172.16.50.0/24, 1 successors, FD is 3072\n        via 10.1.1.2 (3072/2816), GigabitEthernet0/0\n        via 10.1.2.2 (28416/2816), FastEthernet0/1\nP 172.16.60.0/24, 1 successors, FD is 3328\n        via 10.1.1.2 (3328/3072), GigabitEthernet0/0\nP 192.168.20.0/24, 1 successors, FD is 3328\n        via 10.1.3.2 (3328/3072), GigabitEthernet0/2"}, {"id": "eigrp-sh-topology-all-links", "vendor": "cisco", "family": "IOS/XE", "mode": "exec", "cmd": "show ip eigrp topology all-links", "aliases": ["sh ip eigrp topo all-links", "sh ip eigrp topology all-links", "show ip eigrp topology all-links"], "purpose": "Same table, but also lists the paths that FAILED the feasibility condition and are therefore hidden from the normal view. This is how you answer 'why does this prefix have no backup?' with evidence instead of a guess.", "tokens": [{"t": "show ip eigrp", "d": "EIGRP operational data for IPv4"}, {"t": "topology", "d": "DUAL topology table"}, {"t": "all-links", "d": "Include non-feasible paths \u2014 every path EIGRP has heard about, feasible or not"}], "syntax": "show ip eigrp [<as-number>] topology all-links", "flags": [{"f": "all-links", "d": "The only difference from plain topology: extra 'via' lines whose RD failed the < FD test."}, {"f": "serno", "d": "Internal serial number of the topology entry, shown in this view. Bumps whenever the entry is updated \u2014 a rapidly climbing serno on one prefix means it is flapping."}], "sample": "EIGRP-IPv4 Topology Table for AS(100)/ID(1.1.1.1)\nCodes: P - Passive, A - Active, U - Update, Q - Query, R - Reply,\n       r - reply Status, s - sia Status\n\nP 10.1.1.0/24, 1 successors, FD is 2816, serno 3\n        via Connected, GigabitEthernet0/0\nP 172.16.50.0/24, 1 successors, FD is 3072, serno 12\n        via 10.1.1.2 (3072/2816), GigabitEthernet0/0\n        via 10.1.2.2 (28416/2816), FastEthernet0/1\n        via 10.1.3.2 (3328/3072), GigabitEthernet0/2\nP 172.16.60.0/24, 1 successors, FD is 3328, serno 14\n        via 10.1.1.2 (3328/3072), GigabitEthernet0/0\n        via 10.1.3.2 (3584/3328), GigabitEthernet0/2\n        via 10.1.2.2 (28672/3072), FastEthernet0/1", "annotations": [{"field": "172.16.50.0/24 \u2014 three via lines", "note": "Plain 'show ip eigrp topology' shows only the first two. all-links reveals the third."}, {"field": "via 10.1.1.2 (3072/2816)", "note": "SUCCESSOR. Metric equals FD, so this is the installed path."}, {"field": "via 10.1.2.2 (28416/2816)", "note": "FEASIBLE SUCCESSOR. RD 2816 < FD 3072 -> passes. On successor failure EIGRP promotes this instantly, no query, no Active state, sub-second convergence."}, {"field": "via 10.1.3.2 (3328/3072)", "note": "NOT FEASIBLE, and only visible here. RD 3072 is not strictly less than FD 3072. Note the total metric (3328) is BETTER than the feasible successor's (28416) \u2014 feasibility is about loop-freedom, not about being fast. R4 might be reaching this prefix through R1, so trusting it could form a loop."}, {"field": "172.16.60.0/24 via 10.1.3.2 (3584/3328)", "note": "RD 3328 == FD 3328, fails again. Classic hub-and-spoke symptom: everything downstream reports the same RD you already have."}, {"field": "How to create a feasible successor", "note": "Lower the FD on the primary path (reduce delay) or raise the alternate neighbor's cost so its RD drops below your FD. Summarizing at the alternate router also changes what RD it reports."}, {"field": "Operational meaning", "note": "Prefixes with zero feasible successors are the ones that will go ACTIVE and query the domain fic", "flags": [{"f": "<as-number>", "d": "Select one instance when several EIGRP autonomous systems run on the box."}, {"f": "Reset", "d": "There is no dedicated clear for these; they reset when the EIGRP process restarts. Take two readings a minute apart and diff them \u2014 rates matter, absolutes do not."}], "sample": "EIGRP-IPv4 Traffic Statistics for AS(100)\n  Hellos sent/received: 1842/1839\n  Updates sent/received: 24/21\n  Queries sent/received: 3/2\n  Replies sent/received: 2/3\n  Acks sent/received: 26/24\n  SIA-Queries sent/received: 0/0\n  SIA-Replies sent/received: 0/0\n  Hello Process ID: 200\n  PDM Process ID: 199\n  Socket Queue: 0/2000/2/0 (current/max/highest/drops)\n  Input Queue: 0/2000/3/0 (current/max/highest/drops)", "annotations": [{"field": "Hellos sent/received", "note": "Should climb steadily at 1 per hello-interval per neighbor. A sent count far above received on a point-to-point link means a unidirectional path or an ACL eating 224.0.0.10."}, {"field": "Updates sent/received", "note": "Topology changes. EIGRP is non-periodic \u2014 a stable network sends almost no updates. A rising update count on a quiet network means something is flapping."}, {"field": "Queries sent/received", "note": "The number that matters for design. High or growing queries mean DUAL keeps going Active and your query domain is too wide. Fix with eigrp stub and ip summary-address, not with timers."}, {"field": "SIA-Queries / SIA-Replies", "note": "Should be 0/0. Anything else means DUAL hit the 90-second half-life on an Active route and had to ask 'are you still there?'. Non-zero here is a genuine design problem."}, {"field": "Replies sent/received", "note": "Every query must be answered. If replies received lags queries sent, find the neighbor that is not answering \u2014 show ip eigrp topology active names it with the 'r' flag."}, {"field": "Socket Queue / Input Queue drops", "note": "Format is current/max/highest/drops. A non-zero drop counter means the router discarded EIGRP packets under CPU or buffer pressure \u2014 expect unexplained adjacency flaps."}], "when": "Baseline a healthy router, then compare during a flap investigation. Also the first check when adjacencies bounce with no obvious link errors.", "whenNot": "It aggregates across all neighbors, so it will not tell you WHICH peer is misbehaving \u2014 correlate with show ip eigrp neighbors and the log.", "safety": "safe", "related": ["cisco-eigrp-nei", "eigrp-sh-interfaces", "eigrp-debug-packets", "eigrp-stub", "eigrp-sh-topology"], "tags": ["eigrp", "routing", "troubleshooting", "counters", "stability"], "equivalents": {"juniper": "show ospf statistics", "paloalto": "show routing protocol ospf stats", "linux": "vtysh -c 'show ip eigrp traffic' (FRRouting)"}, "sandboxOutput": "EIGRP-IPv4 Traffic Statistics for AS(100)\n  Hellos sent/received: 1842/1839\n  Updates sent/received: 24/21\n  Queries sent/received: 3/2\n  Replies sent/received: 2/3\n  Acks sent/received: 26/24\n  SIA-Queries sent/received: 0/0\n  SIA-Replies sent/received: 0/0\n  Hello Process ID: 200\n  PDM Process ID: 199\n  Socket Queue: 0/2000/2/0 (current/max/highest/drops)\n  Input Queue: 0/2000/3/0 (current/max/highest/drops)"}, {"id": "eigrp-sh-ip-protocols", "vendor": "cisco", "family": "IOS/XE", "mode": "exec", "cmd": "show ip protocols", "aliases": ["sh ip prot", "sh ip protocols", "show ip protocols | section eigrp"], "purpose": "The single best EIGRP sanity check: router ID, K-values, AS, networks, passive interfaces, summarization, variance, distances and every neighbor feeding you routes \u2014 all the config-vs-reality mismatches on one screen.", "tokens": [{"t": "show ip", "d": "IPv4 operational data"}, {"t": "protocols", "d": "Every routing protocol instance configured, with its effective parameters"}], "syntax": "show ip protocols [summary]", "flags": [{"f": "summary", "d": "One line per running protocol instance \u2014 useful on a box running EIGRP, OSPF and BGP together."}, {"f": "| section eigrp", "d": "Trims the output to the EIGRP block when several protocols are configured."}], "sample": "Routing Protocol is \"eigrp 100\"\n  Outgoing update filter list for all interfaces is not set\n  Incoming update filter list for all interfaces is not set\n  Default networks flagged in outgoing updates\n  Default networks accepted from incoming updates\n  EIGRP-IPv4 Protocol for AS(100)\n    Metric weight K1=1, K2=0, K3=1, K4=0, K5=0\n    NSF-aware route hold timer is 240\n    Router-ID: 1.1.1.1\n    Topology : 0 (base)\n      Active Timer: 3 min\n      Distance: internal 90 external 170\n      Maximum path: 4\n      Maximum hopcount 100\n      Maximum metric variance 1\n\n  Automatic Summarization: disabled\n  Address Summarization:\n    172.16.0.0/16 for Gi0/0\n  Maximum path: 4\n  Routing for Networks:\n    10.1.1.0/24\n    10.1.2.0/24\n    10.1.3.0/24\n  Passive Interface(s):\n    GigabitEthernet0/3\n    Loopback0\n  Routing Information Sources:\n    Gateway         Distance      Last Update\n    10.1.3.2              90      00:09:02\n    10.1.2.2              90      00:11:03\n    10.1.1.2              90      00:12:44\n  Distance: internal 90 external 170", "annotations": [{"field": "Metric weight K1=1, K2=0, K3=1, K4=0, K5=0", "note": "THE default 5-tuple. Only K1 (bandwidth) and K3 (delay) are non-zero, so by default the metric is 256*(10^7/slowest-bandwidth + cumulative-delay/10). Load and reliability are carried but ignored. K-values MUST match between neighbors or the adjacency is refused \u2014 check this line on both routers first when hellos are seen but no peering happens."}, {"field": "Router-ID: 1.1.1.1", "note": "The RID actually in use, derived or configured. Compare across routers to catch duplicates that silently drop external routes."}, {"field": "Automatic Summarization: disabled", "note": "Authoritative answer to the auto-summary question, unlike show run where the default may be invisible."}, {"field": "Address Summarization: 172.16.0.0/16 for Gi0/0", "note": "Every manual ip summary-address in effect and where. If a prefix is missing downstream, look here before blaming the neighbor."}, {"field": "Routing for Networks", "note": "How IOS actually parsed your network statements. If you fat-fingered a wildcard, the range shown here will not match what you intended \u2014 this is where the wildcard-mask mistake surfaces."}, {"field": "Passive Interface(s)", "note": "Cross-check against the interfaces missing from show ip eigrp interfaces. An unexpected entry here explains a dead adjacency instantly."}, {"field": "Maximum path: 4 / Maximum metric variance 1", "note": "Variance 1 means equal-cost only. Raise variance to let feasible successors within N x FD be installed for unequal-cost load sharing \u2014 only feasible successors qualify, never a non-feasible path."}, {"field": "Distance: internal 90 external 170", "note": "AD for internal EIGRP vs redistributed EX routes. 170 loses to OSPF's 110, which is why redistributed EIGRP routes sometimes lose a comparison people expect them to win."}], "when": "First command when EIGRP behaves oddly, and the one screenshot to take before touching anything.", "whenNot": "It shows configured/effective parameters, not live adjacency health or forwarding state \u2014 pair it with show ip eigrp neighbors and show ip route.", "safety": "safe", "related": ["eigrp-sh-interfaces", "eigrp-sh-topology", "eigrp-router-id", "eigrp-no-auto-summary", "eigrp-maximum-paths", "cisco-show-run"], "tags": ["eigrp", "routing", "verification", "troubleshooting", "k-values"], "equivalents": {"juniper": "show ospf overview", "paloalto": "show routing protocol ospf summary", "linux": "vtysh -c 'show ip protocol' (FRRouting)"}, "sandboxOutput": "Routing Protocol is \"eigrp 100\"\n  Outgoing update filter list for all interfaces is not set\n  Incoming update filter list for all interfaces is not set\n  Default networks flagged in outgoing updates\n  Default networks accepted from incoming updates\n  EIGRP-IPv4 Protocol for AS(100)\n    Metric weight K1=1, K2=0, K3=1, K4=0, K5=0\n    NSF-aware route hold timer is 240\n    Router-ID: 1.1.1.1\n    Topology : 0 (base)\n      Active Timer: 3 min\n      Distance: internal 90 external 170\n      Maximum path: 4\n      Maximum hopcount 100\n      Maximum metric variance 1\n\n  Automatic Summarization: disabled\n  Address Summarization:\n    172.16.0.0/16 for Gi0/0\n  Maximum path: 4\n  Routing for Networks:\n    10.1.1.0/24\n    10.1.2.0/24\n    10.1.3.0/24\n  Passive Interface(s):\n    GigabitEthernet0/3\n    Loopback0\n  Routing Information Sources:\n    Gateway         Distance      Last Update\n    10.1.3.2              90      00:09:02\n    10.1.2.2              90      00:11:03\n    10.1.1.2              90      00:12:44\n  Distance: internal 90 external 170"}, {"id": "eigrp-sh-ip-route", "vendor": "cisco", "family": "IOS/XE", "mode": "exec", "cmd": "show ip route eigrp", "aliases": ["sh ip ro eigrp", "sh ip route eigrp", "show ip route eigrp 100"], "purpose": "Filters the RIB down to what EIGRP actually won and installed. This is the forwarding truth \u2014 the topology table shows candidates, this shows the result.", "tokens": [{"t": "show ip route", "d": "IPv4 routing table (RIB)"}, {"t": "eigrp", "d": "Only routes sourced by EIGRP (codes D and D EX)"}], "syntax": "show ip route eigrp [<as-number>]", "flags": [{"f": "<as-number>", "d": "Restrict to one EIGRP instance on a multi-AS router."}, {"f": "show ip route <prefix>", "d": "Per-prefix detail: which protocol, metric, all installed next hops, and the exact longest-match used."}], "sample": "Codes: L - local, C - connected, S - static, R - RIP, M - mobile, B - BGP\n       D - EIGRP, EX - EIGRP external, O - OSPF, IA - OSPF inter area\n       N1 - OSPF NSSA external type 1, N2 - OSPF NSSA external type 2\n       E1 - OSPF external type 1, E2 - OSPF external type 2\n       i - IS-IS, su - IS-IS summary, L1 - IS-IS level-1, L2 - IS-IS level-2\n       ia - IS-IS inter area, * - candidate default, U - per-user static route\n       o - ODR, P - periodic downloaded static route, H - NHRP, l - LISP\n       + - replicated route, % - next hop override\n\nGateway of last resort is not set\n\n      172.16.0.0/16 is variably subnetted, 3 subnets, 2 masks\nD        172.16.0.0/16 is a summary, 00:14:02, Null0\nD        172.16.50.0/24 [90/3072] via 10.1.1.2, 00:12:44, GigabitEthernet0/0\nD        172.16.60.0/24 [90/3328] via 10.1.1.2, 00:12:44, GigabitEthernet0/0\nD     192.168.20.0/24 [90/3328] via 10.1.3.2, 00:09:02, GigabitEthernet0/2\nD EX  192.168.99.0/24 [170/30720] via 10.1.2.2, 00:03:21, FastEthernet0/1", "annotations": [{"field": "D", "note": "Internal EIGRP route, administrative distance 90 \u2014 beats OSPF (110), RIP (120) and IS-IS (115). D was chosen because E was already taken by EGP."}, {"field": "D EX", "note": "External \u2014 redistributed into EIGRP from another source. AD 170, which LOSES to OSPF and even to a floating static at 171 or less. Mixed-protocol cores bite people here."}, {"field": "[90/3072]", "note": "[administrative distance / composite metric]. The metric is the same FD you saw in the topology table \u2014 they always agree for the installed path."}, {"field": "is a summary, Null0", "note": "The local discard route auto-created by ip summary-address (AD 5). Packets to a covered prefix you do not actually have are dropped here rather than looping back out a default."}, {"field": "172.16.0.0/16 is variably subnetted, 3 subnets, 2 masks", "note": "Header line for the major network, listing how many child routes and how many distinct mask lengths exist under it. Seeing 1 subnet 1 mask where you expect many is the fingerprint of accidental summarization."}, {"field": "00:12:44", "note": "Age of the route. A route whose age keeps resetting to 00:00:0x is flapping \u2014 correlate with show ip eigrp traffic update counters."}, {"field": "Missing routes", "note": "If a prefix is in
