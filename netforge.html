rp neighbors", "aliases": ["clear ip eigrp neighbors", "clear ip eigrp neighbors 10.1.1.2", "clear ip eigrp neighbors GigabitEthernet0/0", "clear ip eigrp neighbors soft"], "purpose": "Tears down EIGRP adjacencies and forces them to rebuild. Used to make a changed router-id, metric or K-value take effect on already-learned routes \u2014 at the price of a reconvergence event.", "tokens": [{"t": "clear", "d": "Reset operational state (this is not a config command and is not undoable)"}, {"t": "ip eigrp", "d": "EIGRP for IPv4"}, {"t": "neighbors", "d": "Adjacencies. With no argument, ALL of them"}], "syntax": "clear ip eigrp [<as-number>] neighbors [<ip-address> | <interface-type> <interface-number>] [soft]", "flags": [{"f": "no argument", "d": "DANGER \u2014 resets every EIGRP neighbor on the router at once. On a core router this blackholes traffic for the length of the rebuild."}, {"f": "<ip-address>", "d": "Reset one peer only. Always prefer this."}, {"f": "<interface>", "d": "Reset every peer reachable over one interface."}, {"f": "soft", "d": "Re-sends the full topology to the peer WITHOUT tearing the adjacency down. Non-disruptive \u2014 try this first when you only need routes re-advertised."}], "sample": "R1#clear ip eigrp neighbors\nR1#\n*Jul 25 14:22:07.331: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.1.2 (GigabitEthernet0/0) is down: manually cleared\n*Jul 25 14:22:07.335: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.2.2 (FastEthernet0/1) is down: manually cleared\n*Jul 25 14:22:07.339: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.3.2 (GigabitEthernet0/2) is down: manually cleared\n*Jul 25 14:22:12.891: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.1.2 (GigabitEthernet0/0) is up: new adjacency\n*Jul 25 14:22:13.104: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.3.2 (GigabitEthernet0/2) is up: new adjacency\n*Jul 25 14:22:14.552: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.2.2 (FastEthernet0/1) is up: new adjacency", "annotations": [{"field": "is down: manually cleared", "note": "The reason string confirms a human did this, not a link failure. Useful later when someone asks what happened at 14:22."}, {"field": "Gap between down and up (~5 s)", "note": "The routes learned from those peers are gone for that whole window. Traffic depending on them is dropped or reroutes. Multiply that by a busy core and you have a real outage."}, {"field": "Rebuild order", "note": "Fast links come back first. If one neighbor stays down after the others return, that is your actual problem \u2014 look at it with show ip eigrp interfaces and the log."}, {"field": "Safer alternative", "note": "'clear ip eigrp neighbors soft' or clearing a single neighbor solves most cases with no downtime. Reserve the bare form for a maintenance window."}], "when": "After changing the EIGRP router-id to resolve duplicates, after fixing K-values, or when a peer is wedged with a stuck queue and the far end is unreachable.", "whenNot": "Never as a reflex 'let's bounce it and see'. It will not fix a config mismatch \u2014 it just hides the evidence and costs you an outage. Diagnose with show ip protocols and show ip eigrp interfaces first.", "safety": "danger", "related": ["cisco-eigrp-nei", "eigrp-router-id", "eigrp-sh-interfaces", "eigrp-debug-packets", "eigrp-sh-traffic"], "tags": ["eigrp", "routing", "disruptive", "troubleshooting", "maintenance"], "equivalents": {"juniper": "clear ospf neighbor <address>", "paloalto": "clear routing protocol ospf neighbor <address>", "linux": "vtysh -c 'clear ip eigrp neighbors' (FRRouting)"}, "sandboxOutput": "R1#clear ip eigrp neighbors\nR1#\n*Jul 25 14:22:07.331: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.1.2 (GigabitEthernet0/0) is down: manually cleared\n*Jul 25 14:22:07.335: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.2.2 (FastEthernet0/1) is down: manually cleared\n*Jul 25 14:22:07.339: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.3.2 (GigabitEthernet0/2) is down: manually cleared\n*Jul 25 14:22:12.891: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.1.2 (GigabitEthernet0/0) is up: new adjacency\n*Jul 25 14:22:13.104: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.3.2 (GigabitEthernet0/2) is up: new adjacency\n*Jul 25 14:22:14.552: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.2.2 (FastEthernet0/1) is up: new adjacency"}, {"id": "eigrp-debug-packets", "vendor": "cisco", "family": "IOS/XE", "mode": "exec", "cmd": "debug eigrp packets", "aliases": ["debug eigrp packets", "debug eigrp packets hello", "debug ip eigrp 100", "debug ip eigrp neighbor 100 10.1.1.2", "undebug all", "u all"], "purpose": "Prints EIGRP protocol packets as they are sent and received. The last-resort tool for adjacencies that will not form when the config looks correct \u2014 mismatched K-values, authentication or subnet masks all show up here.", "tokens": [{"t": "debug", "d": "Real-time process-level tracing. CPU-expensive and unfiltered by default"}, {"t": "eigrp", "d": "EIGRP protocol engine"}, {"t": "packets", "d": "Packet-level: hellos, updates, queries, replies, acks, SIA"}], "syntax": "debug eigrp packets [hello | update | query | reply | request | ack | retry | stub | siaquery | siareply | verbose]\n debug ip eigrp [<as-number>] [neighbor <as-number> <ip-address> | summary]", "flags": [{"f": "hello / update / query / reply", "d": "ALWAYS narrow it. Bare 'debug eigrp packets' turns on every type at once and on a busy router that alone can spike CPU."}, {"f": "debug ip eigrp neighbor <ASN> <ip>", "d": "Route-processing debug scoped to one peer \u2014 far safer than the unscoped form."}, {"f": "debug condition interface <intf>", "d": "Conditional debugging: set the condition BEFORE enabling the debug and output is limited to that interface. The single most important habit for debugging safely in production."}, {"f": "terminal monitor", "d": "Required on a VTY/SSH session or you will see nothing \u2014 debug output goes to the console by default. Better still: 'logging buffered 128000 debugging' and read it afterwards with show logging."}, {"f": "undebug all (u all)", "d": "Kill switch. Type it before you start so it is in your scrollback. 'show debugging' lists what is currently on."}], "sample": "R1#terminal monitor\nR1#debug eigrp packets hello\nEIGRP Packets debugging is on\n    (HELLO)\nR1#\n*Jul 25 14:31:02.117: EIGRP: Sending HELLO on Gi0/0 - paklen 20\n*Jul 25 14:31:02.117:   AS 100, Flags 0x0:(NULL), Seq 0/0 interfaceQ 0/0 iidbQ un/rely 0/0\n*Jul 25 14:31:03.442: EIGRP: Received HELLO on Gi0/0 - paklen 20 nbr 10.1.1.2\n*Jul 25 14:31:03.442:   AS 100, Flags 0x0:(NULL), Seq 0/0 interfaceQ 0/0 iidbQ un/rely 0/0 peerQ un/rely 0/0\n*Jul 25 14:31:04.918: EIGRP: Sending HELLO on Fa0/1 - paklen 20\n*Jul 25 14:31:04.918:   AS 100, Flags 0x0:(NULL), Seq 0/0 interfaceQ 0/0 iidbQ un/rely 0/0\nR1#undebug all\nAll possible debugging has been turned off", "annotations": [{"field": "terminal monitor", "note": "Without it, an SSH session shows nothing and engineers conclude the debug 'isn't working'. Remember to 'terminal no monitor' when done."}, {"field": "Sending HELLO on Gi0/0 - paklen 20", "note": "Outbound hello to 224.0.0.10. If you see sends but never receives on that interface, the far end is not sending, or multicast/ACL/PIM is eating them."}, {"field": "Received HELLO ... nbr 10.1.1.2", "note": "Bidirectional hellos with no adjacency forming points at K-value mismatch, AS mismatch, authentication failure, or the two ends being in different subnets."}, {"field": "AS 100", "note": "The AS in the received packet. If it differs from yours the packet is dropped silently \u2014 this debug is often the only way to see it."}, {"field": "Seq 0/0, interfaceQ 0/0, iidbQ un/rely 0/0", "note": "Sequence numbers and queue depths for EIGRP's Reliable Transport Protocol. Growing reliable queues with retransmits is the signature of an MTU mismatch: hellos (small) get through, updates (large) do not, and the adjacency flaps at exactly the point of route exchange."}, {"field": "undebug all", "note": "Always finish here. A forgotten debug on a production router is how you turn a troubleshooting session into an incident."}], "when": "Only after show ip protocols, show ip eigrp interfaces and the syslog have failed to explain the problem \u2014 and preferably scoped with debug condition, in a window, on a low-traffic device.", "whenNot": "Never bare 'debug eigrp packets' on a busy production router, never without terminal monitor on VTY, and never on a device already at high CPU. If the box is congested the debug output itself can drop the adjacencies you are trying to fix.", "safety": "danger", "related": ["eigrp-sh-traffic", "eigrp-sh-interfaces", "cisco-eigrp-nei", "eigrp-clear-neighbors", "eigrp-timers-hello-hold"], "tags": ["eigrp", "routing", "debug", "disruptive", "troubleshooting", "advanced"], "equivalents": {"juniper": "monitor traffic interface ge-0/0/0 matching 'proto ospf' / set protocols ospf traceoptions", "paloalto": "debug routing pkt ospf all on receive", "linux": "tcpdump -ni eth0 proto 88"}, "sandboxOutput": "R1#terminal monitor\nR1#debug eigrp packets hello\nEIGRP Packets debugging is on\n    (HELLO)\nR1#\n*Jul 25 14:31:02.117: EIGRP: Sending HELLO on Gi0/0 - paklen 20\n*Jul 25 14:31:02.117:   AS 100, Flags 0x0:(NULL), Seq 0/0 interfaceQ 0/0 iidbQ un/rely 0/0\n*Jul 25 14:31:03.442: EIGRP: Received HELLO on Gi0/0 - paklen 20 nbr 10.1.1.2\n*Jul 25 14:31:03.442:   AS 100, Flags 0x0:(NULL), Seq 0/0 interfaceQ 0/0 iidbQ un/rely 0/0 peerQ un/rely 0/0\n*Jul 25 14:31:04.918: EIGRP: Sending HELLO on Fa0/1 - paklen 20\n*Jul 25 14:31:04.918:   AS 100, Flags 0x0:(NULL), Seq 0/0 interfaceQ 0/0 iidbQ un/rely 0/0\nR1#undebug all\nAll possible debugging has been turned off"}, {"id": "eigrp-stub", "vendor": "cisco", "family": "IOS/XE", "mode": "config", "cmd": "eigrp stub connected summary", "aliases": ["eigrp stub", "eigrp stub connected summary", "eigrp stub connected", "eigrp stub receive-only", "no eigrp stub"], "purpose": "Marks this router as a stub so neighbors never send it QUERIES and never use it as transit. The primary defence against Stuck-In-Active in hub-and-spoke designs, and mandatory on every spoke in a large WAN.", "tokens": [{"t": "eigrp", "d": "EIGRP router-mode sub-command"}, {"t": "stub", "d": "Advertise the stub flag in hellos; the hub records it and excludes this router from the query domain"}, {"t": "connected", "d": "Still advertise directly connected subnets covered by a network statement"}, {"t": "summary", "d": "Still advertise manual and auto summaries originated here"}], "syntax": "eigrp stub [connected] [summary] [static] [redistributed] [receive-only] [leak-map <name>]", "flags": [{"f": "(no keywords)", "d": "Plain 'eigrp stub' implies 'connected summary' \u2014 the sane default and what most spokes want."}, {"f": "connected", "d": "Advertise connected networks. Without it a spoke advertises nothing and its LANs vanish from the hub."}, {"f": "summary", "d": "Advertise summary routes originated on this router."}, {"f": "static", "d": "Advertise redistributed static routes. Requires 'redistribute static' as well \u2014 the keyword only permits it, it does not perform redistribution."}, {"f": "redistributed", "d": "Advertise routes redistributed from other protocols."}, {"f": "receive-only", "d": "Advertise NOTHING. Cannot be combined with any other keyword. Only for a router with no networks of its own to contribute \u2014 rare."}, {"f": "leak-map <name>", "d": "Allow specific prefixes through that the stub type would otherwise suppress."}], "sample": "Spoke1(config)#router eigrp 100\nSpoke1(config-router)#eigrp stub connected summary\nSpoke1(config-router)#\n*Jul 25 14:40:11.223: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.1.1 (GigabitEthernet0/0) is resync: peer info changed\nSpoke1(config-router)#end\nSpoke1#show ip protocols | include stub|Stub\n  EIGRP stub, connected, summary\n\nHub#show ip eigrp neighbors detail\nEIGRP-IPv4 Neighbors for AS(100)\nH   Address                 Interface              Hold Uptime   SRTT   RTO  Q  Seq\n                                                   (sec)         (ms)       Cnt Num\n0   10.1.1.2                Gi0/0                     12 00:02:41   6   100  0  9\n   Version 23.0/2.0, Retrans: 0, Retries: 0, Prefixes: 3\n   Topology-ids from peer - 0\n   Stub Peer Advertising ( CONNECTED SUMMARY ) Routes\n   Suppressing queries", "annotations": [{"field": "is resync: peer info changed", "note": "Changing the stub flag triggers a graceful resync, not an adjacency reset. Safe to apply on a live spoke."}, {"field": "EIGRP stub, connected, summary", "note": "Local confirmation of what this router advertises about itself."}, {"field": "Stub Peer Advertising ( CONNECTED SUMMARY ) Routes", "note": "Seen from the HUB via show ip eigrp neighbors detail. This is the real verification \u2014 the hub has recorded the flag and will act on it."}, {"field": "Suppressing queries", "note": "The whole point. The hub will never query this spoke, so a failure anywhere in the core cannot go Active waiting on a slow WAN link. Scaling limit for a hub jumps from tens of spokes to hundreds."}, {"field": "Transit is blocked", "note": "Other routers will not route THROUGH a stub. If two hubs are dual-homed through the same 'spoke', marking it stub silently removes that transit path \u2014 a real outage cause."}, {"field": "Prefixes: 3", "note": "How many prefixes this peer is advertising. A stub with a large number here means someone leaked more than intended."}], "when": "Every branch/spoke router in a hub-and-spoke WAN, and any leaf router that should never carry transit traffic. Combine with ip summary-address at the hub to bound queries from both directions.", "whenNot": "Never on a hub, a core router, or any router that legitimately provides a transit path \u2014 including a dual-homed branch used as a backup path between two hubs. Also do not use receive-only if the router has LANs to advertise.", "safety": "caution", "related": ["eigrp-ip-summary-address", "eigrp-sh-traffic", "eigrp-sh-topology-all-links", "cisco-eigrp-nei", "eigrp-router-eigrp"], "tags": ["eigrp", "routing", "scalability", "query-scoping", "hub-and-spoke", "advanced"], "equivalents": {"juniper": "set protocols ospf area 0.0.0.1 stub (OSPF stub area is the nearest analogue)", "paloalto": "set network virtual-router default protocol ospf area 0.0.0.1 type stub", "linux": "vtysh -c 'router eigrp 100' -c 'eigrp stub connected summary' (FRRouting)"}, "sandboxOutput": "Spoke1(config)#router eigrp 100\nSpoke1(config-router)#eigrp stub connected summary\nSpoke1(config-router)#\n*Jul 25 14:40:11.223: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.1.1 (GigabitEthernet0/0) is resync: peer info changed\nSpoke1(config-router)#end\nSpoke1#show ip protocols | include stub|Stub\n  EIGRP stub, connected, summary\n\nHub#show ip eigrp neighbors detail\nEIGRP-IPv4 Neighbors for AS(100)\nH   Address                 Interface              Hold Uptime   SRTT   RTO  Q  Seq\n                                                   (sec)         (ms)       Cnt Num\n0   10.1.1.2                Gi0/0                     12 00:02:41   6   100  0  9\n   Version 23.0/2.0, Retrans: 0, Retries: 0, Prefixes: 3\n   Topology-ids from peer - 0\n   Stub Peer Advertising ( CONNECTED SUMMARY ) Routes\n   Suppressing queries"}, {"id": "eigrp-maximum-paths", "vendor": "cisco", "family": "IOS/XE", "mode": "config", "cmd": "maximum-paths <n>", "aliases": ["maximum-paths 4", "maximum-paths 8", "maximum-paths 1", "no maximum-paths"], "purpose": "Caps how many equal-cost (or, with variance, unequal-cost) EIGRP paths get installed in the RIB for one prefix. Raise it to use all your links; set it to 1 to force deterministic single-path forwarding.", "tokens": [{"t": "maximum-paths", "d": "Limit on parallel routes installed per destination"}, {"t": "<n>", "d": "1-32 depending on platform and release; the default is 4 and 16 is the common ceiling"}], "syntax": "maximum-paths <1-32>", "flags": [{"f": "Default 4", "d": "If you have 6 equal links, only 4 are used until you raise this. Silent under-utilisation nobody notices."}, {"f": "maximum-paths 1", "d": "Disables ECMP for EIGRP on this router \u2014 useful with stateful firewalls or asymmetric-routing-sensitive middleboxes."}, {"f": "variance <multiplier>", "d": "The companion command, also in router mode. With variance 2, any FEASIBLE SUCCESSOR whose metric is < 2x FD is also installed, giving unequal-cost load sharing proportional to metric. A non-feasible path is NEVER installed no matter how high you set variance \u2014 that is what keeps it loop-free."}, {"f": "Load-share granularity", "d": "How traffic actually splits across the installed paths is a CEF decision (per-destination by default), not an EIGRP one."}], "sample": "R1(config)#router eigrp 100\nR1(config-router)#maximum-paths 8\nR1(config-router)#variance 2\nR1(config-router)#end\nR1#show ip protocols | include Maximum\n      Maximum path: 8\n      Maximum hopcount 100\n      Maximum metric variance 2\nR1#show ip route 172.16.50.0\nRouting entry for 172.16.50.0/24\n  Known via \"eigrp 100\", distance 90, metric 3072, type internal\n  Redistributing via eigrp 100\n  Last update from 10.1.2.2 on FastEthernet0/1, 00:00:14 ago\n  Routing Descriptor Blocks:\n  * 10.1.1.2, from 10.1.1.2, 00:00:14 ago, via GigabitEthernet0/0\n      Route metric is 3072, traffic share count is 9\n      Total delay is 20 microseconds, minimum bandwidth is 1000000 Kbit\n      Reliability 255/255, minimum MTU 1500 bytes\n      Loading 1/255, Hops 1", "annotations": [{"field": "Maximum path: 8", "note": "Confirms the new cap. Verify here, not in show run \u2014 the platform may clamp your value to a lower supported maximum."}, {"field": "Maximum metric variance 2", "note": "Multiplier applied to FD. Only paths that already passed the feasibility condition (RD < FD) are eligible. Variance uting via eigrp 100\n  Last update from 10.1.2.2 on FastEthernet0/1, 00:00:14 ago\n  Routing Descriptor Blocks:\n  * 10.1.1.2, from 10.1.1.2, 00:00:14 ago, via GigabitEthernet0/0\n      Route metric is 3072, traffic share count is 9\n      Total delay is 20 microseconds, minimum bandwidth is 1000000 Kbit\n      Reliability 255/255, minimum MTU 1500 bytes\n      Loading 1/255, Hops 1"}, {"id": "eigrpx-named-router-eigrp", "vendor": "cisco", "family": "IOS/XE", "mode": "config", "cmd": "router eigrp <NAME>", "aliases": ["router eigrp CORP", "router eigrp LAB-WAN", "rou eigrp CORP"], "purpose": "Starts an EIGRP named-mode (EIGRP Named Configuration) instance. The name is a local label for a virtual router container, not an AS number \u2014 the AS is set later inside the address-family. Everything modern IOS-XE ships with is configured this way.", "tokens": [{"t": "router", "d": "Enter routing-protocol configuration"}, {"t": "eigrp", "d": "Enhanced Interior Gateway Routing Protocol"}, {"t": "<NAME>", "d": "Alphanumeric instance name (locally significant). If you type a pure number here you get CLASSIC mode instead, and that number IS the AS."}], "syntax": "router eigrp {<NAME> | <AS-NUMBER>}", "flags": [{"f": "<NAME>", "d": "Any string starting with a letter, e.g. CORP \u2014 named mode"}, {"f": "<AS-NUMBER>", "d": "1-65535 \u2014 drops you into legacy classic mode instead"}, {"f": "shutdown", "d": "Sub-command that administratively disables the whole named instance without deleting config"}, {"f": "address-family", "d": "Sub-command that creates the actual routing instance (see related card)"}, {"f": "service-family", "d": "EIGRP SAF (Service Advertisement Framework) \u2014 rarely used, not routing"}], "sample": "R1(config)#router eigrp CORP\nR1(config-router)#?\nRouter configuration commands:\n  address-family  Enter Address Family command mode\n  default         Set a command to its defaults\n  exit            Exit from routing protocol configuration mode\n  no ain to all interfaces"}, {"f": "bandwidth-percent <pct>", "d": "Global pacing cap"}, {"f": "shutdown", "d": "Disable EIGRP on all interfaces without removing 'network' statements"}], "sample": "R1(config-router-af)#af-interface default\nR1(config-router-af-interface)#passive-interface\nR1(config-router-af-interface)#authentication mode hmac-sha-256 0 EIGRP-LAB-SECRET\nR1(config-router-af-interface)#exit-af-interface\nR1(config-router-af)#af-interface GigabitEthernet0/0\nR1(config-router-af-interface)#no passive-interface\nR1(config-router-af-interface)#exit-af-interface\nR1(config-router-af)#end\nR1#show ip eigrp interfaces\nEIGRP-IPv4 VR(CORP) Address-Family Interfaces for AS(100)\n                              Xmit Queue   PeerQ        Mean   Pacing Time   Multicast    Pending\nInterface        Peers  Un/Reliable  Un/Reliable  SRTT   Un/Reliable   Flow Timer   Routes\nGi0/0              1        0/0       0/0           5       0/1           50           0\nR1#show ip protocols | begin Passive\n  Passive Interface(s):\n    GigabitEthernet0/1\n    GigabitEthernet0/2\n    Loopback0", "annotations": [{"field": "af-interface default + passive-interface", "note": "Deny-by-default posture. A new access VLAN SVI added next year is passive automatically instead of silently offering adjacency to whatever is plugged in."}, {"field": "no passive-interface under af-interface Gi0/0", "note": "Specific af-interface blocks override the default block. This is the whole point of the two-tier model."}, {"field": "show ip eigrp interfaces", "note": "Only lists interfaces actively running EIGRP. Passive interfaces are advertised but do not appear here \u2014 that asymmetry is the single most useful check after this config."}, {"field": "Passive Interface(s) list", "note": "'show ip protocols' is where you confirm the default actually took. If a link you expect to peer shows up in this list, that is your missing adjacency."}], "when": "Every named-mode build. Set passive by default plus authentication by default, then whitelist the peering links.", "whenNot": "Do not use it to disable EIGRP on an interface you never wanted advertised at all \u2014 passive still advertises the subnet, it only stops hellos. If the prefix itself must not leave, fix the 'network' statement or filter it.", "safety": "caution", "related": ["eigrpx-named-af-interface", "eigrpx-named-address-family", "eigrpx-named-auth-hmac-sha256", "eigrpx-distribute-list-route-map"], "tags": ["eigrp", "named-mode", "passive-interface", "hardening", "advanced"], "equivalents": {"juniper": "set protocols ospf area 0.0.0.0 interface all passive", "paloalto": "set network virtual-router VR1 protocol ospf area 0.0.0.0 interface ethernet1/2 passive yes", "linux": "vtysh -c 'configure terminal' -c 'router eigrp 100' -c 'passive-interface default'"}, "sandboxOutput": "R1(config-router-af)#af-interface default\nR1(config-router-af-interface)#passive-interface\nR1(config-router-af-interface)#authentication mode hmac-sha-256 0 EIGRP-LAB-SECRET\nR1(config-router-af-interface)#exit-af-interface\nR1(config-router-af)#af-interface GigabitEthernet0/0\nR1(config-router-af-interface)#no passive-interface\nR1(config-router-af-interface)#exit-af-interface\nR1(config-router-af)#end\nR1#show ip eigrp interfaces\nEIGRP-IPv4 VR(CORP) Address-Family Interfaces for AS(100)\n                              Xmit Queue   PeerQ        Mean   Pacing Time   Multicast    Pending\nInterface        Peers  Un/Reliable  Un/Reliable  SRTT   Un/Reliable   Flow Timer   Routes\nGi0/0              1        0/0       0/0           5       0/1           50           0\nR1#show ip protocols | begin Passive\n  Passive Interface(s):\n    GigabitEthernet0/1\n    GigabitEthernet0/2\n    Loopback0"}, {"id": "eigrpx-named-topology-base", "vendor": "cisco", "family": "IOS/XE", "mode": "config", "cmd": "topology base", "aliases": ["topology base"], "purpose": "Enters the base-topology sub-mode of an EIGRP address-family. Everything that affects path selection and route injection \u2014 variance, maximum-paths, redistribution, distribute-lists, offset-lists, administrative distance \u2014 lives here in named mode.", "tokens": [{"t": "topology", "d": "Multi-Topology Routing sub-mode of the address-family"}, {"t": "base", "d": "The default (and normally only) topology. MTR named topologies are legacy and rarely deployed."}], "syntax": "topology {base | <TOPOLOGY-NAME> tid <NUMBER>}", "flags": [{"f": "variance <1-128>", "d": "Unequal-cost load balancing multiplier"}, {"f": "maximum-paths <1-32>", "d": "Parallel paths installed into the RIB"}, {"f": "distance eigrp <internal> <external>", "d": "Change AD from the default 90 / 170"}, {"f": "redistribute <protocol> [metric ...]", "d": "Route injection \u2014 same syntax as classic mode"}, {"f": "default-metric <bw> <delay> <rel> <load> <mtu>", "d": "Seed metric for redistributed routes"}, {"f": "distribute-list ... {in|out} [intf]", "d": "Prefix filtering"}, {"f": "offset-list ... {in|out} <offset> [intf]", "d": "Metric nudging"}, {"f": "timers active-time {<min> | disabled}", "d": "SIA active timer \u2014 lives here in named mode, under router mode in classic"}, {"f": "traffic-share balanced | min across-interfaces", "d": "How unequal paths share load"}, {"f": "exit-af-topology", "d": "Leaves this sub-mode"}], "sample": "R1(config-router-af)#topology base\nR1(config-router-af-topology)#variance 2\nR1(config-router-af-topology)#maximum-paths 6\nR1(config-router-af-topology)#redistribute static metric 100000 100 255 1 1500\nR1(config-router-af-topology)#timers active-time 3\nR1(config-router-af-topology)#exit-af-topology\nR1(config-router-af)#exit-address-family\nR1(config-router)#end\nR1#show run | section router eigrp\nrouter eigrp CORP\n !\n address-family ipv4 unicast autonomous-system 100\n  !\n  af-interface default\n   passive-interface\n  exit-af-interface\n  !\n  af-interface GigabitEthernet0/0\n   no passive-interface\n  exit-af-interface\n  !\n  topology base\n   variance 2\n   maximum-paths 6\n   timers active-time 3\n   redistribute static metric 100000 100 255 1 1500\n  exit-af-topology\n  network 10.1.12.0 0.0.0.255\n  eigrp router-id 1.1.1.1\n exit-address-family", "annotations": [{"field": "config-router-af-topology prompt", "note": "Three levels deep: router -> address-family -> topology. If a command you know from classic mode is rejected, you are almost always one sub-mode too high or too low."}, {"field": "Classic-to-named mapping", "note": "Classic 'router eigrp 100 / variance 2 / redistribute static' maps 1:1 onto 'topology base'. Classic 'passive-interface' maps to af-interface. Classic 'metric weights' and 'eigrp stub' map to the address-family level, NOT topology."}, {"field": "exit-af-topology / exit-address-family", "note": "IOS renders these explicitly in the running-config. They are how you read nesting depth when auditing a config you did not write."}, {"field": "Wide metrics", "note": "Named mode enables 64-bit wide metrics by default (tunable with 'metric rib-scale' and 'metric maximum-hops'), so composite values here can be far larger than the classic 32-bit numbers you remember."}], "when": "Any time you need to tune path selection or redistribution in a named-mode instance \u2014 this is where those knobs moved.", "whenNot": "Do not create additional named topologies (MTR) unless you genuinely run Multi-Topology Routing; almost nobody does, and it complicates every troubleshooting session afterwards.", "safety": "caution", "related": ["eigrpx-named-address-family", "eigrpx-variance", "eigrpx-redistribute", "eigrpx-timers-active-time", "cisco-show-run"], "tags": ["eigrp", "named-mode", "topology", "path-selection", "advanced"], "equivalents": {"juniper": "set protocols ospf export REDIST-STATIC", "paloalto": "set network virtual-router VR1 protocol redist-profile STATIC-OUT", "linux": "vtysh -c 'configure terminal' -c 'router eigrp 100' -c 'variance 2'"}, "sandboxOutput": "R1(config-router-af)#topology base\nR1(config-router-af-topology)#variance 2\nR1(config-router-af-topology)#maximum-paths 6\nR1(config-router-af-topology)#redistribute static metric 100000 100 255 1 1500\nR1(config-router-af-topology)#timers active-time 3\nR1(config-router-af-topology)#exit-af-topology\nR1(config-router-af)#exit-address-family\nR1(config-router)#end\nR1#show run | section router eigrp\nrouter eigrp CORP\n !\n address-family ipv4 unicast autonomous-system 100\n  !\n  af-interface default\n   passive-interface\n  exit-af-interface\n  !\n  af-interface GigabitEthernet0/0\n   no passive-interface\n  exit-af-interface\n  !\n  topology base\n   variance 2\n   maximum-paths 6\n   timers active-time 3\n   redistribute static metric 100000 100 255 1 1500\n  exit-af-topology\n  network 10.1.12.0 0.0.0.255\n  eigrp router-id 1.1.1.1\n exit-address-family"}, {"id": "eigrpx-variance", "vendor": "cisco", "family": "IOS/XE", "mode": "config", "cmd": "variance <MULTIPLIER>", "aliases": ["variance 2", "variance 4", "variance 128"], "purpose": "Enables unequal-cost load balancing: EIGRP installs any FEASIBLE SUCCESSOR whose total metric is <= variance x the successor's feasible distance. It is the only IGP knob on Cisco gear that load-shares over paths of different cost.", "tokens": [{"t": "variance", "d": "Unequal-cost multiplier"}, {"t": "<MULTIPLIER>", "d": "1-128. Default 1 = equal-cost only. 2 means 'up to twice the best metric'."}], "syntax": "variance <1-128>", "flags": [{"f": "1 (default)", "d": "Equal-cost multipath only"}, {"f": "maximum-paths <n>", "d": "Companion command \u2014 variance finds the paths, maximum-paths caps how many get installed"}, {"f": "traffic-share balanced", "d": "Default: traffic is shared inversely proportional to metric"}, {"f": "traffic-share min across-interfaces", "d": "Keeps the alternates in the RIB for instant failover but sends traffic only down the best path"}], "sample": "R1(config-router)#variance 2\nR1(config-router)#end\nR1#show ip route 10.20.20.0\nRouting entry for 10.20.20.0/24\n  Known via \"eigrp 100\", distance 90, metric 3072, type internal\n  Redistributing via eigrp 100\n  Last update from 10.1.13.3 on GigabitEthernet0/1, 00:00:09 ago\n  Routing Descriptor Blocks:\n  * 10.1.12.2, from 10.1.12.2, 00:00:09 ago, via GigabitEthernet0/0\n      Route metric is 3072, traffic share count is 117\n      Total delay is 20 microseconds, minimum bandwidth is 1000000 Kbit\n      Reliability 255/255, minimum MTU 1500 bytes\n      Loading 1/255, Hops 1\n    10.1.13.3, from 10.1.13.3, 00:00:09 ago, via GigabitEthernet0/1\n      Route metric is 3584, traffic share count is 100\n      Total delay is 40 microseconds, minimum bandwidth is 1000000 Kbit\n      Reliability 255/255, minimum MTU 1500 bytes\n      Loading 1/255, Hops 1", "annotations": [{"field": "Route metric is 3072 / 3584", "note": "Successor FD = 3072. Variance 2 admits anything up to 6144, so the 3584 path qualifies on metric."}, {"field": "The feasibility condition (the part people get wrong)", "note": "Metric alone is NOT enough. The alternate is only installed if its Reported Distance (the neighbour's own metric to the prefix) is strictly LESS than our current FD. Here RD via 10.1.13.3 is 2816 < FD 3072, so it is a feasible successor and safe to use."}, {"field": "Why that rule exists", "note": "If the neighbour's RD were >= our FD, that neighbour might be reaching the prefix THROUGH US. Installing it would create a routing loop. Variance will never install such a path no matter how large you set the multiplier \u2014 that is a feature, not a bug."}, {"field": "traffic share count 117 / 100", "note": "Balanced sharing, inversely proportional to metric (3584/3072 ~= 1.17). The router load-shares per-flow with CEF, not per-packet."}, {"field": "The asterisk (*)", "note": "Marks the path CEF will use for the next flow. Both blocks are in the RIB, so failover is instant with no DUAL computation."}], "when": "Dual WAN circuits of different bandwidth where you want to use both, e.g. a 200 Mb primary and a 100 Mb backup. Also useful to prove a backup path is genuinely feasible before you trust it for fast convergence.", "whenNot": "Do not reach for variance when 'show ip eigrp topology' shows no feasible successor \u2014 no multiplier will help, because the alternate fails the feasibility condition. Fix that with delay tuning or summarisation instead. Also avoid it on paths with wildly different latency (satellite vs fibre): EIGRP balances on metric, and TCP will hate the reordering and jitter.", "safety": "caution", "related": ["eigrpx-named-topology-base", "eigrpx-offset-list", "eigrpx-metric-weights", "eigrpx-neighbors-detail", "cisco-sh-ip-route"], "tags": ["eigrp", "variance", "load-balancing", "path-selection", "advanced"], "equivalents": {"juniper": "set policy-options policy-statement LB then load-balance per-packet (ECMP only; Junos has no unequal-cost IGP sharing)", "paloalto": "set network virtual-router VR1 ecmp algorithm weighted-round-robin", "linux": "ip route add 10.20.20.0/24 nexthop via 10.1.12.2 weight 117 nexthop via 10.1.13.3 weight 100"}, "sandboxOutput": "R1(config-router)#variance 2\nR1(config-router)#end\nR1#show ip route 10.20.20.0\nRouting entry for 10.20.20.0/24\n  Known via \"eigrp 100\", distance 90, metric 3072, type internal\n  Redistributing via eigrp 100\n  Last update from 10.1.13.3 on GigabitEthernet0/1, 00:00:09 ago\n  Routing Descriptor Blocks:\n  * 10.1.12.2, from 10.1.12.2, 00:00:09 ago, via GigabitEthernet0/0\n      Route metric is 3072, traffic share count is 117\n      Total delay is 20 microseconds, minimum bandwidth is 1000000 Kbit\n      Reliability 255/255, minimum MTU 1500 bytes\n      Loading 1/255, Hops 1\n    10.1.13.3, from 10.1.13.3, 00:00:09 ago, via GigabitEthernet0/1\n      Route metric is 3584, traffic share count is 100\n      Total delay is 40 microseconds, minimum bandwidth is 1000000 Kbit\n      Reliability 255/255, minimum MTU 1500 bytes\n      Loading 1/255, Hops 1"}, {"id": "eigrpx-key-chain", "vendor": "cisco", "family": "IOS/XE", "mode": "config", "cmd": "key chain <CHAIN-NAME>", "aliases": ["key chain EIGRP-KEYS", "key chain EIGRP-KEYS / key 1 / key-string EIGRP-LAB-KEY-1"], "purpose": "Builds the key chain that EIGRP MD5 authentication references. A chain holds numbered keys, each with a key-string and optional send/accept lifetimes, which is how you roll keys without dropping adjacencies.", "tokens": [{"t": "key chain", "d": "Global keychain container"}, {"t": "<CHAIN-NAME>", "d": "Local name, referenced later by 'ip authentication key-chain eigrp'. Does NOT need to match the neighbour."}, {"t": "key <ID>", "d": "Key identifier 0-2147483647. This number IS sent on the wire and MUST match the peer."}, {"t": "key-string <TEXT>", "d": "The shared secret. Must match the peer exactly, including trailing spaces."}], "syntax": "key chain <CHAIN-NAME>\n key <KEY-ID>\n  key-string [0|7] <TEXT>\n  [accept-lifetime <start> {infinite | <end> | duration <sec>}]\n  [send-lifetime <start> {infinite | <end> | duration <sec>}]\n  [cryptographic-algorithm <algorithm>]", "flags": [{"f": "key <ID>", "d": "Lowest valid key ID is used for sending; all valid keys are accepted"}, {"f": "key-string [0|7] <TEXT>", "d": "0 = plaintext entry, 7 = pre-encrypted Type 7 string"}, {"f": "send-lifetime", "d": "Window in which this key is used to sign outgoing packets"}, {"f": "accept-lifetime", "d": "Window in which this key is accepted on received packets. Overlap it generously for hitless rollover."}, {"f": "cryptographic-algorithm", "d": "Used by keychain-aware protocols such as OSPFv2/IS-IS. EIGRP classic mode is MD5-only; EIGRP named mode takes its SHA-256 password inline instead."}], "sample": "R1(config)#key chain EIGRP-KEYS\nR1(config-keychain)#key 1\nR1(config-keychain-key)#key-string EIGRP-LAB-KEY-1\nR1(config-keychain-key)#accept-lifetime 00:00:00 Jan 1 2026 infinite\nR1(config-keychain-key)#send-lifetime 00:00:00 Jan 1 2026 23:59:59 Dec 31 2026\nR1(config-keychain-key)#end\nR1#show key chain\nKey-chain EIGRP-KEYS:\n    key 1 -- text \"EIGRP-LAB-KEY-1\"\n        accept lifetime (00:00:00 UTC Jan 1 2026) - (infinite) [valid now]\n        send lifetime (00:00:00 UTC Jan 1 2026) - (23:59:59 UTC Dec 31 2026) [valid now]", "annotations": [{"field": "key 1", "note": "The key ID travels in the EIGRP authentication TLV. Chain names can differ between routers; key IDs and key-strings cannot."}, {"field": "[valid now]", "note": "The single most important field. A key with no [valid now] on send lifetime means this router is signing with nothing and the adjacency will drop."}, {"field": "Lowest-valid-key-sends rule", "note": "IOS signs with the lowest-numbered key that is currently valid for sending. To roll keys, add key 2 with an accept-lifetime that starts early on both routers, then let send-lifetime cut over."}, {"field": "Clock dependency", "note": "Lifetimes are evaluated against the system clock. A router without NTP can decide every key is invalid and tear down every adjacency at once \u2014 always configure NTP before lifetimes."}], "when": "Before configuring EIGRP MD5 authentication, and whenever you need to rotate an EIGRP key without an outage.", "whenNot": "Do not bother with lifetimes for a lab or a static long-lived key \u2014 an unqualified key-string is always valid and removes an entire class of clock-related outages. Never configure lifetimes on devices that lack reliable NTP.", "safety": "caution", "related": ["eigrpx-ip-auth-mode", "eigrpx-ip-auth-key-chain", "eigrpx-named-auth-hmac-sha256", "cisco-show-run"], "tags": ["eigrp", "authentication", "md5", "key-chain", "security", "advanced"], "equivalents": {"juniper": "set protocols ospf area 0 interface ge-0/0/0.0 authentication md5 1 key <secret>", "paloalto": "set network routing-profile auth-profile EIGRP-AUTH md5 1 key <secret>", "linux": "vtysh -c 'configure terminal' -c 'key chain EIGRP-KEYS' -c 'key 1' -c 'key-string EIGRP-LAB-KEY-1'"}, "sandboxOutput": "R1(config)#key chain EIGRP-KEYS\nR1(config-keychain)#key 1\nR1(config-keychain-key)#key-string EIGRP-LAB-KEY-1\nR1(config-keychain-key)#accept-lifetime 00:00:00 Jan 1 2026 infinite\nR1(config-keychain-key)#send-lifetime 00:00:00 Jan 1 2026 23:59:59 Dec 31 2026\nR1(config-keychain-key)#end\nR1#show key chain\nKey-chain EIGRP-KEYS:\n    key 1 -- text \"EIGRP-LAB-KEY-1\"\n        accept lifetime (00:00:00 UTC Jan 1 2026) - (infinite) [valid now]\n        send lifetime (00:00:00 UTC Jan 1 2026) - (23:59:59 UTC Dec 31 2026) [valid now]"}, {"id": "eigrpx-ip-auth-mode", "vendor": "cisco", "family": "IOS/XE", "mode": "config-if", "cmd": "ip authentication mode eigrp <ASN> md5", "aliases": ["ip authentication mode eigrp 100 md5", "ip auth mode eigrp 100 md5"], "purpose": "Turns on MD5 authentication for EIGRP packets on one interface in classic mode. Half of the pair \u2014 without the matching key-chain command the interface authenticates with nothing and the adjacency drops.", "tokens": [{"t": "ip authentication mode", "d": "Per-interface authentication selector"}, {"t": "eigrp", "d": "Applies to EIGRP, not RIP/OSPF"}, {"t": "<ASN>", "d": "The EIGRP autonomous system this applies to \u2014 a router can run several"}, {"t": "md5", "d": "The only algorithm classic mode supports. SHA-256 requires named mode."}], "syntax": "ip authentication mode eigrp <1-65535> md5", "flags": [{"f": "md5", "d": "HMAC-MD5 of the EIGRP packet plus the key-string"}, {"f": "no ip authentication mode eigrp <ASN> md5", "d": "Disables auth on this interface \u2014 will also bounce the adjacency"}], "sample": "R1(config)#interface GigabitEthernet0/0\nR1(config-if)#ip authentication mode eigrp 100 md5\nR1(config-if)#\n*Jul 25 14:11:03.551: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.12.2 (GigabitEthernet0/0) is down: authentication mode changed\nR1(config-if)#ip authentication key-chain eigrp 100 EIGRP-KEYS\nR1(config-if)#end\nR1#show ip eigrp neighbors\nEIGRP-IPv4 Neighbors for AS(100)\nH   Address                 Interface              Hold Uptime   SRTT   RTO  Q  Seq\n                                                   (sec)         (ms)       Cnt Num\n\nR1#\n*Jul 25 14:12:40.907: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.12.2 (GigabitEthernet0/0) is up: new adjacency", "annotations": [{"field": "is down: authentication mode changed", "note": "Expected and immediate. The moment you enable auth on one end, the adjacency drops until the far end matches. Plan a window or configure the far end first."}, {"field": "Empty neighbor table", "note": "The gap between the two commands. This is why you paste both lines together, or configure them from console rather than across the link you are securing."}, {"field": "Order of operations", "note": "Safest sequence: build the key chain on BOTH routers first, then enable mode + key-chain on the remote end, then the local end. EIGRP does not have a 'null auth accepted' transition state like OSPF."}, {"field": "Per-AS scoping", "note": "The ASN in this command must match the process. Typing 100 here when the process is 65001 silently does nothing \u2014 no error, no auth, no clue."}], "when": "Hardening EIGRP on classic-mode routers, especially on any link that crosses a shared LAN, a colo cross-connect, or a partner handoff.", "whenNot": "Not the right tool on a named-mode instance \u2014 use 'authentication mode md5' under af-interface there. Also useless on its own: without 'ip authentication key-chain eigrp' this command only breaks the adjacency.", "safety": "caution", "related": ["eigrpx-key-chain", "eigrpx-ip-auth-key-chain", "eigrpx-named-auth-hmac-sha256", "cisco-eigrp-nei"], "tags": ["eigrp", "authentication", "md5", "security", "interface", "advanced"], "equivalents": {"juniper": "set protocols ospf area 0.0.0.0 interface ge-0/0/0.0 authentication md5 1 key <secret>", "paloalto": "set network virtual-router VR1 protocol ospf area 0.0.0.0 interface ethernet1/1 auth-profile EIGRP-AUTH", "linux": "vtysh -c 'configure terminal' -c 'interface eth0' -c 'ip authentication mode eigrp 100 md5'"}, "sandboxOutput": "R1(config)#interface GigabitEthernet0/0\nR1(config-if)#ip authentication mode eigrp 100 md5\nR1(config-if)#\n*Jul 25 14:11:03.551: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.12.2 (GigabitEthernet0/0) is down: authentication mode changed\nR1(config-if)#ip authentication key-chain eigrp 100 EIGRP-KEYS\nR1(config-if)#end\nR1#show ip eigrp neighbors\nEIGRP-IPv4 Neighbors for AS(100)\nH   Address                 Interface              Hold Uptime   SRTT   RTO  Q  Seq\n                                                   (sec)         (ms)       Cnt Num\n\nR1#\n*Jul 25 14:12:40.907: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.12.2 (GigabitEthernet0/0) is up: new adjacency"}, {"id": "eigrpx-ip-auth-key-chain", "vendor": "cisco", "family": "IOS/XE", "mode": "config-if", "cmd": "ip authentication key-chain eigrp <ASN> <CHAIN-NAME>", "aliases": ["ip authentication key-chain eigrp 100 EIGRP-KEYS", "ip auth key-chain eigrp 100 EIGRP-KEYS"], "purpose": "Binds a key chain to EIGRP on an interface so the router can actually sign and verify packets. The other half of classic-mode MD5 authentication.", "tokens": [{"t": "ip authentication key-chain", "d": "Bind a keychain to a protocol on this interface"}, {"t": "eigrp", "d": "Protocol selector"}, {"t": "<ASN>", "d": "EIGRP autonomous system number"}, {"t": "<CHAIN-NAME>", "d": "Name from 'key chain <NAME>'. Local only \u2014 peers may use different chain names."}], "syntax": "ip authentication key-chain eigrp <1-65535> <CHAIN-NAME>", "flags": [{"f": "<CHAIN-NAME>", "d": "Must already exist; IOS accepts a non-existent name silently and authentication simply fails"}, {"f": "debug eigrp packets", "d": "The companion troubleshooting command shown below"}], "sample": "R1#debug eigrp packets\nEIGRP Packets debugging is on\n    (UPDATE, REQUEST, QUERY, REPLY, HELLO, IPXSAP, PROBE, ACK, STUB, SIAQUERY, SIAREPLY)\nR1#\n*Jul 25 14:15:02.117: EIGRP: pkt key id = 1, authentication mismatch\n*Jul 25 14:15:02.117: EIGRP: GigabitEthernet0/0: ignored packet from 10.1.12.2, opcode = 5 (invalid authentication)\n*Jul 25 14:15:06.883: EIGRP: pkt key id = 1, authentication mismatch\n*Jul 25 14:15:06.883: EIGRP: GigabitEthernet0/0: ignored packet from 10.1.12.2, opcode = 5 (invalid authentication)\nR1#undebug all\nAll possible debugging has been turned off\nR1#show key chain\nKey-chain EIGRP-KEYS:\n    key 1 -- text \"EIGRP-LAB-KEY-1\"\n        accept lifetime (always valid) - (always valid) [valid now]\n        send lifetime (always valid) - (always valid) [valid now]", "annotations": [{"field": "pkt key id = 1, authentication mismatch", "note": "Key ID matched but the key-string did not. Nine times out of ten this is a trailing space or a different character case in one router's key-string."}, {"field": "opcode = 5", "note": "Opcode 5 is HELLO. The peer's hellos are arriving and being discarded, which is why the neighbor never appears and yet the interface counters climb."}, {"field": "No 'key not defined' line", "note": "If you instead see 'key not defined or not live', the key ID itself is missing on this router or its lifetime has expired \u2014 a keychain problem, not a key-string typo."}, {"field": "[valid now]", "note": "Confirm this on BOTH routers. An expired send-lifetime produces the same silent failure as a wrong password."}, {"field": "debug eigrp packets", "note": "Safe on a lab or a link with one or two neighbours; on a hub with dozens of peers it will flood the console \u2014 use 'debug eigrp packets hello' or a terminal monitor filter."}], "when": "Right after 'ip authentication mode eigrp <ASN> md5', and any time an adjacency will not form on a link you know has authentication configured.", "whenNot": "Do not use in named mode \u2014 there it is 'authentication key-chain <NAME>' under af-interface. And do not run bare 'debug eigrp packets' on a production DMVPN hub.", "safety": "caution", "related": ["eigrpx-key-chain", "eigrpx-ip-auth-mode", "eigrpx-named-auth-hmac-sha256", "eigrpx-neighbors-detail"], "tags": ["eigrp", "authentication", "md5", "troubleshooting", "security", "advanced"], "equivalents": {"juniper": "set protocols ospf area 0.0.0.0 interface ge-0/0/0.0 authentication md5 1 key <secret>", "paloalto": "show routing protocol ospf interface", "linux": "vtysh -c 'configure terminal' -c 'interface eth0' -c 'ip authentication key-chain eigrp 100 EIGRP-KEYS'"}, "sandboxOutput": "R1#debug eigrp packets\nEIGRP Packets debugging is on\n    (UPDATE, REQUEST, QUERY, REPLY, HELLO, IPXSAP, PROBE, ACK, STUB, SIAQUERY, SIAREPLY)\nR1#\n*Jul 25 14:15:02.117: EIGRP: pkt key id = 1, authentication mismatch\n*Jul 25 14:15:02.117: EIGRP: GigabitEthernet0/0: ignored packet from 10.1.12.2, opcode = 5 (invalid authentication)\n*Jul 25 14:15:06.883: EIGRP: pkt key id = 1, authentication mismatch\n*Jul 25 14:15:06.883: EIGRP: GigabitEthernet0/0: ignored packet from 10.1.12.2, opcode = 5 (invalid authentication)\nR1#undebug all\nAll possible debugging has been turned off\nR1#show key chain\nKey-chain EIGRP-KEYS:\n    key 1 -- text \"EIGRP-LAB-KEY-1\"\n        accept lifetime (always valid) - (always valid) [valid now]\n        send lifetime (always valid) - (always valid) [valid now]"}, {"id": "eigrpx-named-auth-hmac-sha256", "vendor": "cisco", "family": "IOS/XE", "mode": "config", "cmd": "authentication mode hmac-sha-256 <PASSWORD>", "aliases": ["authentication mode hmac-sha-256 0 EIGRP-LAB-SECRET", "authentication mode hmac-sha-256 EIGRP-LAB-SECRET", "authentication mode md5"], "purpose": "Enables HMAC-SHA-256 authentication for EIGRP under an af-interface block. This is named-mode only \u2014 there is no classic-mode equivalent \u2014 and unlike MD5 it takes the shared secret inline rather than through a key chain.", "tokens": [{"t": "authentication mode", "d": "af-interface sub-command selecting the algorithm"}, {"t": "hmac-sha-256", "d": "SHA-256 based HMAC. Stronger than MD5 and the reason to move to named mode."}, {"t": "[0|7]", "d": "Optional encryption type for the password that follows: 0 = cleartext entry, 7 = pre-obfuscated"}, {"t": "<PASSWORD>", "d": "Shared secret, must match the peer exactly"}], "syntax": "authentication mode {md5 | hmac-sha-256 [0 | 7] <PASSWORD>}", "flags": [{"f": "hmac-sha-256", "d": "Password supplied inline; no key chain involved"}, {"f": "md5", "d": "Pairs with 'authentication key-chain <NAME>' in the same af-interface block"}, {"f": "af-interface default", "d": "Apply SHA to every interface in the address-family in one place"}, {"f": "0", "d": "Type 0 \u2014 password typed in clear. Use 'service password-encryption' or type 7 to avoid it sitting readable in the config."}], "sample": "R1(config)#router eigrp CORP\nR1(config-router)#address-family ipv4 unicast autonomous-system 100\nR1(config-router-af)#af-interface GigabitEthernet0/0\nR1(config-router-af-interface)#authentication mode hmac-sha-256 0 EIGRP-LAB-SECRET\nR1(config-router-af-interface)#exit-af-interface\nR1(config-router-af)#exit-address-family\nR1(config-router)#end\nR1#show ip eigrp interfaces detail GigabitEthernet0/0\nEIGRP-IPv4 VR(CORP) Address-Family Interfaces for AS(100)\n                              Xmit Queue   PeerQ        Mean   Pacing Time   Multicast    Pending\nInterface        Peers  Un/Reliable  Un/Reliable  SRTT   Un/Reliable   Flow Timer   Routes\nGi0/0              1        0/0       0/0           4       0/0           50           0\n  Hello-interval is 5, Hold-time is 15\n  Split-horizon is enabled\n  Next xmit serial <none>\n  Packetized sent/expedited: 3/0\n  Hello's sent/expedited: 214/1\n  Un/reliable mcasts: 0/4  Un/reliable ucasts: 3/6\n  Mcast exceptions: 0  CR packets: 0  ACKs suppressed: 0\n  Retransmissions sent: 0  Out-of-sequence rcvd: 0\n  Topology-ids on interface - 0\n  Authentication mode is HMAC-SHA-256", "annotations": [{"field": "Authentication mode is HMAC-SHA-256", "note": "The one line that proves auth is live on the interface, not merely present in the config. Check this before declaring a link hardened."}, {"field": "Peers 1", "note": "Adjacency survived, so the far end already has the identical mode and password. If Peers drops to 0 after this command, the far end is still on MD5 or unauthenticated."}, {"field": "Mode is per-interface, not per-router", "note": "Rolling SHA out link by link is fine as long as both ends of each link change together. Mixed MD5 and SHA links on the same router are legal."}, {"field": "No key chain, no key IDs", "note": "SHA-256 here has no key rollover mechanism. Changing the password is a hard cutover on both ends \u2014 schedule it, or fall back to md5 + key-chain if hitless rotation matters more than algorithm strength."}, {"field": "Interoperability", "note": "A classic-mode router cannot do SHA-256. If any neighbour on the link still runs 'router eigrp 100' classic, you must stay on MD5."}], "when": "Any named-mode deployment where security policy requires more than MD5, or where an audit flags EIGRP MD5 as deprecated crypto.", "whenNot": "Do not configure it on a link whose neighbour runs classic mode or an older IOS without named-mode support \u2014 the adjacency will simply never come up and the logs give you nothing more than a silent absence.", "safety": "caution", "related": ["eigrpx-named-af-interface", "eigrpx-named-af-interface-default", "eigrpx-key-chain", "eigrpx-ip-auth-mode"], "tags": ["eigrp", "named-mode", "authentication", "sha-256", "security", "advanced"], "equivalents": {"juniper": "set security authentication-key-chains key-chain KC key 1 secret <secret> algorithm hmac-sha-256", "paloalto": "set network routing-profile auth-profile EIGRP-AUTH md5 1 key <secret>", "linux": "vtysh -c 'show ip eigrp interfaces detail eth0'"}, "sandboxOutput": "R1(config)#router eigrp CORP\nR1(config-router)#address-family ipv4 unicast autonomous-system 100\nR1(config-router-af)#af-interface GigabitEthernet0/0\nR1(config-router-af-interface)#authentication mode hmac-sha-256 0 EIGRP-LAB-SECRET\nR1(config-router-af-interface)#exit-af-interface\nR1(config-router-af)#exit-address-family\nR1(config-router)#end\nR1#show ip eigrp interfaces detail GigabitEthernet0/0\nEIGRP-IPv4 VR(CORP) Address-Family Interfaces for AS(100)\n                              Xmit Queue   PeerQ        Mean   Pacing Time   Multicast    Pending\nInterface        Peers  Un/Reliable  Un/Reliable  SRTT   Un/Reliable   Flow Timer   Routes\nGi0/0              1        0/0       0/0           4       0/0           50           0\n  Hello-interval is 5, Hold-time is 15\n  Split-horizon is enabled\n  Next xmit serial <none>\n  Packetized sent/expedited: 3/0\n  Hello's sent/expedited: 214/1\n  Un/reliable mcasts: 0/4  Un/reliable ucasts: 3/6\n  Mcast exceptions: 0  CR packets: 0  ACKs suppressed: 0\n  Retransmissions sent: 0  Out-of-sequence rcvd: 0\n  Topology-ids on interface - 0\n  Authentication mode is HMAC-SHA-256"}, {"id": "eigrpx-redistribute", "vendor": "cisco", "family": "IOS/XE", "mode": "config", "cmd": "redistribute ospf <PROCESS-ID> metric <BW> <DELAY> <REL> <LOAD> <MTU>", "aliases": ["redistribute ospf 1 metric 100000 100 255 1 1500", "redistribute static metric 1000000 10 255 1 1500", "redistribute connected metric 1000000 10 255 1 1500", "redistribute ospf 1 metric 100000 100 255 1 1500 route-map OSPF-TO-EIGRP"], "purpose": "Injects routes from another source into EIGRP as external (D EX) routes with AD 170. EIGRP has no default seed metric for most sources, so the metric must be supplied here or via default-metric or the routes are computed as unreachable and never advertised.", "tokens": [{"t": "redistribute", "d": "Inject routes from another protocol/source"}, {"t": "ospf <PROCESS-ID>", "d": "Source protocol and process. Also: static, connected, bgp <ASN>, rip, isis, eigrp <ASN>"}, {"t": "metric", "d": "Seed metric keyword"}, {"t": "<BW>", "d": "Bandwidth in Kbit/sec, e.g. 100000 for 100 Mb"}, {"t": "<DELAY>", "d": "Delay in TENS of microseconds, e.g. 100 = 1000 usec"}, {"t": "<REL>", "d": "Reliability 0-255 (255 = 100%)"}, {"t": "<LOAD>", "d": "Load 0-255 (1 = unloaded)"}, {"t": "<MTU>", "d": "MTU in bytes, conventionally 1500. Not used in the metric formula but required."}], "syntax": "redistribute <protocol> [<process-id>] [metric <bw> <delay> <rel> <load> <mtu>] [match internal | external 1 | external 2 | nssa-external] [route-map <MAP-NAME>]", "flags": [{"f": "metric <5 values>", "d": "Per-statement seed metric; overrides default-metric"}, {"f": "route-map <NAME>", "d": "Filter which routes get redistributed and optionally set per-route metrics/tags"}, {"f": "match internal external 1 external 2", "d": "OSPF only \u2014 by default IOS redistributes only OSPF internal routes, so O E2 routes are silently dropped unless you add this"}, {"f": "redistribute connected", "d": "Pulls in interfaces NOT covered by a network statement \u2014 the usual clean way to advertise loopbacks"}, {"f": "subnets", "d": "An OSPF-side keyword, NOT valid here. Typing 'subnets' under router eigrp is a common muscle-memory error."}], "sample": "R1(config)#router eigrp 100\nR1(config-router)#redistribute ospf 1 metric 100000 100 255 1 1500 match internal external 1 external 2\nR1(config-router)#redistribute static metric 1000000 10 255 1 1500\nR1(config-router)#end\nR1#show ip eigrp topology 172.16.5.0/24\nEIGRP-IPv4 Topology Entry for AS(100)/ID(1.1.1.1) for 172.16.5.0/24\n  State is Passive, Query origin flag is 1, 1 Successor(s), FD is 51200\n  Descriptor Blocks:\n  10.1.24.4 (GigabitEthernet0/2), from Redistributed, Send flag is 0x0\n      Composite metric is (51200/0), route is External\n      Vector metric:\n        Minimum bandwidth is 100000 Kbit\n        Total delay is 1000 microseconds\n        Reliability is 255/255\n        Load is 1/255\n        Minimum MTU is 1500\n        Hop count is 0\n      External data:\n        Originating router is 1.1.1.1 (this system)\n        AS number of route is 1\n        External protocol is OSPF, external metric is 20\n        Administrator tag is 0 (0x00000000)", "annotations": [{"field": "from Redistributed", "note": "Marks a locally injected route rather than one learned from a neighbour. If a route you expect is missing here, the problem is the redistribute statement, not EIGRP."}, {"field": "Composite metric is (51200/0)", "note": "Reported distance 0 because this router originated it. 51200 = 256 x (10^7/100000 + 1000/10) = 256 x 200 \u2014 the seed metric turned into a composite."}, {"field": "route is External", "note": "External routes carry AD 170 and cannot become feasible successors for internal routes. In a two-way redistribution design this AD gap is what usually prevents (or causes) a loop."}, {"field": "Originating router is 1.1.1.1", "note": "Every external route carries the injecting router's RID plus the source AS and protocol. This is the field you use to find which ASBR injected a rogue prefix."}, {"field": "Administrator tag", "note": "Set a tag with a route-map on injection, then deny that tag on the way back. This is the standard loop-prevention pattern for mutual EIGRP/OSPF redistribution."}, {"field": "match internal external 1 external 2", "note": "Without this, redistributing OSPF into EIGRP quietly ignores every O E1/O E2 route. Classic 'half my routes are missing' call."}], "when": "Merging an OSPF or BGP domain into an EIGRP core, advertising static routes to a firewall, or advertising loopbacks without adding network statements.", "whenNot": "Never redistribute in both directions without tagging and filtering \u2014 you will build a routing loop the first time a link flaps. And do not omit the metric: EIGRP treats a missing seed metric as infinity and drops the routes without an error message.", "safety": "caution", "related": ["eigrpx-default-metric", "eigrpx-distribute-list-route-map", "eigrpx-named-topology-base", "cisco-router-ospf", "cisco-ip-route-static", "cisco-sh-ip-route"], "tags": ["eigrp", "redistribution", "external-routes", "routing", "advanced"], "equivalents": {"juniper": "set policy-options policy-statement OSPF-TO-EIGRP from protocol ospf then accept", "paloalto": "set network virtual-router VR1 protocol redist-profile OSPF-OUT filter type ospf", "linux": "vtysh -c 'configure terminal' -c 'router eigrp 100' -c 'redistribute ospf metric 100000 100 255 1 1500'"}, "sandboxOutput": "R1(config)#router eigrp 100\nR1(config-router)#redistribute ospf 1 metric 100000 100 255 1 1500 match internal external 1 external 2\nR1(config-router)#redistribute static metric 1000000 10 255 1 1500\nR1(config-router)#end\nR1#show ip eigrp topology 172.16.5.0/24\nEIGRP-IPv4 Topology Entry for AS(100)/ID(1.1.1.1) for 172.16.5.0/24\n  State is Passive, Query origin flag is 1, 1 Successor(s), FD is 51200\n  Descriptor Blocks:\n  10.1.24.4 (GigabitEthernet0/2), from Redistributed, Send flag is 0x0\n      Composite metric is (51200/0), route is External\n      Vector metric:\n        Minimum bandwidth is 100000 Kbit\n        Total delay is 1000 microseconds\n        Reliability is 255/255\n        Load is 1/255\n        Minimum MTU is 1500\n        Hop count is 0\n      External data:\n        Originating router is 1.1.1.1 (this system)\n        AS number of route is 1\n        External protocol is OSPF, external metric is 20\n        Administrator tag is 0 (0x00000000)"}, {"id": "eigrpx-default-metric", "vendor": "cisco", "family": "IOS/XE", "mode": "config", "cmd": "default-metric <BW> <DELAY> <RELIABILITY> <LOAD> <MTU>", "aliases": ["default-metric 100000 100 255 1 1500", "default-metric 1000000 10 255 1 1500"], "purpose": "Supplies a fallback seed metric for every redistribute statement in the process that does not carry its own 'metric' keyword. Without a seed metric \u2014 here or on the redistribute line \u2014 EIGRP assigns infinite metric and silently discards the routes.", "tokens": [{"t": "default-metric", "d": "Process-wide seed metric for redistributed routes"}, {"t": "<BW>", "d": "Bandwidth in Kbit/sec (1-4294967295)"}, {"t": "<DELAY>", "d": "Delay in tens of microseconds (0-4294967295)"}, {"t": "<RELIABILITY>", "d": "0-255, where 255 means 100% reliable"}, {"t": "<LOAD>", "d": "1-255, where 1 means unloaded"}, {"t": "<MTU>", "d": "1-65535, conventionally 1500"}], "syntax": "default-metric <bandwidth> <delay> <reliability> <loading> <mtu>", "flags": [{"f": "Precedence", "d": "A 'metric' on the redistribute line beats default-metric; a route-map 'set metric' beats both"}, {"f": "Exception: EIGRP-to-EIGRP", "d": "Redistributing between two EIGRP processes carries the metric across, so no seed is required"}, {"f": "Exception: connected", "d": "'redistribute connected' inherits the interface's real bandwidth/delay and needs no seed"}, {"f": "Pick values deliberately", "d": "A seed of 1000000 10 255 1 1500 makes externals look like a gig link; too attractive a seed can pull traffic away from native internal paths"}], "sample": "R1(config)#router eigrp 100\nR1(config-router)#default-metric 100000 100 255 1 1500\nR1(config-router)#end\nR1#show ip protocols\n*** IP Routing is NSF aware ***\n\nRouting Protocol is \"eigrp 100\"\n  Outgoing update filter list for all interfaces is not set\n  Incoming update filter list for all interfaces is not set\n  Default networks flagged in outgoing updates\n  Default networks accepted from incoming updates\n  Redistributing: static, ospf 1, eigrp 100\n  EIGRP-IPv4 Protocol for AS(100)\n    Metric weight K1=1, K2=0, K3=1, K4=0, K5=0\n    NSF-aware route hold timer is 240\n    Router-ID: 1.1.1.1\n    Topology : 0 (base)\n      Active Timer: 3 min\n      Distance: internal 90 external 170\n      Maximum path: 4\n      Maximum hopcount 100\n      Maximum metric variance 1\n  Default redistribution metric is 100000 100 255 1 1500\n  Automatic Summarization: disabled\n  Maximum path: 4\n  Routing for Networks:\n    10.1.12.0/24\n  Routing Information Sources:\n    Gateway         Distance      Last Update\n    10.1.12.2             90      00:04:11\n  Distance: internal 90 external 170", "annotations": [{"field": "Default redistribution metric is ...", "note": "If this line is absent and your redistribute statements have no metric keyword, that is your missing-routes root cause. Confirm before touching anything else."}, {"field": "Redistributing: static, ospf 1, eigrp 100", "note": "Lists every source currently being injected. 'eigrp 100' always appears \u2014 that is the process redistributing into itself, not a misconfiguration."}, {"field": "Metric weight K1=1, K2=0, K3=1, K4=0, K5=0", "note": "The default K-values. These must match every neighbour or adjacency never forms \u2014 check here first on a link that will not peer."}, {"field": "Maximum metric variance 1", "note": "Variance readback. 1 means equal-cost only; if you configured variance and this still says 1, you applied it to the wrong process or wrong sub-mode."}, {"field": "Maximum hopcount 100", "note": "EIGRP's loop-protection hop limit. Rarely hit, but a route more than 100 hops away is discarded outright."}, {"field": "Routing Information Sources", "note": "Neighbours currently feeding this process, with the AD applied to their routes. A neighbour missing from this list is not exchanging routes even if hellos are flowing."}], "when": "Whenever you have more than one redistribute statement and want a single consistent seed, or as the fast fix when redistributed routes never appear in neighbours' tables.", "whenNot": "Do not rely on it if different sources need different metrics \u2014 put the metric on each redistribute line instead. And do not set an artificially low-cost seed, or externals will out-compete legitimate internal paths after redistribution.", "safety": "caution", "related": ["eigrpx-redistribute", "eigrpx-named-topology-base", "eigrpx-metric-weights", "eigrpx-variance", "cisco-sh-ip-route"], "tags": ["eigrp", "redistribution", "seed-metric", "troubleshooting", "advanced"], "equivalents": {"juniper": "set policy-options policy-statement REDIST then metric 100", "paloalto": "set network virtual-router VR1 protocol ospf export-rules STATIC-OUT metric 100", "linux": "vtysh -c 'configure terminal' -c 'router eigrp 100' -c 'default-metric 100000 100 255 1 1500'"}, "sandboxOutput": "R1(config)#router eigrp 100\nR1(config-router)#default-metric 100000 100 255 1 1500\nR1(config-router)#end\nR1#show ip protocols\n*** IP Routing is NSF aware ***\n\nRouting Protocol is \"eigrp 100\"\n  Outgoing update filter list for all interfaces is not set\n  Incoming update filter list for all interfaces is not set\n  Default networks flagged in outgoing updates\n  Default networks accepted from incoming updates\n  Redistributing: static, ospf 1, eigrp 100\n  EIGRP-IPv4 Protocol for AS(100)\n    Metric weight K1=1, K2=0, K3=1, K4=0, K5=0\n    NSF-aware route hold timer is 240\n    Router-ID: 1.1.1.1\n    Topology : 0 (base)\n      Active Timer: 3 min\n      Distance: internal 90 external 170\n      Maximum path: 4\n      Maximum hopcount 100\n      Maximum metric variance 1\n  Default redistribution metric is 100000 100 255 1 1500\n  Automatic Summarization: disabled\n  Maximum path: 4\n  Routing for Networks:\n    10.1.12.0/24\n  Routing Information Sources:\n    Gateway         Distance      Last Update\n    10.1.12.2             90      00:04:11\n  Distance: internal 90 external 170"}, {"id": "eigrpx-distribute-list-route-map", "vendor": "cisco", "family": "IOS/XE", "mode": "config", "cmd": "distribute-list route-map <MAP-NAME> out <INTERFACE>", "aliases": ["distribute-list route-map EIGRP-OUT out GigabitEthernet0/0", "distribute-list prefix BLOCK-LAB out GigabitEthernet0/0", "distribute-list 21 in GigabitEthernet0/1"], "purpose": "Filters which EIGRP prefixes are advertised or accepted, optionally scoped to one interface or one neighbour. The route-map form also lets you match on tags and metrics, not just prefixes.", "tokens": [{"t": "distribute-list", "d": "Route filter applied to EIGRP updates"}, {"t": "route-map <MAP-NAME>", "d": "Filter definition. Alternatives: an ACL number/name, or 'prefix <PREFIX-LIST>'"}, {"t": "out | in", "d": "Direction. 'out' filters what we advertise; 'in' filters what we install from updates."}, {"t": "<INTERFACE>", "d": "Optional scope. Omit it and the filter applies to every interface in the process."}], "syntax": "distribute-list {<ACL> | prefix <PREFIX-LIST> [gateway <PREFIX-LIST>] | route-map <MAP-NAME>} {in | out} [<INTERFACE>]", "flags": [{"f": "prefix <NAME>", "d": "Prefix-list form \u2014 the right choice when you need exact prefix-length matching"}, {"f": "route-map <NAME>", "d": "Most flexible: match ip address, match tag, match metric"}, {"f": "gateway <PREFIX-LIST>", "d": "Filter based on the advertising neighbour's address as well as the prefix"}, {"f": "in", "d": "Filters routes before they enter the local topology table. The neighbour still sends them \u2014 you just do not install them."}, {"f": "no auto-summary", "d": "Not this command, but the other reason prefixes look wrong. Verify it before blaming a filter."}], "sample": "R1(config)#ip prefix-list BLOCK-LAB seq 5 permit 10.99.0.0/16 le 32\nR1(config)#route-map EIGRP-OUT deny 10\nR1(config-route-map)#match ip address prefix-list BLOCK-LAB\nR1(config-route-map)#exit\nR1(config)#route-map EIGRP-OUT permit 20\nR1(config-route-map)#exit\nR1(config)#router eigrp 100\nR1(config-router)#distribute-list route-map EIGRP-OUT out GigabitEthernet0/0\nR1(config-router)#end\nR1#show run | section router eigrp\nrouter eigrp 100\n distribute-list route-map EIGRP-OUT out GigabitEthernet0/0\n network 10.1.12.0 0.0.0.255\n eigrp router-id 1.1.1.1\nR1#show ip eigrp topology | include 10.99\nP 10.99.7.0/24, 1 successors, FD is 2816\nR1#", "annotations": [{"field": "route-map EIGRP-OUT permit 20 (empty)", "note": "The mandatory catch-all. A route-map ends with an implicit deny, so without an empty permit sequence you filter EVERY prefix and black-hole the neighbour."}, {"field": "10.99.7.0/24 still in the local topology table", "note": "Outbound filtering does not remove the route locally. Verify the filter on the NEIGHBOUR's table, not your own \u2014 the most common false alarm when testing distribute-lists."}, {"field": "le 32 in the prefix-list", "note": "Without 'le 32' the prefix-list matches only an exact /16, so the more-specific /24s sail straight through the deny clause."}, {"field": "Scoped to GigabitEthernet0/0", "note": "Interface scoping is what makes a distribute-list safe: you leak-block toward one peer without affecting the rest of the domain."}, {"field": "Effect on DUAL", "note": "Filtering 'in' means the prefix never becomes a feasible successor, which can turn a fast local repair into a query storm. Prefer 'out' filtering plus summarisation where you can."}], "when": "Preventing a branch from transiting traffic, stopping a partner subnet from leaking into your core, or trimming a chatty lab range out of WAN advertisements.", "whenNot": "Do not use a distribute-list where a summary-address would do the job \u2014 summarisation also bounds query scope, which filtering does not. And never write a route-map filter without a trailing permit clause.", "safety": "caution", "related": ["eigrpx-offset-list", "eigrpx-redistribute", "eigrpx-named-topology-base", "eigrpx-topology-active", "cisco-sh-ip-route"], "tags": ["eigrp", "filtering", "route-map", "prefix-list", "advanced"], "equivalents": {"juniper": "set protocols ospf export BLOCK-LAB", "paloalto": "set network virtual-router VR1 protocol ospf export-rules BLOCK-LAB", "linux": "vtysh -c 'configure terminal' -c 'router eigrp 100' -c 'distribute-list prefix BLOCK-LAB out eth0'"}, "sandboxOutput": "R1(config)#ip prefix-list BLOCK-LAB seq 5 permit 10.99.0.0/16 le 32\nR1(config)#route-map EIGRP-OUT deny 10\nR1(config-route-map)#match ip address prefix-list BLOCK-LAB\nR1(config-route-map)#exit\nR1(config)#route-map EIGRP-OUT permit 20\nR1(config-route-map)#exit\nR1(config)#router eigrp 100\nR1(config-router)#distribute-list route-map EIGRP-OUT out GigabitEthernet0/0\nR1(config-router)#end\nR1#show run | section router eigrp\nrouter eigrp 100\n distribute-list route-map EIGRP-OUT out GigabitEthernet0/0\n network 10.1.12.0 0.0.0.255\n eigrp router-id 1.1.1.1\nR1#show ip eigrp topology | include 10.99\nP 10.99.7.0/24, 1 successors, FD is 2816\nR1#"}, {"id": "eigrpx-offset-list", "vendor": "cisco", "family": "IOS/XE", "mode": "config", "cmd": "offset-list <ACL> {in | out} <OFFSET> [<INTERFACE>]", "aliases": ["offset-list 21 in 100 GigabitEthernet0/1", "offset-list 21 out 1000 GigabitEthernet0/0", "offset-list 0 in 500 GigabitEthernet0/1"], "purpose": "Adds a fixed value to the composite metric of matched EIGRP routes, in or out, optionally per interface. It is the surgical way to make one path less attractive without touching interface bandwidth or delay, which would affect every protocol on the link.", "tokens": [{"t": "offset-list", "d": "Metric adjustment filter"}, {"t": "<ACL>", "d": "Standard/extended ACL number or name selecting which prefixes to offset. 0 means all routes."}, {"t": "in | out", "d": "'in' penalises routes received on the interface; 'out' penalises what we advertise"}, {"t": "<OFFSET>", "d": "Value added directly to the composite metric (0-2147483647)"}, {"t": "<INTERFACE>", "d": "Optional scope; omit to apply process-wide"}], "syntax": "offset-list {<ACL-NUMBER> | <ACL-NAME> | 0} {in | out} <OFFSET> [<INTERFACE-TYPE> <INTERFACE-NUMBER>]", "flags": [{"f": "0", "d": "ACL 0 is a shorthand meaning 'every route'"}, {"f": "in", "d": "Most common: locally de-prefer a path without asking the neighbour to change anything"}, {"f": "out", "d": "Makes the neighbour see a worse metric from us \u2014 useful for steering return traffic"}, {"f": "<OFFSET> sizing", "d": "The offset is added to the raw composite metric, so on gigabit links (metrics in the low thousands) an offset of 100 is a nudge and 100000 is a sledgehammer"}], "sample": "R1(config)#access-list 21 permit 10.20.20.0 0.0.0.255\nR1(config)#router eigrp 100\nR1(config-router)#offset-list 21 in 100 GigabitEthernet0/1\nR1(config-router)#end\nR1#show ip eigrp topology 10.20.20.0/24\nEIGRP-IPv4 Topology Entry for AS(100)/ID(1.1.1.1) for 10.20.20.0/24\n  State is Passive, Query origin flag is 1, 1 Successor(s), FD is 3072\n  Descriptor Blocks:\n  10.1.12.2 (GigabitEthernet0/0), from 10.1.12.2, Send flag is 0x0\n      Composite metric is (3072/2816), route is Internal\n      Vector metric:\n        Minimum bandwidth is 1000000 Kbit\n        Total delay is 20 microseconds\n        Reliability is 255/255\n        Load is 1/255\n        Minimum MTU is 1500\n        Hop count is 1\n  10.1.13.3 (GigabitEthernet0/1), from 10.1.13.3, Send flag is 0x0\n      Composite metric is (3684/2816), route is Internal\n      Vector metric:\n        Minimum bandwidth is 1000000 Kbit\n        Total delay is 40 microseconds\n        Reliability is 255/255\n        Load is 1/255\n        Minimum MTU is 1500\n        Hop count is 1", "annotations": [{"field": "Composite metric is (3684/2816)", "note": "3584 + the offset of 100. The offset lands on the composite metric only \u2014 the vector metric (bandwidth, delay, MTU) is untouched, which is why the two no longer add up if you recompute by hand."}, {"field": "Reported distance 2816 unchanged", "note": "An inbound offset does not change what the neighbour reported. Feasibility is still judged on 2816 < 3072, so an offset can never turn a feasible successor into a loop."}, {"field": "Interaction with variance", "note": "Raising a path's metric with an offset can push it outside the variance window and quietly remove it from the RIB. Recheck 'show ip route' after every offset change."}, {"field": "Versus 'delay' on the interface", "note": "Changing interface delay affects every EIGRP prefix over that link and any other protocol reading interface delay. offset-list touches only the prefixes your ACL selects."}, {"field": "ACL direction semantics", "note": "The ACL matches the ROUTE (destination prefix), not traffic. A permit entry means 'offset this prefix'; anything not permitted is left alone."}], "when": "Steering a specific subnet away from a metered or high-latency circuit, or de-preferring one path during a maintenance drain without shutting the link.", "whenNot": "Not a substitute for real design. If you find yourself stacking offset-lists across many routers to hold a topology together, fix bandwidth/delay or the summarisation boundary instead. Also avoid offsets so large they wrap past variance and knock the path out of the RIB entirely.", "safety": "caution", "related": ["eigrpx-variance", "eigrpx-distribute-list-route-map", "eigrpx-metric-weights", "eigrpx-named-topology-base", "cisco-sh-ip-route"], "tags": ["eigrp", "metric", "traffic-engineering", "path-selection", "advanced"], "equivalents": {"juniper": "set policy-options policy-statement PENALISE then metric add 100", "paloalto": "set network virtual-router VR1 protocol ospf export-rules PENALISE metric 200", "linux": "vtysh -c 'configure terminal' -c 'router eigrp 100' -c 'offset-list 21 in 100 eth1'"}, "sandboxOutput": "R1(config)#access-list 21 permit 10.20.20.0 0.0.0.255\nR1(config)#router eigrp 100\nR1(config-router)#offset-list 21 in 100 GigabitEthernet0/1\nR1(config-router)#end\nR1#show ip eigrp topology 10.20.20.0/24\nEIGRP-IPv4 Topology Entry for AS(100)/ID(1.1.1.1) for 10.20.20.0/24\n  State is Passive, Query origin flag is 1, 1 Successor(s), FD is 3072\n  Descriptor Blocks:\n  10.1.12.2 (GigabitEthernet0/0), from 10.1.12.2, Send flag is 0x0\n      Composite metric is (3072/2816), route is Internal\n      Vector metric:\n        Minimum bandwidth is 1000000 Kbit\n        Total delay is 20 microseconds\n        Reliability is 255/255\n        Load is 1/255\n        Minimum MTU is 1500\n        Hop count is 1\n  10.1.13.3 (GigabitEthernet0/1), from 10.1.13.3, Send flag is 0x0\n      Composite metric is (3684/2816), route is Internal\n      Vector metric:\n        Minimum bandwidth is 1000000 Kbit\n        Total delay is 40 microseconds\n        Reliability is 255/255\n        Load is 1/255\n        Minimum MTU is 1500\n        Hop count is 1"}, {"id": "eigrpx-metric-weights", "vendor": "cisco", "family": "IOS/XE", "mode": "config", "cmd": "metric weights <TOS> <K1> <K2> <K3> <K4> <K5>", "aliases": ["metric weights 0 1 0 1 0 0", "metric weights 0 1 1 1 0 0", "metric weights 0 0 0 1 0 0"], "purpose": "Changes which components of the vector metric contribute to the EIGRP composite metric. The defaults (K1=1, K3=1, everything else 0) mean bandwidth and delay only. K-values are part of the hello and MUST match on both ends or no adjacency forms.", "tokens": [{"t": "metric weights", "d": "Set the K coefficients for the composite metric formula"}, {"t": "<TOS>", "d": "Type of Service. Must be 0 \u2014 no other value has ever been implemented."}, {"t": "<K1>", "d": "Bandwidth weight (default 1)"}, {"t": "<K2>", "d": "Load weight (default 0)"}, {"t": "<K3>", "d": "Delay weight (default 1)"}, {"t": "<K4>", "d": "Reliability weight (default 0) \u2014 only takes effect when K5 is non-zero"}, {"t": "<K5>", "d": "Reliability divisor weight (default 0). If K5=0 the whole reliability term is skipped."}], "syntax": "metric weights <tos> <k1> <k2> <k3> <k4> <k5> [<k6>]", "flags": [{"f": "Default", "d": "metric weights 0 1 0 1 0 0"}, {"f": "Formula", "d": "metric = [K1*BW + (K2*BW)/(256-Load) + K3*Delay] * [K5/(Reliability+K4)] when K5 != 0; the trailing bracket is omitted when K5 = 0"}, {"f": "K2 (load)", "d": "Makes the metric track instantaneous interface load \u2014 the metric becomes unstable and DUAL churns. Effectively never used in production."}, {"f": "K4/K5 (reliability)", "d": "Same instability problem. Reliability is a 5-minute exponential average that changes constantly."}, {"f": "K6", "d": "Named mode with wide metrics adds K6 for jitter/energy extended attributes. Leave it 0 unless you are running EIGRP OTP or SD-WAN style extensions."}, {"f": "Named-mode location", "d": "In named mode this command lives under 'address-family', NOT under 'topology base'"}], "sample": "R1(config)#router eigrp 100\nR1(config-router)#metric weights 0 1 0 1 1 0\nR1(config-router)#\n*Jul 25 14:31:47.117: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.12.2 (GigabitEthernet0/0) is down: metric changed\n*Jul 25 14:31:53.402: %DUAL-5-NBRCHANGE: EIGRP-IPv4 100: Neighbor 10.1.12.2 (GigabitEthernet0/0) is down: K-value mismatch\nR1(config-router)#end\nR1#show ip eigrp neighbors\nEIGRP-IPv4 Neighbors for AS(100)\nH   Address                 Interface              Hold Uptime   SRTT   RTO  Q  Seq\n                                                   (sec)         (ms)       Cnt Num\n\nR1#show ip protocols | include Metric weight\n    Metric weight K1=1, K2=0, K3=1, K4=1, K5=0", "annotations": [{"field": "is down: K-value mismatch", "note": "The definitive log line. It means hellos are arriving and being parsed \u2014 the link, subnet, ASN and authentication are all fine \u2014 but the K-vectors differ. Compare 'show ip protocols' on both ends."}, {"field": "is down: metric changed", "note": "The local reset that fires the instant you change K-values. Every adjacency in the AS bounces, on every interface, at once."}, {"field": "Empty neighbor table afterwards", "note": "Adjacency never returns until the far end matches. If you do this over the link you are managing, you lose the box \u2014 change it from console or out-of-band only."}, {"field": "K4=1, K5=0 in this example", "note": "This change has ZERO effect on the metric arithmetic, because the reliability term is skipped when K5=0. It still breaks every adjacency. That asymmetry is exactly why K-value edits are so dangerous."}, {"field": "Diagnostic value", "note
